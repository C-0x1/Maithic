  <text x="40.0" y="44.0" font-size="22" fill="#14162B" font-weight="700" textLength="484.1" lengthAdjust="spacingAndGlyphs">Draft, screen, compile, run: the synthesis loop</text>
  <text x="40.0" y="69.0" font-size="13.5" fill="#5B6477" font-family="Menlo, Consolas, monospace" textLength="276.3" lengthAdjust="spacingAndGlyphs">maithic algo synth TASK --rounds 3</text>
  <text x="54.0" y="119.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="44.3" lengthAdjust="spacingAndGlyphs">1  Draft</text>
  <text x="54.0" y="155.0" font-size="13" fill="#14162B" textLength="142.4" lengthAdjust="spacingAndGlyphs">A model writes one Lean</text>
  <text x="54.0" y="173.0" font-size="13" fill="#14162B" textLength="140.2" lengthAdjust="spacingAndGlyphs">definition for the task: its</text>
  <text x="54.0" y="191.0" font-size="13" fill="#14162B" textLength="139.5" lengthAdjust="spacingAndGlyphs">name, its description, its</text>
  <text x="54.0" y="209.0" font-size="13" fill="#14162B" textLength="59.3" lengthAdjust="spacingAndGlyphs">examples.</text>
  <text x="64.0" y="281.9" font-size="11.5" fill="#14162B" font-family="Menlo, Consolas, monospace" textLength="48.5" lengthAdjust="spacingAndGlyphs">a model</text>
  <text x="301.5" y="119.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="58.4" lengthAdjust="spacingAndGlyphs">2  Screen</text>
  <text x="301.5" y="155.0" font-size="13" fill="#14162B" textLength="131.5" lengthAdjust="spacingAndGlyphs">One def of the function</text>
  <text x="301.5" y="173.0" font-size="13" fill="#14162B" textLength="56.4" lengthAdjust="spacingAndGlyphs">asked for.</text>
  <text x="301.5" y="197.0" font-size="13" fill="#14162B" textLength="161.6" lengthAdjust="spacingAndGlyphs">No partial, unsafe, IO, sorry,</text>
  <text x="301.5" y="215.0" font-size="13" fill="#14162B" textLength="104.0" lengthAdjust="spacingAndGlyphs">axiom, attribute or</text>
  <text x="301.5" y="233.0" font-size="13" fill="#14162B" textLength="161.1" lengthAdjust="spacingAndGlyphs">command: Lean will run this</text>
  <text x="301.5" y="251.0" font-size="13" fill="#14162B" textLength="24.6" lengthAdjust="spacingAndGlyphs">text.</text>
  <text x="311.5" y="281.9" font-size="11.5" fill="#14162B" font-family="Menlo, Consolas, monospace" textLength="131.5" lengthAdjust="spacingAndGlyphs">before Lean sees it</text>
  <text x="549.0" y="119.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="66.9" lengthAdjust="spacingAndGlyphs">3  Compile</text>
  <text x="549.0" y="155.0" font-size="13" fill="#14162B" textLength="114.9" lengthAdjust="spacingAndGlyphs">Lean elaborates the</text>
  <text x="549.0" y="173.0" font-size="13" fill="#14162B" textLength="55.7" lengthAdjust="spacingAndGlyphs">definition.</text>
  <text x="549.0" y="197.0" font-size="13" fill="#14162B" textLength="147.4" lengthAdjust="spacingAndGlyphs">It must be well typed, and</text>
  <text x="549.0" y="215.0" font-size="13" fill="#14162B" textLength="156.1" lengthAdjust="spacingAndGlyphs">Lean must see that it ends.</text>
  <text x="559.0" y="281.9" font-size="11.5" fill="#14162B" font-family="Menlo, Consolas, monospace" textLength="27.7" lengthAdjust="spacingAndGlyphs">Lean</text>
  <text x="796.5" y="119.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="38.9" lengthAdjust="spacingAndGlyphs">4  Run</text>
  <text x="796.5" y="155.0" font-size="13" fill="#14162B" textLength="162.6" lengthAdjust="spacingAndGlyphs">Every example is evaluated,</text>
  <text x="796.5" y="173.0" font-size="13" fill="#14162B" textLength="152.5" lengthAdjust="spacingAndGlyphs">and the value is compared</text>
  <text x="796.5" y="191.0" font-size="13" fill="#14162B" textLength="140.9" lengthAdjust="spacingAndGlyphs">with what was expected.</text>
  <text x="806.5" y="281.9" font-size="11.5" fill="#14162B" font-family="Menlo, Consolas, monospace" textLength="110.8" lengthAdjust="spacingAndGlyphs">Lean, with #eval</text>
  <text x="520.0" y="354.0" font-size="12.5" fill="#5B6477" text-anchor="middle" textLength="654.8" lengthAdjust="spacingAndGlyphs">what went wrong goes back, word for word: the reason for a refusal, Lean's error, or the example with the value it gave</text>
  <text x="82.0" y="401.0" font-size="13" fill="#14162B" textLength="779.5" lengthAdjust="spacingAndGlyphs">Accepted: the function compiles and every example gives what was expected. That is a test, and the command says tested, not proved.</text>
  <text x="82.0" y="425.0" font-size="13" fill="#14162B" textLength="762.9" lengthAdjust="spacingAndGlyphs">Not accepted: the rounds are used up, or the model returned a version it had returned before. The record keeps every draft and what</text>
  <text x="82.0" y="443.0" font-size="13" fill="#14162B" textLength="106.3" lengthAdjust="spacingAndGlyphs">Lean said about it.</text>
</svg>
