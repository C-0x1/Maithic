<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 490" role="img" aria-labelledby="synth-loop-t synth-loop-d" font-family="'Helvetica Neue', Arial, sans-serif">
  <title id="synth-loop-t">The synthesis loop</title>
  <desc id="synth-loop-d">Four steps in a row with a path that leads back from the last three to the first. Draft: a model writes one Lean definition for the task. Screen: the draft has to be one definition of the function that was asked for, with nothing that could act; a refused draft never reaches Lean. Compile: Lean elaborates the definition. Run: Lean evaluates every example and compares the value with what was expected. Whatever goes wrong goes back to the model with the draft, for a correction, a bounded number of times.</desc>
