<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="t d" font-family="'Helvetica Neue', Arial, sans-serif">
  <title id="t">Searching a proof one tactic at a time</title>
  <desc id="d">A tree of proof states for the statement p and q. From the first state, the tactic exact hp fails and constructor succeeds, giving a state with two goals. From there exact hq fails and exact hp succeeds, leaving one goal, which exact hq closes. The script that was found is then checked as a whole declaration by the kernel before the theorem is called verified.</desc>
  <defs>
    <marker id="ps-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0FA89B"/>
    </marker>
    <marker id="ps-no" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#E5484D"/>
    </marker>
    <marker id="ps-next" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5B6477"/>
    </marker>
  </defs>
  <rect width="960" height="430" fill="#FAF8F4"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#14162B" textLength="391.2" lengthAdjust="spacingAndGlyphs">Searching a proof one tactic at a time</text>
  <text x="40" y="68" font-size="14" fill="#5B6477" textLength="714.4" lengthAdjust="spacingAndGlyphs">The Bridge keeps every proof state. A tactic never changes a state; it makes a new one, or fails and costs one step.</text>

  <g font-size="13">
    <!-- failures, above the states they were tried on -->
    <g transform="translate(60 88)">
      <rect width="150" height="50" rx="8" fill="#FFFFFF" stroke="#E5484D" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="12" y="21" font-family="Menlo, Consolas, monospace" font-size="12" fill="#E5484D" textLength="52.8" lengthAdjust="spacingAndGlyphs">exact hp</text>
      <text x="12" y="40" fill="#E5484D" textLength="87.4" lengthAdjust="spacingAndGlyphs">Type mismatch</text>
    </g>
    <line x1="135" y1="166" x2="135" y2="142" stroke="#E5484D" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ps-no)"/>
    <g transform="translate(330 88)">
      <rect width="150" height="50" rx="8" fill="#FFFFFF" stroke="#E5484D" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="12" y="21" font-family="Menlo, Consolas, monospace" font-size="12" fill="#E5484D" textLength="52.8" lengthAdjust="spacingAndGlyphs">exact hq</text>
      <text x="12" y="40" fill="#E5484D" textLength="87.4" lengthAdjust="spacingAndGlyphs">Type mismatch</text>
    </g>
    <line x1="405" y1="166" x2="405" y2="142" stroke="#E5484D" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ps-no)"/>

    <!-- states -->
    <g transform="translate(40 168)">
      <rect width="170" height="118" rx="10" fill="#FFFFFF" stroke="#2B2F77" stroke-width="2"/>
      <text x="14" y="24" font-size="12" font-weight="700" fill="#2B2F77" textLength="47.6" lengthAdjust="spacingAndGlyphs">STATE 2</text>
      <g font-family="Menlo, Consolas, monospace" font-size="12" fill="#14162B">
        <text x="14" y="48" textLength="39.6" lengthAdjust="spacingAndGlyphs">hp : p</text>
        <text x="14" y="66" textLength="39.6" lengthAdjust="spacingAndGlyphs">hq : q</text>
        <text x="14" y="92" textLength="46.2" lengthAdjust="spacingAndGlyphs">⊢ p ∧ q</text>
      </g>
    </g>
    <text x="260" y="218" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0FA89B" textLength="72.6" lengthAdjust="spacingAndGlyphs">constructor</text>
    <line x1="214" y1="230" x2="304" y2="230" stroke="#0FA89B" stroke-width="2" marker-end="url(#ps-ok)"/>

    <g transform="translate(310 168)">
      <rect width="170" height="118" rx="10" fill="#FFFFFF" stroke="#2B2F77" stroke-width="2"/>
      <text x="14" y="24" font-size="12" font-weight="700" fill="#2B2F77" textLength="113.6" lengthAdjust="spacingAndGlyphs">STATE 3 · two goals</text>
      <g font-family="Menlo, Consolas, monospace" font-size="12" fill="#14162B">
        <text x="14" y="50" textLength="52.8" lengthAdjust="spacingAndGlyphs">left   ⊢ p</text>
        <text x="14" y="70" textLength="59.4" lengthAdjust="spacingAndGlyphs">right  ⊢ q</text>
      </g>
      <text x="14" y="102" font-size="11" fill="#5B6477" textLength="140.0" lengthAdjust="spacingAndGlyphs">goals keep their case names</text>
    </g>
    <text x="530" y="218" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0FA89B" textLength="52.8" lengthAdjust="spacingAndGlyphs">exact hp</text>
    <line x1="484" y1="230" x2="574" y2="230" stroke="#0FA89B" stroke-width="2" marker-end="url(#ps-ok)"/>

    <g transform="translate(580 168)">
      <rect width="130" height="118" rx="10" fill="#FFFFFF" stroke="#2B2F77" stroke-width="2"/>
      <text x="14" y="24" font-size="12" font-weight="700" fill="#2B2F77" textLength="47.6" lengthAdjust="spacingAndGlyphs">STATE 4</text>
      <g font-family="Menlo, Consolas, monospace" font-size="12" fill="#14162B">
        <text x="14" y="50" textLength="59.4" lengthAdjust="spacingAndGlyphs">right  ⊢ q</text>
      </g>
      <text x="14" y="102" font-size="11" fill="#5B6477" textLength="59.9" lengthAdjust="spacingAndGlyphs">one goal left</text>
    </g>
    <text x="748" y="218" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0FA89B" textLength="52.8" lengthAdjust="spacingAndGlyphs">exact hq</text>
    <line x1="714" y1="230" x2="780" y2="230" stroke="#0FA89B" stroke-width="2" marker-end="url(#ps-ok)"/>

    <g transform="translate(786 168)">
      <rect width="134" height="118" rx="10" fill="#FFFFFF" stroke="#F0A92E" stroke-width="2.5"/>
      <text x="14" y="24" font-size="12" font-weight="700" fill="#14162B" textLength="47.6" lengthAdjust="spacingAndGlyphs">STATE 5</text>
      <text x="14" y="50" fill="#14162B" textLength="49.2" lengthAdjust="spacingAndGlyphs">no goals</text>
      <text x="14" y="86" font-size="11" fill="#5B6477" textLength="91.7" lengthAdjust="spacingAndGlyphs">a script that works,</text>
      <text x="14" y="102" font-size="11" fill="#5B6477" textLength="85.6" lengthAdjust="spacingAndGlyphs">not yet a theorem</text>
    </g>
  </g>

  <line x1="853" y1="288" x2="853" y2="328" stroke="#5B6477" stroke-width="1.5" marker-end="url(#ps-next)"/>
  <g transform="translate(40 334)">
    <rect width="880" height="76" rx="10" fill="#0FA89B"/>
    <text x="20" y="30" font-size="15" font-weight="700" fill="#FFFFFF" textLength="603.5" lengthAdjust="spacingAndGlyphs">The script is written out as a whole declaration and checked like any other candidate</text>
    <text x="20" y="56" font-size="13" fill="#FFFFFF" font-family="Menlo, Consolas, monospace" textLength="636.4" lengthAdjust="spacingAndGlyphs">theorem pair (p q : Prop) (hp : p) (hq : q) : p ∧ q := by constructor; exact hp; exact hq</text>
  </g>
</svg>
