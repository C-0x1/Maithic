<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 516" role="img" aria-labelledby="install-profiles-t install-profiles-d" font-family="'Helvetica Neue', Arial, sans-serif">
  <title id="install-profiles-t">Which commands need which toolchains</title>
  <desc id="install-profiles-d">A table. With OCaml and Lean alone: prove, check, refute, formalize, council, review, mend, blueprint, search, intel, corpus and bench. With Julia as well: the oracles, the tactic model, the verification of networks and the differential test of algorithms. With R as well: the statistics and the figures.</desc>
