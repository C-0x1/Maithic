  <text x="40.0" y="44.0" font-size="22" fill="#14162B" font-weight="700" textLength="676.8" lengthAdjust="spacingAndGlyphs">Two toolchains for the core, two more for numbers and statistics</text>
  <text x="40.0" y="69.0" font-size="13.5" fill="#5B6477" font-family="Menlo, Consolas, monospace" textLength="113.8" lengthAdjust="spacingAndGlyphs">maithic doctor</text>
  <text x="578.3" y="116.0" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle" textLength="98.6" lengthAdjust="spacingAndGlyphs">OCaml and Lean</text>
  <text x="715.0" y="116.0" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle" textLength="28.5" lengthAdjust="spacingAndGlyphs">Julia</text>
  <text x="851.7" y="116.0" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle" textLength="9.0" lengthAdjust="spacingAndGlyphs">R</text>
  <text x="54.0" y="149.5" font-size="13" fill="#14162B" textLength="251.5" lengthAdjust="spacingAndGlyphs">prove, check, tree, refute, formalize, council</text>
  <text x="54.0" y="183.5" font-size="13" fill="#14162B" textLength="179.9" lengthAdjust="spacingAndGlyphs">review, mend, blueprint, search</text>
  <text x="54.0" y="217.5" font-size="13" fill="#14162B" textLength="206.7" lengthAdjust="spacingAndGlyphs">intel, corpus, bench run, bench gate</text>
  <text x="54.0" y="251.5" font-size="13" fill="#14162B" textLength="271.7" lengthAdjust="spacingAndGlyphs">oracle solve, prove --oracle, the solver of refute</text>
  <text x="54.0" y="285.5" font-size="13" fill="#14162B" textLength="115.6" lengthAdjust="spacingAndGlyphs">guide, prove --guide</text>
  <text x="54.0" y="319.5" font-size="13" fill="#14162B" textLength="149.8" lengthAdjust="spacingAndGlyphs">nnv verify, algo differential</text>
  <text x="54.0" y="353.5" font-size="13" fill="#14162B" textLength="257.9" lengthAdjust="spacingAndGlyphs">statistics and figures: maithicstats, maithicviz</text>
  <text x="56.0" y="409.0" font-size="13" fill="#14162B" textLength="747.3" lengthAdjust="spacingAndGlyphs">The OCaml code uses only the libraries that ship with the compiler, and the Julia packages only Julia's standard library, so there is</text>
  <text x="56.0" y="427.0" font-size="13" fill="#14162B" textLength="125.0" lengthAdjust="spacingAndGlyphs">nothing else to install.</text>
  <text x="56.0" y="451.0" font-size="13" fill="#14162B" textLength="711.0" lengthAdjust="spacingAndGlyphs">maithic doctor lists every component with its version, starts the Bridge, runs its self-test, and says what to do about anything</text>
  <text x="56.0" y="469.0" font-size="13" fill="#14162B" textLength="86.0" lengthAdjust="spacingAndGlyphs">that is missing.</text>
</svg>
