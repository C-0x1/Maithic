<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 976 660" width="976" height="660" role="img" aria-label="A terminal session: a council works on the theorem that the first n odd numbers add up to n squared. The verifier examines the statement; the researcher names lemmas, four of five of which exist; the prover's first two proofs are rejected by Lean; the critic explains why; the prover's next proof is accepted by Lean's kernel and the claim is verified.">
  <title>A terminal session: a council works on the theorem that the first n odd numbers add up to n squared. The verifier examines the statement; the researcher names lemmas, four of five of which exist; the prover's first two proofs are rejected by Lean; the critic explains why; the prover's next proof is accepted by Lean's kernel and the claim is verified.</title>
  <rect width="976" height="660" rx="10" fill="#14162B"/>
  <path d="M0 10a10 10 0 0 1 10-10h956a10 10 0 0 1 10 10v26h-976z" fill="#1E2142"/>
  <circle cx="22" cy="18" r="5.5" fill="#F26D72"/>
  <circle cx="40" cy="18" r="5.5" fill="#F0A92E"/>
  <circle cx="58" cy="18" r="5.5" fill="#57C98F"/>
  <text x="488" y="23" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8A90A6">maithic council</text>
  <g font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13">
    <text x="22.00" y="58" textLength="7.83" lengthAdjust="spacingAndGlyphs" fill="#2CC4B6" font-weight="bold">$</text>
    <text x="37.66" y="58" textLength="289.71" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3" font-weight="bold">maithic council examples/council.lean</text>
    <text x="22.00" y="77" textLength="78.30" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3" font-weight="bold">council on</text>
    <text x="108.13" y="77" textLength="125.28" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3" font-weight="bold">sumOdd_eq_square</text>
    <text x="249.07" y="77" textLength="187.92" lengthAdjust="spacingAndGlyphs" fill="#8A90A6">examples/council.lean:15</text>
    <text x="37.66" y="96" textLength="414.99" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">theorem sumOdd_eq_square (n : Nat) : sumOdd n = n * n</text>
    <text x="22.00" y="134" textLength="86.13" lengthAdjust="spacingAndGlyphs" fill="#8A90A6">examination</text>
    <text x="37.66" y="153" textLength="62.64" lengthAdjust="spacingAndGlyphs" fill="#2CC4B6">verifier</text>
    <text x="131.62" y="153" textLength="54.81" lengthAdjust="spacingAndGlyphs" fill="#8A90A6">examine</text>
    <text x="209.92" y="153" textLength="657.72" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">the statement is well formed; no counterexample was found; automation found no proof</text>
    <text x="22.00" y="191" textLength="54.81" lengthAdjust="spacingAndGlyphs" fill="#8A90A6">round 1</text>
    <text x="37.66" y="210" textLength="78.30" lengthAdjust="spacingAndGlyphs" fill="#2CC4B6">researcher</text>
    <text x="131.62" y="210" textLength="62.64" lengthAdjust="spacingAndGlyphs" fill="#8A90A6">research</text>
    <text x="209.92" y="210" textLength="321.03" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">4 of 5 names exist in the library; 1 idea</text>
    <text x="37.66" y="229" textLength="46.98" lengthAdjust="spacingAndGlyphs" fill="#2CC4B6">prover</text>
    <text x="131.62" y="229" textLength="39.15" lengthAdjust="spacingAndGlyphs" fill="#8A90A6">prove</text>
    <text x="209.92" y="229" textLength="140.94" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">2 candidate proofs</text>
    <text x="37.66" y="248" textLength="62.64" lengthAdjust="spacingAndGlyphs" fill="#2CC4B6">verifier</text>
    <text x="131.62" y="248" textLength="46.98" lengthAdjust="spacingAndGlyphs" fill="#8A90A6">verify</text>
    <text x="209.92" y="248" textLength="203.58" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">Lean rejected all 2 proofs</text>
    <text x="37.66" y="267" textLength="46.98" lengthAdjust="spacingAndGlyphs" fill="#2CC4B6">critic</text>
    <text x="131.62" y="267" textLength="62.64" lengthAdjust="spacingAndGlyphs" fill="#8A90A6">critique</text>
    <text x="209.92" y="267" textLength="399.33" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">a diagnosis of 2 rejected proofs, with 1 suggestion</text>
    <text x="22.00" y="305" textLength="54.81" lengthAdjust="spacingAndGlyphs" fill="#8A90A6">round 2</text>
    <text x="37.66" y="324" textLength="46.98" lengthAdjust="spacingAndGlyphs" fill="#2CC4B6">prover</text>
    <text x="131.62" y="324" textLength="39.15" lengthAdjust="spacingAndGlyphs" fill="#8A90A6">prove</text>
    <text x="209.92" y="324" textLength="133.11" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">1 candidate proof</text>
    <text x="37.66" y="343" textLength="62.64" lengthAdjust="spacingAndGlyphs" fill="#2CC4B6">verifier</text>
    <text x="131.62" y="343" textLength="46.98" lengthAdjust="spacingAndGlyphs" fill="#8A90A6">verify</text>
    <text x="209.92" y="343" textLength="266.22" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">Lean accepted a proof (1 examined)</text>
    <text x="22.00" y="381" textLength="62.64" lengthAdjust="spacingAndGlyphs" fill="#57C98F">verified</text>
    <text x="100.30" y="381" textLength="853.47" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">Lean's kernel accepted proof 11, posted by the prover in round 2. It rests on the axioms Quot.sound, propext.</text>
    <text x="37.66" y="419" textLength="430.65" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">/-- The first `n` odd numbers add up to `n` squared. -/</text>
    <text x="37.66" y="438" textLength="461.97" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">theorem sumOdd_eq_square (n : Nat) : sumOdd n = n * n := by</text>
    <text x="53.32" y="457" textLength="125.28" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">induction n with</text>
    <text x="53.32" y="476" textLength="101.79" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">| zero =&gt; rfl</text>
    <text x="53.32" y="495" textLength="109.62" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">| succ k ih =&gt;</text>
    <text x="68.98" y="514" textLength="391.50" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">simp only [sumOdd, ih, Nat.succ_mul, Nat.mul_succ]</text>
    <text x="68.98" y="533" textLength="39.15" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">omega</text>
    <text x="22.00" y="571" textLength="516.78" lengthAdjust="spacingAndGlyphs" fill="#8A90A6">set aside, not part of the answer: 1 definition, 2 proofs, 2 notes</text>
    <text x="22.00" y="609" textLength="610.74" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">verified: proof 11, by the prover in round 2 (4 model calls, 24 calls to Lean)</text>
    <text x="22.00" y="628" textLength="454.14" lengthAdjust="spacingAndGlyphs" fill="#8A90A6">the file was not changed; --write writes the proof into it</text>
  </g>
</svg>
