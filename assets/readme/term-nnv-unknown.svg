    <text x="22.00" y="343" textLength="62.64" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">verifier</text>
    <text x="100.30" y="343" textLength="187.92" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">claims unknown (3051 ms)</text>
    <text x="22.00" y="362" textLength="31.32" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">Lean</text>
    <text x="100.30" y="362" textLength="321.03" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">was not asked: there is no claim to check</text>
    <text x="22.00" y="381" textLength="900.45" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">unknown: the bounds are too loose to show the property, and no tested point of the input box leaves the claimed box</text>
  </g>
</svg>
