    <text x="100.30" y="77" textLength="305.37" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">absolute value: 2 layer(s), 3 neuron(s)</text>
    <text x="22.00" y="96" textLength="62.64" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">property</text>
    <text x="100.30" y="96" textLength="321.03" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">on [-2, 3] the output stays within [0, 6]</text>
    <text x="37.66" y="115" textLength="70.47" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">inputs in</text>
    <text x="131.62" y="115" textLength="54.81" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">[-2, 3]</text>
    <text x="37.66" y="134" textLength="78.30" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">outputs in</text>
