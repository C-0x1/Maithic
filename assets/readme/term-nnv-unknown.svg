<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 944 413" width="944" height="413" role="img" aria-label="A terminal session: maithic nnv verify decides two more properties of the absolute-value network on the inputs from -2 to 3. That the output stays within 0 and 6 is verified, and Lean's kernel accepts the theorem. That it stays within 0 and 4 is answered with unknown: the bounds are too loose to show the property and no tested point leaves the box, so Lean is not asked and nothing is claimed.">
  <title>A terminal session: maithic nnv verify decides two more properties of the absolute-value network on the inputs from -2 to 3. That the output stays within 0 and 6 is verified, and Lean's kernel accepts the theorem. That it stays within 0 and 4 is answered with unknown: the bounds are too loose to show the property and no tested point leaves the box, so Lean is not asked and nothing is claimed.</title>
  <rect width="944" height="413" rx="10" fill="#14162B"/>
