    <text x="22.00" y="153" textLength="62.64" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">verifier</text>
    <text x="100.30" y="153" textLength="195.75" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">claims verified (2714 ms)</text>
    <text x="22.00" y="172" textLength="31.32" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">Lean</text>
    <text x="100.30" y="172" textLength="375.84" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">accepted Maithic.NNV.Job.property_holds (471 ms)</text>
    <text x="37.66" y="191" textLength="642.06" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">Maithic.NN.Holds Maithic.NNV.Job.net Maithic.NNV.Job.input Maithic.NNV.Job.claimed</text>
    <text x="22.00" y="210" textLength="869.13" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">verified: Lean's kernel accepted Maithic.NNV.Job.property_holds (axioms: propext, Classical.choice, Quot.sound)</text>
    <text x="22.00" y="248" textLength="7.83" lengthAdjust="spacingAndGlyphs" fill="#2CC4B6" font-weight="bold">$</text>
    <text x="37.66" y="248" textLength="681.21" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3" font-weight="bold">maithic nnv verify examples/nnv/absolute-value.json examples/nnv/beyond-the-bounds.json</text>
    <text x="22.00" y="267" textLength="54.81" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">network</text>
    <text x="100.30" y="267" textLength="305.37" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">absolute value: 2 layer(s), 3 neuron(s)</text>
    <text x="22.00" y="286" textLength="62.64" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">property</text>
    <text x="100.30" y="286" textLength="321.03" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">on [-2, 3] the output stays within [0, 4]</text>
