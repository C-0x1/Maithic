<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 438" role="img" aria-labelledby="screen-rules-t screen-rules-d" font-family="'Helvetica Neue', Arial, sans-serif">
  <title id="screen-rules-t">What the screen refuses before Lean sees it</title>
  <desc id="screen-rules-d">Six cards, one for each kind of text that the screen refuses in a candidate from a model. Commands that run something, such as #eval, #print, run_cmd and initialize. New declarations, such as def, theorem, axiom, instance and inductive. Meta-programs and syntax: elab, macro, syntax, notation, run_tac. Options and scope: set_option, import, open, namespace, attribute. The outside world: names under IO, System, Lean.Elab, Lean.Meta and Lean.Compiler. Ways around the kernel: sorry, admit, native_decide, unsafe, implemented_by, Lean.ofReduceBool.</desc>
  <rect width="1040" height="438" fill="#FAF8F4"/>
  <rect x="40.0" y="96.0" width="308.0" height="96.0" rx="10" fill="#FFFFFF" stroke="#E5484D" stroke-width="1.5"/>
  <rect x="366.0" y="96.0" width="308.0" height="96.0" rx="10" fill="#FFFFFF" stroke="#E5484D" stroke-width="1.5"/>
  <rect x="692.0" y="96.0" width="308.0" height="96.0" rx="10" fill="#FFFFFF" stroke="#E5484D" stroke-width="1.5"/>
  <rect x="40.0" y="210.0" width="308.0" height="96.0" rx="10" fill="#FFFFFF" stroke="#B37400" stroke-width="1.5"/>
  <rect x="366.0" y="210.0" width="308.0" height="96.0" rx="10" fill="#FFFFFF" stroke="#B37400" stroke-width="1.5"/>
  <rect x="692.0" y="210.0" width="308.0" height="96.0" rx="10" fill="#FFFFFF" stroke="#B37400" stroke-width="1.5"/>
  <rect x="40.0" y="324.0" width="960.0" height="84.0" rx="10" fill="#E8E9F3"/>
  <path d="M40.0 106.0a10 10 0 0 1 10-10h288.0a10 10 0 0 1 10 10v26.0h-308.0z" fill="#E5484D"/>
  <path d="M366.0 106.0a10 10 0 0 1 10-10h288.0a10 10 0 0 1 10 10v26.0h-308.0z" fill="#E5484D"/>
  <path d="M692.0 106.0a10 10 0 0 1 10-10h288.0a10 10 0 0 1 10 10v26.0h-308.0z" fill="#E5484D"/>
  <path d="M40.0 220.0a10 10 0 0 1 10-10h288.0a10 10 0 0 1 10 10v26.0h-308.0z" fill="#B37400"/>
  <path d="M366.0 220.0a10 10 0 0 1 10-10h288.0a10 10 0 0 1 10 10v26.0h-308.0z" fill="#B37400"/>
  <path d="M692.0 220.0a10 10 0 0 1 10-10h288.0a10 10 0 0 1 10 10v26.0h-308.0z" fill="#B37400"/>
  <text x="40.0" y="44.0" font-size="22" fill="#14162B" font-weight="700" textLength="355.7" lengthAdjust="spacingAndGlyphs">What a candidate may not contain</text>
  <text x="40.0" y="69.0" font-size="14" fill="#5B6477" textLength="497.2" lengthAdjust="spacingAndGlyphs">Lean can run programs while it elaborates, so text from a model is screened first</text>
  <text x="54.0" y="119.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="206.9" lengthAdjust="spacingAndGlyphs">Commands that run something</text>
  <text x="54.0" y="155.0" font-size="11.5" fill="#5B6477" font-family="Menlo, Consolas, monospace" textLength="186.9" lengthAdjust="spacingAndGlyphs">#eval  #print  #check  run_cmd </text>
  <text x="54.0" y="173.0" font-size="11.5" fill="#5B6477" font-family="Menlo, Consolas, monospace" textLength="69.2" lengthAdjust="spacingAndGlyphs">initialize</text>
  <text x="380.0" y="119.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="115.2" lengthAdjust="spacingAndGlyphs">New declarations</text>
  <text x="380.0" y="155.0" font-size="11.5" fill="#5B6477" font-family="Menlo, Consolas, monospace" textLength="249.2" lengthAdjust="spacingAndGlyphs">def  theorem  axiom  instance  inductive</text>
  <text x="380.0" y="173.0" font-size="11.5" fill="#5B6477" font-family="Menlo, Consolas, monospace" textLength="62.3" lengthAdjust="spacingAndGlyphs">structure</text>
  <text x="706.0" y="119.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="178.2" lengthAdjust="spacingAndGlyphs">Meta-programs and syntax</text>
  <text x="706.0" y="155.0" font-size="11.5" fill="#5B6477" font-family="Menlo, Consolas, monospace" textLength="235.4" lengthAdjust="spacingAndGlyphs">elab  macro  syntax  notation  run_tac </text>
  <text x="706.0" y="173.0" font-size="11.5" fill="#5B6477" font-family="Menlo, Consolas, monospace" textLength="48.5" lengthAdjust="spacingAndGlyphs">by_elab</text>
  <text x="54.0" y="233.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="126.0" lengthAdjust="spacingAndGlyphs">Options and scope</text>
  <text x="54.0" y="269.0" font-size="11.5" fill="#5B6477" font-family="Menlo, Consolas, monospace" textLength="221.5" lengthAdjust="spacingAndGlyphs">set_option  import  open  namespace </text>
  <text x="54.0" y="287.0" font-size="11.5" fill="#5B6477" font-family="Menlo, Consolas, monospace" textLength="62.3" lengthAdjust="spacingAndGlyphs">attribute</text>
  <text x="380.0" y="233.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="119.8" lengthAdjust="spacingAndGlyphs">The outside world</text>
  <text x="380.0" y="269.0" font-size="11.5" fill="#5B6477" font-family="Menlo, Consolas, monospace" textLength="228.5" lengthAdjust="spacingAndGlyphs">IO.  System.  Lean.Elab.  Lean.Meta. </text>
  <text x="380.0" y="287.0" font-size="11.5" fill="#5B6477" font-family="Menlo, Consolas, monospace" textLength="96.9" lengthAdjust="spacingAndGlyphs">Lean.Compiler.</text>
  <text x="706.0" y="233.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="157.4" lengthAdjust="spacingAndGlyphs">Ways around the kernel</text>
  <text x="706.0" y="269.0" font-size="11.5" fill="#5B6477" font-family="Menlo, Consolas, monospace" textLength="221.5" lengthAdjust="spacingAndGlyphs">sorry  admit  native_decide  unsafe </text>
  <text x="706.0" y="287.0" font-size="11.5" fill="#5B6477" font-family="Menlo, Consolas, monospace" textLength="96.9" lengthAdjust="spacingAndGlyphs">implemented_by</text>
  <text x="56.0" y="349.0" font-size="13" fill="#14162B" textLength="801.9" lengthAdjust="spacingAndGlyphs">A candidate longer than 20,000 characters is refused as well. The same list is applied twice: in the orchestrator, before anything is sent, and</text>
  <text x="56.0" y="367.0" font-size="13" fill="#14162B" textLength="251.5" lengthAdjust="spacingAndGlyphs">in the Bridge, before anything is elaborated.</text>
  <text x="56.0" y="391.0" font-size="13" fill="#14162B" textLength="789.8" lengthAdjust="spacingAndGlyphs">The screen is a lexical filter. It reduces what untrusted text can do; it is not an operating-system sandbox, and the documentation says so.</text>
</svg>
