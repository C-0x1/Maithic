  <text x="590" y="162" font-size="12" fill="#5B6477" textLength="178.1" lengthAdjust="spacingAndGlyphs">A post is a note, whatever it says.</text>
  <text x="590" y="178" font-size="12" fill="#5B6477" textLength="168.1" lengthAdjust="spacingAndGlyphs">“This is proved” proves nothing.</text>
