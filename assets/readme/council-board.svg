  <text x="570" y="106" font-size="10.5" fill="#2B2F77" font-weight="700" textLength="147.0" lengthAdjust="spacingAndGlyphs">THE ONE PATH TO A STATUS</text>
  <rect x="570" y="118" width="350" height="76" rx="8" fill="#FFFFFF" stroke="#9558B2" stroke-width="1.5"/>
  <rect x="570" y="118" width="6" height="76" rx="3" fill="#9558B2"/>
