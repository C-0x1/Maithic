<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" role="img" aria-labelledby="t d" font-family="'Helvetica Neue', Arial, sans-serif">
  <title id="t">The blackboard of a council, and the one way a claim changes status</title>
  <desc id="d">The blackboard of a council session on the theorem that the first n odd numbers add up to n times n, with its eleven items. Item 1 is the statement and item 2 the claim that it holds, both posted when the session opened. Items 3 to 6 are four names the researcher found in the library: sumOdd, Nat.succ_mul, Nat.mul_succ and Nat.mul_comm; item 7 is the researcher's idea for a proof. Items 8 and 9 are the prover's two proofs of round 1, both rejected by Lean. Item 10 is the critic's note on why they failed. Item 11 is the prover's proof of round 2, which Lean accepted. Beside the board, the one path by which a claim changes status: a member posts a proof, the verifier gives it to Lean, and Lean's answer, with the axioms the proof rests on and a second check in a fresh process, becomes evidence; only evidence moves the claim from conjectured to formalized to verified. A post that says 'this is proved' changes nothing. The answer at the end is made of items 2, 11, 3, 4 and 5; one definition, two proofs and two notes are set aside.</desc>
  <rect width="960" height="700" fill="#FAF8F4"/>
  <text x="40" y="44" font-size="22" fill="#14162B" font-weight="700" textLength="666.3" lengthAdjust="spacingAndGlyphs">Members post. Only an answer of Lean changes what is known.</text>
  <text x="40" y="68" font-size="14" fill="#5B6477" textLength="718.3" lengthAdjust="spacingAndGlyphs">maithic council: the blackboard of one session, and the one path to the word verified (fixtures/council/sum-odd.json).</text>
