  <text x="40.0" y="44.0" font-size="22" fill="#14162B" font-weight="700" textLength="295.8" lengthAdjust="spacingAndGlyphs">One session with the Bridge</text>
  <text x="40.0" y="69.0" font-size="14" fill="#5B6477" textLength="422.6" lengthAdjust="spacingAndGlyphs">JSON-RPC 2.0, one message per line, on standard input and output</text>
  <text x="295.0" y="119.0" font-size="13.5" fill="#FFFFFF" font-weight="700" text-anchor="middle" textLength="103.5" lengthAdjust="spacingAndGlyphs">maithic  (OCaml)</text>
  <text x="665.0" y="119.0" font-size="13.5" fill="#FFFFFF" font-weight="700" text-anchor="middle" textLength="137.3" lengthAdjust="spacingAndGlyphs">maithic-bridge  (Lean)</text>
  <text x="480.0" y="163.0" font-size="11.5" fill="#14162B" text-anchor="middle" font-family="Menlo, Consolas, monospace" textLength="62.3" lengthAdjust="spacingAndGlyphs">handshake</text>
  <text x="480.0" y="205.0" font-size="12.5" fill="#5B6477" text-anchor="middle" textLength="271.7" lengthAdjust="spacingAndGlyphs">bridge, protocol 1, the Lean version, the methods</text>
  <text x="480.0" y="247.0" font-size="11.5" fill="#14162B" text-anchor="middle" font-family="Menlo, Consolas, monospace" textLength="221.5" lengthAdjust="spacingAndGlyphs">loadHeader  { imports: ["Init"] }</text>
  <text x="480.0" y="289.0" font-size="12.5" fill="#5B6477" text-anchor="middle" textLength="30.6" lengthAdjust="spacingAndGlyphs">env 1</text>
  <text x="480.0" y="331.0" font-size="11.5" fill="#14162B" text-anchor="middle" font-family="Menlo, Consolas, monospace" textLength="297.7" lengthAdjust="spacingAndGlyphs">runCommand  { env: 1, source: the file up to</text>
  <text x="480.0" y="347.0" font-size="11.5" fill="#14162B" text-anchor="middle" font-family="Menlo, Consolas, monospace" textLength="173.1" lengthAdjust="spacingAndGlyphs">the theorem, keep: true }</text>
  <text x="480.0" y="389.0" font-size="12.5" fill="#5B6477" text-anchor="middle" textLength="104.9" lengthAdjust="spacingAndGlyphs">a report, and env 2</text>
  <text x="480.0" y="431.0" font-size="11.5" fill="#14162B" text-anchor="middle" font-family="Menlo, Consolas, monospace" textLength="270.0" lengthAdjust="spacingAndGlyphs">tryCandidates  { env: 2, candidates: [ {</text>
  <text x="480.0" y="447.0" font-size="11.5" fill="#14162B" text-anchor="middle" font-family="Menlo, Consolas, monospace" textLength="193.8" lengthAdjust="spacingAndGlyphs">source, untrusted }, ... ] }</text>
  <text x="480.0" y="489.0" font-size="12.5" fill="#5B6477" text-anchor="middle" textLength="293.2" lengthAdjust="spacingAndGlyphs">for each candidate: admitted or not, and a report with</text>
  <text x="480.0" y="505.0" font-size="12.5" fill="#5B6477" text-anchor="middle" textLength="183.4" lengthAdjust="spacingAndGlyphs">the declarations and their axioms</text>
  <text x="138.0" y="556.0" font-size="12.5" fill="#14162B" textLength="576.1" lengthAdjust="spacingAndGlyphs">Environments are immutable. Running a candidate on env 2 never changes env 2, so every candidate is</text>
  <text x="138.0" y="573.0" font-size="12.5" fill="#14162B" textLength="391.3" lengthAdjust="spacingAndGlyphs">judged against the same state, and a failed one leaves nothing behind.</text>
  <text x="480.0" y="611.0" font-size="11.5" fill="#14162B" text-anchor="middle" font-family="Menlo, Consolas, monospace" textLength="145.4" lengthAdjust="spacingAndGlyphs">releaseEnv  { env: 2 }</text>
  <text x="480.0" y="653.0" font-size="12.5" fill="#5B6477" text-anchor="middle" textLength="48.0" lengthAdjust="spacingAndGlyphs">released</text>
  <text x="480.0" y="695.0" font-size="11.5" fill="#14162B" text-anchor="middle" font-family="Menlo, Consolas, monospace" textLength="55.4" lengthAdjust="spacingAndGlyphs">shutdown</text>
  <text x="480.0" y="737.0" font-size="12.5" fill="#5B6477" text-anchor="middle" textLength="20.2" lengthAdjust="spacingAndGlyphs">bye</text>
</svg>
