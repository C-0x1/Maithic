<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 792" role="img" aria-labelledby="bridge-session-t bridge-session-d" font-family="'Helvetica Neue', Arial, sans-serif">
  <title id="bridge-session-t">One session with the Bridge</title>
  <desc id="bridge-session-d">A sequence diagram between the maithic command, written in OCaml, and maithic-bridge, the Lean process. The command sends handshake and learns the protocol and the Lean version. It sends loadHeader with the imports and receives environment 1. It sends runCommand with the file up to the theorem and receives a report and environment 2. It sends tryCandidates with several candidate proofs and receives, for each, whether it was admitted and a report with the declarations and their axioms. Environments are immutable, so every candidate is judged against the same state. It then releases the environment and shuts the Bridge down.</desc>
  <rect width="960" height="792" fill="#FAF8F4"/>
