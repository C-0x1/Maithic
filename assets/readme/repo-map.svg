  <text x="40.0" y="44.0" font-size="22" fill="#14162B" font-weight="700" textLength="147.9" lengthAdjust="spacingAndGlyphs">What is where</text>
  <text x="40.0" y="69.0" font-size="14" fill="#5B6477" textLength="319.1" lengthAdjust="spacingAndGlyphs">Four languages, and the documents they exchange</text>
  <text x="68.0" y="131.5" font-size="12.5" fill="#14162B" font-weight="700" font-family="Menlo, Consolas, monospace" textLength="45.1" lengthAdjust="spacingAndGlyphs">ocaml/</text>
  <text x="224.0" y="114.5" font-size="12.5" fill="#5B6477" textLength="578.6" lengthAdjust="spacingAndGlyphs">The maithic command and everything that orchestrates: the gateway, the Bridge client, the prover and its</text>
  <text x="224.0" y="131.5" font-size="12.5" fill="#5B6477" textLength="565.6" lengthAdjust="spacingAndGlyphs">search, the refuter, formalization, the council, repair, review, blueprints, the search for declarations, the</text>
  <text x="224.0" y="148.5" font-size="12.5" fill="#5B6477" textLength="144.7" lengthAdjust="spacingAndGlyphs">laboratory, the trust policy.</text>
  <text x="90.0" y="183.5" font-size="12.5" fill="#14162B" font-family="Menlo, Consolas, monospace" textLength="90.3" lengthAdjust="spacingAndGlyphs">ocaml/tools/</text>
  <text x="224.0" y="183.5" font-size="12.5" fill="#5B6477" textLength="455.8" lengthAdjust="spacingAndGlyphs">The developer tool: the repository gates, the cassette author, the terminal pictures.</text>
  <text x="68.0" y="227.0" font-size="12.5" fill="#14162B" font-weight="700" font-family="Menlo, Consolas, monospace" textLength="37.6" lengthAdjust="spacingAndGlyphs">lean/</text>
  <text x="224.0" y="218.5" font-size="12.5" fill="#5B6477" textLength="578.8" lengthAdjust="spacingAndGlyphs">The Bridge server with proof states, the tactic suite, the axiom audit, the tests of statements, the tracer of</text>
  <text x="224.0" y="235.5" font-size="12.5" fill="#5B6477" textLength="38.2" lengthAdjust="spacingAndGlyphs">proofs.</text>
  <text x="90.0" y="279.0" font-size="12.5" fill="#14162B" font-family="Menlo, Consolas, monospace" textLength="97.8" lengthAdjust="spacingAndGlyphs">lean/Maithic/</text>
  <text x="224.0" y="270.5" font-size="12.5" fill="#5B6477" textLength="590.6" lengthAdjust="spacingAndGlyphs">The verified libraries: algorithms with counted costs, checkers for network bounds, propositional proofs and</text>
  <text x="224.0" y="287.5" font-size="12.5" fill="#5B6477" textLength="139.0" lengthAdjust="spacingAndGlyphs">linear integer certificates.</text>
  <text x="68.0" y="331.0" font-size="12.5" fill="#14162B" font-weight="700" font-family="Menlo, Consolas, monospace" textLength="45.1" lengthAdjust="spacingAndGlyphs">julia/</text>
  <text x="224.0" y="322.5" font-size="12.5" fill="#5B6477" textLength="564.2" lengthAdjust="spacingAndGlyphs">Eight packages: certificates, the tactic model, bounds for neural networks, reference algorithms, graph</text>
  <text x="224.0" y="339.5" font-size="12.5" fill="#5B6477" textLength="332.8" lengthAdjust="spacingAndGlyphs">measures, dataset splits, embeddings, and what they share.</text>
  <text x="68.0" y="383.0" font-size="12.5" fill="#14162B" font-weight="700" font-family="Menlo, Consolas, monospace" textLength="15.0" lengthAdjust="spacingAndGlyphs">r/</text>
  <text x="224.0" y="374.5" font-size="12.5" fill="#5B6477" textLength="585.7" lengthAdjust="spacingAndGlyphs">maithicstats: intervals, comparisons and a reader for every kind of result file. maithicviz: the figures, in one</text>
  <text x="224.0" y="391.5" font-size="12.5" fill="#5B6477" textLength="29.2" lengthAdjust="spacingAndGlyphs">style.</text>
  <text x="68.0" y="426.5" font-size="12.5" fill="#14162B" font-weight="700" font-family="Menlo, Consolas, monospace" textLength="60.2" lengthAdjust="spacingAndGlyphs">schemas/</text>
  <text x="224.0" y="426.5" font-size="12.5" fill="#5B6477" textLength="408.3" lengthAdjust="spacingAndGlyphs">The JSON Schema of every document that crosses a language boundary.</text>
  <text x="68.0" y="461.5" font-size="12.5" fill="#14162B" font-weight="700" font-family="Menlo, Consolas, monospace" textLength="52.7" lengthAdjust="spacingAndGlyphs">config/</text>
  <text x="224.0" y="461.5" font-size="12.5" fill="#5B6477" textLength="327.5" lengthAdjust="spacingAndGlyphs">The model registry, the prompts and the default trust policy.</text>
  <text x="68.0" y="496.5" font-size="12.5" fill="#14162B" font-weight="700" font-family="Menlo, Consolas, monospace" textLength="67.7" lengthAdjust="spacingAndGlyphs">registry/</text>
  <text x="224.0" y="496.5" font-size="12.5" fill="#5B6477" textLength="418.0" lengthAdjust="spacingAndGlyphs">The capability register: every capability, its status and the tests that name it.</text>
  <text x="68.0" y="540.0" font-size="12.5" fill="#14162B" font-weight="700" font-family="Menlo, Consolas, monospace" textLength="67.7" lengthAdjust="spacingAndGlyphs">fixtures/</text>
  <text x="224.0" y="531.5" font-size="12.5" fill="#5B6477" textLength="571.1" lengthAdjust="spacingAndGlyphs">Recorded Bridge sessions, cassettes, certificates, trained models, and the results the figures are drawn</text>
  <text x="224.0" y="548.5" font-size="12.5" fill="#5B6477" textLength="28.5" lengthAdjust="spacingAndGlyphs">from.</text>
  <text x="68.0" y="583.5" font-size="12.5" fill="#14162B" font-weight="700" font-family="Menlo, Consolas, monospace" textLength="67.7" lengthAdjust="spacingAndGlyphs">examples/</text>
  <text x="224.0" y="583.5" font-size="12.5" fill="#5B6477" textLength="485.7" lengthAdjust="spacingAndGlyphs">The small Lean files of the demonstrations, a blueprint, networks with properties, a task.</text>
  <text x="68.0" y="618.5" font-size="12.5" fill="#14162B" font-weight="700" font-family="Menlo, Consolas, monospace" textLength="45.1" lengthAdjust="spacingAndGlyphs">bench/</text>
  <text x="224.0" y="618.5" font-size="12.5" fill="#5B6477" textLength="406.5" lengthAdjust="spacingAndGlyphs">The benchmark manifest, the stored baselines and the committed results.</text>
  <text x="68.0" y="653.5" font-size="12.5" fill="#14162B" font-weight="700" font-family="Menlo, Consolas, monospace" textLength="37.6" lengthAdjust="spacingAndGlyphs">docs/</text>
  <text x="224.0" y="653.5" font-size="12.5" fill="#5B6477" textLength="317.6" lengthAdjust="spacingAndGlyphs">Guides, concepts, reference pages and design decisions.</text>
</svg>
