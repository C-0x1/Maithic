<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 693" role="img" aria-labelledby="repo-map-t repo-map-d" font-family="'Helvetica Neue', Arial, sans-serif">
  <title id="repo-map-t">What is where in the repository</title>
  <desc id="repo-map-d">A list of the top-level folders with what each holds. ocaml: the maithic command, the AI gateway, the Bridge client, the prover and every other orchestrator, and the repository tools. lean: the Bridge server, the tactic suite, the verified libraries and the benchmark suite. julia: eight packages for certificates, the tactic model, network bounds, reference algorithms, graph measures, datasets and embeddings. r: two packages for statistics and figures. schemas: the JSON Schema of every document that crosses a language boundary. config: the model registry, the prompts and the default trust policy. registry: the capability register. fixtures: recorded sessions, cassettes, certificates and results. examples: the small files of the demonstrations. bench: the benchmark manifest, baselines and committed results. docs: guides, concepts, reference pages and design decisions.</desc>
  <rect width="960" height="693" fill="#FAF8F4"/>
