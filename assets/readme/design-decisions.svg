  <path d="M692.0 298.0a10 10 0 0 1 10-10h288.0a10 10 0 0 1 10 10v26.0h-308.0z" fill="#E5484D"/>
  <text x="40.0" y="44.0" font-size="22" fill="#14162B" font-weight="700" textLength="353.3" lengthAdjust="spacingAndGlyphs">Six decisions that shape the code</text>
  <text x="40.0" y="69.0" font-size="13.5" fill="#5B6477" font-family="Menlo, Consolas, monospace" textLength="73.1" lengthAdjust="spacingAndGlyphs">docs/adr/</text>
  <text x="54.0" y="119.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="181.3" lengthAdjust="spacingAndGlyphs">1  No outside dependencies</text>
  <text x="54.0" y="155.0" font-size="13" fill="#14162B" textLength="245.2" lengthAdjust="spacingAndGlyphs">JSON, TOML, SHA-256, processes, HTTP</text>
  <text x="54.0" y="173.0" font-size="13" fill="#14162B" textLength="236.3" lengthAdjust="spacingAndGlyphs">and the test framework are written on the</text>
  <text x="54.0" y="191.0" font-size="13" fill="#14162B" textLength="146.0" lengthAdjust="spacingAndGlyphs">standard library and unix.</text>
  <text x="54.0" y="215.0" font-size="13" fill="#14162B" textLength="241.4" lengthAdjust="spacingAndGlyphs">Nothing stands between your API key and</text>
  <text x="54.0" y="233.0" font-size="13" fill="#14162B" textLength="228.1" lengthAdjust="spacingAndGlyphs">the network that is not in this repository.</text>
  <text x="380.0" y="119.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="186.7" lengthAdjust="spacingAndGlyphs">2  Environments are handles</text>
  <text x="380.0" y="155.0" font-size="13" fill="#14162B" textLength="165.5" lengthAdjust="spacingAndGlyphs">The Bridge keeps immutable</text>
  <text x="380.0" y="173.0" font-size="13" fill="#14162B" textLength="237.0" lengthAdjust="spacingAndGlyphs">environments and hands out numbers for</text>
  <text x="380.0" y="191.0" font-size="13" fill="#14162B" textLength="32.5" lengthAdjust="spacingAndGlyphs">them.</text>
  <text x="380.0" y="215.0" font-size="13" fill="#14162B" textLength="214.7" lengthAdjust="spacingAndGlyphs">A candidate is tried on top of one and</text>
  <text x="380.0" y="233.0" font-size="13" fill="#14162B" textLength="216.1" lengthAdjust="spacingAndGlyphs">never changes it, so a result does not</text>
  <text x="380.0" y="251.0" font-size="13" fill="#14162B" textLength="159.0" lengthAdjust="spacingAndGlyphs">depend on what ran before.</text>
  <text x="706.0" y="119.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="166.5" lengthAdjust="spacingAndGlyphs">3  Cassettes are authored</text>
  <text x="706.0" y="155.0" font-size="13" fill="#14162B" textLength="227.6" lengthAdjust="spacingAndGlyphs">The answers the demonstrations replay</text>
  <text x="706.0" y="173.0" font-size="13" fill="#14162B" textLength="236.3" lengthAdjust="spacingAndGlyphs">were written by hand, and every cassette</text>
  <text x="706.0" y="191.0" font-size="13" fill="#14162B" textLength="47.7" lengthAdjust="spacingAndGlyphs">says so.</text>
  <text x="706.0" y="215.0" font-size="13" fill="#14162B" textLength="205.9" lengthAdjust="spacingAndGlyphs">They make the model-assisted path</text>
  <text x="706.0" y="233.0" font-size="13" fill="#14162B" textLength="216.6" lengthAdjust="spacingAndGlyphs">runnable anywhere. They say nothing</text>
  <text x="706.0" y="251.0" font-size="13" fill="#14162B" textLength="99.7" lengthAdjust="spacingAndGlyphs">about any model.</text>
  <text x="54.0" y="311.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="179.4" lengthAdjust="spacingAndGlyphs">4  A floor for each language</text>
  <text x="54.0" y="347.0" font-size="13" fill="#14162B" textLength="247.9" lengthAdjust="spacingAndGlyphs">OCaml, Lean, Julia and R make up at least</text>
  <text x="54.0" y="365.0" font-size="13" fill="#14162B" textLength="133.0" lengthAdjust="spacingAndGlyphs">85 percent of the code.</text>
  <text x="54.0" y="389.0" font-size="13" fill="#14162B" textLength="235.6" lengthAdjust="spacingAndGlyphs">Each has its own floor, so no language is</text>
  <text x="54.0" y="407.0" font-size="13" fill="#14162B" textLength="109.6" lengthAdjust="spacingAndGlyphs">there in name only.</text>
  <text x="380.0" y="311.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="161.0" lengthAdjust="spacingAndGlyphs">5  Standard distributions</text>
  <text x="380.0" y="347.0" font-size="13" fill="#14162B" textLength="230.1" lengthAdjust="spacingAndGlyphs">The Julia packages use Julia's standard</text>
  <text x="380.0" y="365.0" font-size="13" fill="#14162B" textLength="178.3" lengthAdjust="spacingAndGlyphs">library, and each other by path.</text>
  <text x="380.0" y="389.0" font-size="13" fill="#14162B" textLength="221.9" lengthAdjust="spacingAndGlyphs">A check that rests on a number can be</text>
  <text x="380.0" y="407.0" font-size="13" fill="#14162B" textLength="217.5" lengthAdjust="spacingAndGlyphs">repeated on any machine, years later.</text>
  <text x="706.0" y="311.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="207.0" lengthAdjust="spacingAndGlyphs">6  Proof states are not evidence</text>
  <text x="706.0" y="347.0" font-size="13" fill="#14162B" textLength="229.8" lengthAdjust="spacingAndGlyphs">A proof state with no goals left helps the</text>
  <text x="706.0" y="365.0" font-size="13" fill="#14162B" textLength="156.8" lengthAdjust="spacingAndGlyphs">search and proves nothing.</text>
  <text x="706.0" y="389.0" font-size="13" fill="#14162B" textLength="239.2" lengthAdjust="spacingAndGlyphs">The finished declaration is elaborated like</text>
  <text x="706.0" y="407.0" font-size="13" fill="#14162B" textLength="210.3" lengthAdjust="spacingAndGlyphs">any other candidate before it counts.</text>
</svg>
