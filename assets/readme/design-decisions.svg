<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 456" role="img" aria-labelledby="design-decisions-t design-decisions-d" font-family="'Helvetica Neue', Arial, sans-serif">
  <title id="design-decisions-t">Six design decisions</title>
  <desc id="design-decisions-d">Six cards, one for each recorded design decision. One: the OCaml core uses only the compiler's own libraries. Two: the Bridge exposes immutable environments and checks whole declarations. Three: demonstration cassettes are authored, and say so. Four: the four languages each have a floor in the share of code. Five: the Julia and R packages build on the standard distribution. Six: a closed proof state is not a verified theorem.</desc>
  <rect width="1040" height="456" fill="#FAF8F4"/>
  <rect x="40.0" y="96.0" width="308.0" height="174.0" rx="10" fill="#FFFFFF" stroke="#EC6813" stroke-width="1.5"/>
  <rect x="366.0" y="96.0" width="308.0" height="174.0" rx="10" fill="#FFFFFF" stroke="#2B2F77" stroke-width="1.5"/>
  <rect x="692.0" y="96.0" width="308.0" height="174.0" rx="10" fill="#FFFFFF" stroke="#5B6477" stroke-width="1.5"/>
