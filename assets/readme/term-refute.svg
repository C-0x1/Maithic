<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 921 698" width="921" height="698" role="img" aria-label="A terminal session: maithic refute examines three unproved statements. One is refuted by a counterexample, with the Lean proof that confirms it; one is found vacuous because its hypotheses contradict each other; one stands after three rounds of tests.">
  <title>A terminal session: maithic refute examines three unproved statements. One is refuted by a counterexample, with the Lean proof that confirms it; one is found vacuous because its hypotheses contradict each other; one stands after three rounds of tests.</title>
  <rect width="921" height="698" rx="10" fill="#14162B"/>
  <path d="M0 10a10 10 0 0 1 10-10h901a10 10 0 0 1 10 10v26h-921z" fill="#1E2142"/>
  <circle cx="22" cy="18" r="5.5" fill="#F26D72"/>
  <circle cx="40" cy="18" r="5.5" fill="#F0A92E"/>
  <circle cx="58" cy="18" r="5.5" fill="#57C98F"/>
  <text x="460" y="23" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8A90A6">maithic refute</text>
  <g font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13">
    <text x="22.00" y="58" textLength="7.83" lengthAdjust="spacingAndGlyphs" fill="#2CC4B6" font-weight="bold">$</text>
    <text x="37.66" y="58" textLength="516.78" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3" font-weight="bold">maithic refute examples/conjectures.lean --theorem square_monotone</text>
    <text x="22.00" y="77" textLength="117.45" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3" font-weight="bold">square_monotone</text>
    <text x="155.11" y="77" textLength="219.24" lengthAdjust="spacingAndGlyphs" fill="#8A90A6">examples/conjectures.lean:14</text>
    <text x="37.66" y="96" textLength="493.29" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">theorem square_monotone (x y : Int) (h : x ≤ y) : x * x ≤ y * y</text>
    <text x="37.66" y="115" textLength="31.32" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">test</text>
    <text x="115.96" y="115" textLength="540.27" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">falsified at case 9 with seed 0, made smaller 1 time: x := -1, y := 0</text>
    <text x="37.66" y="134" textLength="31.32" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">Lean</text>
    <text x="115.96" y="134" textLength="485.46" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">accepts the refutation, closed by decide; it rests on no axiom</text>
    <text x="37.66" y="153" textLength="54.81" lengthAdjust="spacingAndGlyphs" fill="#F26D72">refuted</text>
    <text x="115.96" y="153" textLength="172.26" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">the statement is false</text>
    <text x="53.32" y="191" textLength="689.04" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">theorem _root_.maithic_refutation_of_square_monotone : ¬ type_of% @square_monotone := by</text>
    <text x="68.98" y="210" textLength="54.81" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">intro h</text>
    <text x="68.98" y="229" textLength="242.73" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">have h' := h (x := -1) (y := 0)</text>
    <text x="68.98" y="248" textLength="70.47" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">revert h'</text>
    <text x="68.98" y="267" textLength="46.98" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">decide</text>
    <text x="22.00" y="305" textLength="712.53" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">1 statement: 1 refuted, 0 vacuous, 0 with a counterexample Lean did not confirm, 0 standing</text>
    <text x="22.00" y="343" textLength="7.83" lengthAdjust="spacingAndGlyphs" fill="#2CC4B6" font-weight="bold">$</text>
    <text x="37.66" y="343" textLength="689.04" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3" font-weight="bold">maithic refute examples/conjectures.lean --theorem small_and_large --method test,vacuity</text>
    <text x="22.00" y="362" textLength="117.45" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3" font-weight="bold">small_and_large</text>
    <text x="155.11" y="362" textLength="219.24" lengthAdjust="spacingAndGlyphs" fill="#8A90A6">examples/conjectures.lean:27</text>
    <text x="37.66" y="381" textLength="555.93" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">theorem small_and_large (n : Nat) (h₁ : n &lt; 3) (h₂ : n &gt; 5) : n * n = 7</text>
    <text x="37.66" y="400" textLength="31.32" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">test</text>
    <text x="115.96" y="400" textLength="532.44" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">gave up with seed 0: 1000 cases left out by the hypotheses, 0 passed</text>
    <text x="37.66" y="419" textLength="54.81" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">vacuity</text>
    <text x="115.96" y="419" textLength="469.80" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">the hypotheses h₁, h₂ contradict each other (shown by omega)</text>
    <text x="37.66" y="438" textLength="54.81" lengthAdjust="spacingAndGlyphs" fill="#F0A92E">vacuous</text>
    <text x="115.96" y="438" textLength="783.00" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">the statement is true and says nothing: the hypotheses h₁, h₂ contradict each other (shown by omega)</text>
    <text x="22.00" y="476" textLength="712.53" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">1 statement: 0 refuted, 1 vacuous, 0 with a counterexample Lean did not confirm, 0 standing</text>
    <text x="22.00" y="514" textLength="7.83" lengthAdjust="spacingAndGlyphs" fill="#2CC4B6" font-weight="bold">$</text>
    <text x="37.66" y="514" textLength="618.57" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3" font-weight="bold">maithic refute examples/conjectures.lean --theorem reverse_append --method test</text>
    <text x="22.00" y="533" textLength="109.62" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3" font-weight="bold">reverse_append</text>
    <text x="147.28" y="533" textLength="219.24" lengthAdjust="spacingAndGlyphs" fill="#8A90A6">examples/conjectures.lean:31</text>
    <text x="37.66" y="552" textLength="696.87" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">theorem reverse_append (l₁ l₂ : List Nat) : (l₁ ++ l₂).reverse = l₂.reverse ++ l₁.reverse</text>
    <text x="37.66" y="571" textLength="31.32" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">test</text>
    <text x="115.96" y="571" textLength="219.24" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">passed 100 cases with seed 0</text>
    <text x="37.66" y="590" textLength="31.32" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">test</text>
    <text x="115.96" y="590" textLength="219.24" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">passed 100 cases with seed 1</text>
    <text x="37.66" y="609" textLength="31.32" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">test</text>
    <text x="115.96" y="609" textLength="219.24" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">passed 100 cases with seed 2</text>
    <text x="37.66" y="628" textLength="62.64" lengthAdjust="spacingAndGlyphs" fill="#2CC4B6">standing</text>
    <text x="115.96" y="628" textLength="305.37" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">nothing was found, which proves nothing</text>
    <text x="22.00" y="666" textLength="712.53" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">1 statement: 0 refuted, 0 vacuous, 0 with a counterexample Lean did not confirm, 1 standing</text>
  </g>
</svg>
