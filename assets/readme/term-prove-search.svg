<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 459 242" width="459" height="242" role="img" aria-label="A terminal session: with models switched off, maithic prove finds a proof by step-wise search, by induction with rfl for the first case and simp and omega for the second, and the result is verified after 19 attempts.">
  <title>A terminal session: with models switched off, maithic prove finds a proof by step-wise search, by induction with rfl for the first case and simp and omega for the second, and the result is verified after 19 attempts.</title>
  <rect width="459" height="242" rx="10" fill="#14162B"/>
  <path d="M0 10a10 10 0 0 1 10-10h439a10 10 0 0 1 10 10v26h-459z" fill="#1E2142"/>
  <circle cx="22" cy="18" r="5.5" fill="#F26D72"/>
  <circle cx="40" cy="18" r="5.5" fill="#F0A92E"/>
  <circle cx="58" cy="18" r="5.5" fill="#57C98F"/>
  <text x="229" y="23" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8A90A6">maithic prove --no-ai --search</text>
  <g font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13">
    <text x="22.00" y="58" textLength="7.83" lengthAdjust="spacingAndGlyphs" fill="#2CC4B6" font-weight="bold">$</text>
    <text x="37.66" y="58" textLength="399.33" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3" font-weight="bold">maithic prove examples/double.lean --no-ai --search</text>
    <text x="22.00" y="77" textLength="70.47" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3" font-weight="bold">double_eq</text>
    <text x="108.13" y="77" textLength="62.64" lengthAdjust="spacingAndGlyphs" fill="#57C98F">verified</text>
    <text x="186.43" y="77" textLength="250.56" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">(search, 19 attempt(s), 1762 ms)</text>
    <text x="37.66" y="96" textLength="313.20" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">statement: ∀ (n : Nat), double n = 2 * n</text>
    <text x="37.66" y="115" textLength="46.98" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">proof:</text>
    <text x="123.79" y="115" textLength="15.66" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">by</text>
    <text x="139.45" y="134" textLength="86.13" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">induction n</text>
    <text x="139.45" y="153" textLength="39.15" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">· rfl</text>
    <text x="139.45" y="172" textLength="117.45" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">· simp [double]</text>
    <text x="155.11" y="191" textLength="39.15" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">omega</text>
    <text x="37.66" y="210" textLength="54.81" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">axioms:</text>
    <text x="123.79" y="210" textLength="148.77" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">propext, Quot.sound</text>
  </g>
</svg>
