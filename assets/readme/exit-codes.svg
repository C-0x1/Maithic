<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" role="img" aria-labelledby="exit-codes-t exit-codes-d" font-family="'Helvetica Neue', Arial, sans-serif">
  <title id="exit-codes-t">The fourteen exit codes</title>
  <desc id="exit-codes-d">Fourteen tiles, one for each exit code of the maithic command: 0 success, 1 general failure, 2 usage error, 3 configuration error, 4 toolchain or runtime missing, 5 provider or authentication error, 6 budget exceeded, 7 abstained or not verified, 8 statement refuted, 9 trust or review policy violation, 10 timeout, 11 cancelled, 12 feature unavailable in this installation, 13 regression gate failed. A command whose outcome is a status exits with 0 only when every result is verified.</desc>
  <rect width="960" height="550" fill="#FAF8F4"/>
  <rect x="40.0" y="96.0" width="164.8" height="92.0" rx="10" fill="#FFFFFF" stroke="#0FA89B" stroke-width="1.5"/>
  <rect x="218.8" y="96.0" width="164.8" height="92.0" rx="10" fill="#FFFFFF" stroke="#5B6477" stroke-width="1.5"/>
  <rect x="397.6" y="96.0" width="164.8" height="92.0" rx="10" fill="#FFFFFF" stroke="#5B6477" stroke-width="1.5"/>
