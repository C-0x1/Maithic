<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="t d" font-family="'Helvetica Neue', Arial, sans-serif">
  <title id="t">Four languages, four roles</title>
  <desc id="d">OCaml orchestrates: the command, the gateway, the Bridge client and the repository tools. Lean proves: the Bridge server, tactics, verified libraries and certificate checkers. Julia computes: bound propagation, embeddings and vector search. R measures: intervals, comparisons and run analysis.</desc>
  <rect width="960" height="300" fill="#FAF8F4"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#14162B" textLength="277.5" lengthAdjust="spacingAndGlyphs">Four languages, four roles</text>
  <text x="40" y="68" font-size="14" fill="#5B6477" textLength="573.3" lengthAdjust="spacingAndGlyphs">Each language does what it is best at. They meet only through documented JSON contracts.</text>
  <g font-size="14">
    <g transform="translate(40 96)">
      <rect width="205" height="170" rx="12" fill="#FFFFFF" stroke="#EC6813" stroke-width="2"/>
      <rect width="205" height="44" rx="12" fill="#EC6813"/><rect y="30" width="205" height="14" fill="#EC6813"/>
      <text x="16" y="29" font-size="17" font-weight="700" fill="#FFFFFF" textLength="161.6" lengthAdjust="spacingAndGlyphs">OCaml orchestrates</text>
      <text x="16" y="72" fill="#14162B" textLength="109.7" lengthAdjust="spacingAndGlyphs">maithic command</text>
      <text x="16" y="96" fill="#14162B" textLength="138.5" lengthAdjust="spacingAndGlyphs">AI gateway and replay</text>
      <text x="16" y="120" fill="#14162B" textLength="124.5" lengthAdjust="spacingAndGlyphs">Bridge client, prover</text>
      <text x="16" y="144" fill="#14162B" textLength="103.2" lengthAdjust="spacingAndGlyphs">trust policy, tools</text>
    </g>
    <g transform="translate(265 96)">
      <rect width="205" height="170" rx="12" fill="#FFFFFF" stroke="#0FA89B" stroke-width="2"/>
      <rect width="205" height="44" rx="12" fill="#0FA89B"/><rect y="30" width="205" height="14" fill="#0FA89B"/>
      <text x="16" y="29" font-size="17" font-weight="700" fill="#FFFFFF" textLength="100.2" lengthAdjust="spacingAndGlyphs">Lean proves</text>
      <text x="16" y="72" fill="#14162B" textLength="83.3" lengthAdjust="spacingAndGlyphs">Bridge server</text>
      <text x="16" y="96" fill="#14162B" textLength="115.9" lengthAdjust="spacingAndGlyphs">maithic_auto tactic</text>
      <text x="16" y="120" fill="#14162B" textLength="113.6" lengthAdjust="spacingAndGlyphs">verified algorithms</text>
      <text x="16" y="144" fill="#14162B" textLength="119.8" lengthAdjust="spacingAndGlyphs">certificate checkers</text>
    </g>
    <g transform="translate(490 96)">
      <rect width="205" height="170" rx="12" fill="#FFFFFF" stroke="#9558B2" stroke-width="2"/>
      <rect width="205" height="44" rx="12" fill="#9558B2"/><rect y="30" width="205" height="14" fill="#9558B2"/>
      <text x="16" y="29" font-size="17" font-weight="700" fill="#FFFFFF" textLength="123.8" lengthAdjust="spacingAndGlyphs">Julia computes</text>
      <text x="16" y="72" fill="#14162B" textLength="116.8" lengthAdjust="spacingAndGlyphs">bound propagation</text>
      <text x="16" y="96" fill="#14162B" textLength="116.7" lengthAdjust="spacingAndGlyphs">rational certificates</text>
      <text x="16" y="120" fill="#14162B" textLength="76.3" lengthAdjust="spacingAndGlyphs">embeddings</text>
      <text x="16" y="144" fill="#14162B" textLength="84.0" lengthAdjust="spacingAndGlyphs">vector search</text>
    </g>
    <g transform="translate(715 96)">
      <rect width="205" height="170" rx="12" fill="#FFFFFF" stroke="#276DC3" stroke-width="2"/>
      <rect width="205" height="44" rx="12" fill="#276DC3"/><rect y="30" width="205" height="14" fill="#276DC3"/>
      <text x="16" y="29" font-size="17" font-weight="700" fill="#FFFFFF" textLength="96.4" lengthAdjust="spacingAndGlyphs">R measures</text>
      <text x="16" y="72" fill="#14162B" textLength="98.0" lengthAdjust="spacingAndGlyphs">Wilson intervals</text>
      <text x="16" y="96" fill="#14162B" textLength="114.4" lengthAdjust="spacingAndGlyphs">bootstrap intervals</text>
      <text x="16" y="120" fill="#14162B" textLength="122.2" lengthAdjust="spacingAndGlyphs">paired comparisons</text>
      <text x="16" y="144" fill="#14162B" textLength="74.7" lengthAdjust="spacingAndGlyphs">run analysis</text>
    </g>
  </g>
</svg>
