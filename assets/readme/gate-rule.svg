<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 452" role="img" aria-labelledby="gate-rule-t gate-rule-d" font-family="'Helvetica Neue', Arial, sans-serif">
  <title id="gate-rule-t">How the regression gate decides</title>
  <desc id="gate-rule-d">Three steps in a row. A baseline, stored for each suite, records for every problem whether it was verified, how many candidates were tried and how long it took; a run records the same. The two are compared problem by problem: a problem is lost when the baseline verified it and the run did not. The verdict is passed, or failed with the problems that were lost, and the command exits with status 13.</desc>
  <rect width="960" height="452" fill="#FAF8F4"/>
  <rect x="40.0" y="96.0" width="273.3" height="206.0" rx="10" fill="#FFFFFF" stroke="#5B6477" stroke-width="1.5"/>
  <rect x="343.3" y="96.0" width="273.3" height="206.0" rx="10" fill="#FFFFFF" stroke="#2B2F77" stroke-width="1.5"/>
  <rect x="646.7" y="96.0" width="273.3" height="206.0" rx="10" fill="#FFFFFF" stroke="#0B7F75" stroke-width="1.5"/>
  <rect x="40.0" y="320.0" width="880.0" height="102.0" rx="10" fill="#E8E9F3"/>
  <path d="M40.0 106.0a10 10 0 0 1 10-10h253.3a10 10 0 0 1 10 10v26.0h-273.3z" fill="#5B6477"/>
  <rect x="54.0" y="266.0" width="245.3" height="24.0" rx="6" fill="#E8E9F3"/>
  <path d="M317.3 199.0 L331.3 199.0" stroke="#5B6477" stroke-width="1.6" fill="none"/>
  <path d="M329.3333333333333 193.0 l10 6 l-10 6 z" fill="#5B6477"/>
  <path d="M343.3 106.0a10 10 0 0 1 10-10h253.3a10 10 0 0 1 10 10v26.0h-273.3z" fill="#2B2F77"/>
  <rect x="357.3" y="266.0" width="245.3" height="24.0" rx="6" fill="#E8E9F3"/>
  <path d="M620.7 199.0 L634.7 199.0" stroke="#5B6477" stroke-width="1.6" fill="none"/>
  <path d="M632.6666666666666 193.0 l10 6 l-10 6 z" fill="#5B6477"/>
  <path d="M646.7 106.0a10 10 0 0 1 10-10h253.3a10 10 0 0 1 10 10v26.0h-273.3z" fill="#0B7F75"/>
  <circle cx="669.6666666666666" cy="152.0" r="8" fill="#0FA89B"/>
  <path d="M665.1666666666666 152.0 l3.2 3.6 l6 -7.2" stroke="#FFFFFF" stroke-width="2.1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="669.6666666666666" cy="176.0" r="8" fill="#E5484D"/>
  <path d="M665.6666666666666 172.0 l8 8 M673.6666666666666 172.0 l-8 8" stroke="#FFFFFF" stroke-width="2.1" fill="none" stroke-linecap="round"/>
  <rect x="660.7" y="266.0" width="245.3" height="24.0" rx="6" fill="#E8E9F3"/>
  <text x="40.0" y="44.0" font-size="22" fill="#14162B" font-weight="700" textLength="369.6" lengthAdjust="spacingAndGlyphs">A baseline, a run, and one question</text>
  <text x="40.0" y="69.0" font-size="13.5" fill="#5B6477" font-family="Menlo, Consolas, monospace" textLength="406.3" lengthAdjust="spacingAndGlyphs">maithic bench gate RUN --baselines bench/baselines</text>
  <text x="54.0" y="119.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="112.8" lengthAdjust="spacingAndGlyphs">Baseline and run</text>
  <text x="54.0" y="155.0" font-size="13" fill="#14162B" textLength="211.0" lengthAdjust="spacingAndGlyphs">For every problem of a suite: verified</text>
  <text x="54.0" y="173.0" font-size="13" fill="#14162B" textLength="179.2" lengthAdjust="spacingAndGlyphs">or not, the candidates tried, the</text>
  <text x="54.0" y="191.0" font-size="13" fill="#14162B" textLength="28.2" lengthAdjust="spacingAndGlyphs">time.</text>
  <text x="54.0" y="215.0" font-size="13" fill="#14162B" textLength="156.8" lengthAdjust="spacingAndGlyphs">The baseline is a file that is</text>
  <text x="54.0" y="233.0" font-size="13" fill="#14162B" textLength="205.2" lengthAdjust="spacingAndGlyphs">committed; --update stores a run as</text>
  <text x="54.0" y="251.0" font-size="13" fill="#14162B" textLength="74.4" lengthAdjust="spacingAndGlyphs">the new one.</text>
  <text x="64.0" y="281.9" font-size="11.5" fill="#14162B" font-family="Menlo, Consolas, monospace" textLength="186.9" lengthAdjust="spacingAndGlyphs">bench/baselines/basics.json</text>
  <text x="357.3" y="119.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="135.4" lengthAdjust="spacingAndGlyphs">Problem by problem</text>
  <text x="357.3" y="155.0" font-size="13" fill="#14162B" textLength="200.2" lengthAdjust="spacingAndGlyphs">Lost: verified in the baseline, not in</text>
  <text x="357.3" y="173.0" font-size="13" fill="#14162B" textLength="44.1" lengthAdjust="spacingAndGlyphs">the run.</text>
  <text x="357.3" y="197.0" font-size="13" fill="#14162B" textLength="212.5" lengthAdjust="spacingAndGlyphs">Gained: verified now, and not before.</text>
  <text x="357.3" y="221.0" font-size="13" fill="#14162B" textLength="211.0" lengthAdjust="spacingAndGlyphs">Missing: in the baseline, absent from</text>
  <text x="357.3" y="239.0" font-size="13" fill="#14162B" textLength="44.1" lengthAdjust="spacingAndGlyphs">the run.</text>
  <text x="367.3" y="281.9" font-size="11.5" fill="#14162B" font-family="Menlo, Consolas, monospace" textLength="166.2" lengthAdjust="spacingAndGlyphs">by problem, not by total</text>
  <text x="660.7" y="119.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="46.7" lengthAdjust="spacingAndGlyphs">Verdict</text>
  <text x="686.7" y="155.0" font-size="13" fill="#14162B" textLength="146.0" lengthAdjust="spacingAndGlyphs">passed: nothing was lost.</text>
  <text x="686.7" y="179.0" font-size="13" fill="#14162B" textLength="157.5" lengthAdjust="spacingAndGlyphs">failed: every lost problem is</text>
  <text x="686.7" y="197.0" font-size="13" fill="#14162B" textLength="181.4" lengthAdjust="spacingAndGlyphs">named, and the command exits</text>
  <text x="686.7" y="215.0" font-size="13" fill="#14162B" textLength="83.1" lengthAdjust="spacingAndGlyphs">with status 13.</text>
  <text x="670.7" y="281.9" font-size="11.5" fill="#14162B" font-family="Menlo, Consolas, monospace" textLength="131.5" lengthAdjust="spacingAndGlyphs">exit status 0 or 13</text>
  <text x="56.0" y="345.0" font-size="13" fill="#14162B" textLength="726.3" lengthAdjust="spacingAndGlyphs">By default the gate asks one thing: is every problem that the baseline verified still verified? A total that stays the same can hide</text>
  <text x="56.0" y="363.0" font-size="13" fill="#14162B" textLength="445.9" lengthAdjust="spacingAndGlyphs">one problem lost and another gained, so the comparison is made by problem.</text>
  <text x="56.0" y="387.0" font-size="13" fill="#14162B" textLength="713.1" lengthAdjust="spacingAndGlyphs">On request it also limits the share verified (--min-rate), the candidates tried (--max-attempts) and the time (--max-slowdown).</text>
  <text x="56.0" y="405.0" font-size="13" fill="#14162B" textLength="378.7" lengthAdjust="spacingAndGlyphs">Time depends on the machine, so that limit is off unless you set it.</text>
</svg>
