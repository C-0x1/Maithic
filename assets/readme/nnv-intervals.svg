  <path d="M390 260 L390 470" stroke="#C9CCE8" stroke-width="1" stroke-dasharray="2 4" fill="none"/>
  <path d="M440 260 L440 470" stroke="#C9CCE8" stroke-width="1" stroke-dasharray="2 4" fill="none"/>
