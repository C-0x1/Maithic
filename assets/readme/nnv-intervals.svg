<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 636" role="img" aria-labelledby="nnv-intervals-t nnv-intervals-d" font-family="'Helvetica Neue', Arial, sans-serif">
  <title id="nnv-intervals-t">Why a true property can be out of the verifier's reach</title>
  <desc id="nnv-intervals-d">The network that computes the absolute value, as relu of x plus relu of minus x, on inputs from minus 2 to 3. After the first layer, relu of x lies between 0 and 3 and relu of minus x between 0 and 2. Their sum is bounded by 0 and 5, although the network never outputs more than 3, because the two are never large together. Below, on a number line from 0 to 6: the true outputs cover 0 to 3, the proved box covers 0 to 5. The claim 0 to 6 is verified, because the proved box lies inside it. The claim 0 to 2 is refuted, because the input 3 gives 3. The claim 0 to 4 is true and stays unknown, because 5 is more than 4.</desc>
  <rect width="960" height="636" fill="#FAF8F4"/>
  <rect x="40.0" y="96.0" width="273.3" height="138.0" rx="10" fill="#FFFFFF" stroke="#5B6477" stroke-width="1.5"/>
  <rect x="343.3" y="96.0" width="273.3" height="138.0" rx="10" fill="#FFFFFF" stroke="#9558B2" stroke-width="1.5"/>
  <rect x="646.7" y="96.0" width="273.3" height="138.0" rx="10" fill="#FFFFFF" stroke="#9558B2" stroke-width="1.5"/>
