<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 717 508" width="717" height="508" role="img" aria-label="A terminal session: the same theorem is proved twice by step-wise search, first without and then with a trained model that orders the tactics. Both proofs are verified by Lean; the guided one is a step shorter, and the last line says that the guide answered six of six questions.">
  <title>A terminal session: the same theorem is proved twice by step-wise search, first without and then with a trained model that orders the tactics. Both proofs are verified by Lean; the guided one is a step shorter, and the last line says that the guide answered six of six questions.</title>
