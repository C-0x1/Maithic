    <text x="139.45" y="400" textLength="148.77" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">· simp [firstIndex]</text>
    <text x="139.45" y="419" textLength="148.77" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">· simp [firstIndex]</text>
    <text x="155.11" y="438" textLength="39.15" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">grind</text>
    <text x="37.66" y="457" textLength="54.81" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">axioms:</text>
    <text x="123.79" y="457" textLength="289.71" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">propext, Classical.choice, Quot.sound</text>
