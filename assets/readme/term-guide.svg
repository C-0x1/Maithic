    <text x="139.45" y="305" textLength="62.64" lengthAdjust="spacingAndGlyphs" fill="#57C98F">verified</text>
    <text x="217.75" y="305" textLength="250.56" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">(search, 19 attempt(s), 2549 ms)</text>
    <text x="37.66" y="324" textLength="579.42" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">statement: ∀ {α : Type} [inst : BEq α] [LawfulBEq α] {x : α} {l : List α},</text>
    <text x="37.66" y="343" textLength="297.54" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">(firstIndex x l).isSome = true ↔ x ∈ l</text>
