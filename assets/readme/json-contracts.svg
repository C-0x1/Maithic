<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 416" role="img" aria-labelledby="json-contracts-t json-contracts-d" font-family="'Helvetica Neue', Arial, sans-serif">
  <title id="json-contracts-t">Every document names its schema</title>
  <desc id="json-contracts-d">Three steps in a row. A command prints a document with the option json; the document names a schema, such as maithic.prove.run/1. The schema is a file under schemas, at a path that follows from the name. The contracts gate validates every fixture, every recorded Bridge answer and every result the command writes against the schema it names, and the readers in R and Julia check a file before they compute a number from it.</desc>
  <rect width="960" height="416" fill="#FAF8F4"/>
  <rect x="40.0" y="96.0" width="273.3" height="188.0" rx="10" fill="#FFFFFF" stroke="#EC6813" stroke-width="1.5"/>
  <rect x="343.3" y="96.0" width="273.3" height="188.0" rx="10" fill="#FFFFFF" stroke="#2B2F77" stroke-width="1.5"/>
  <rect x="646.7" y="96.0" width="273.3" height="188.0" rx="10" fill="#FFFFFF" stroke="#0B7F75" stroke-width="1.5"/>
  <rect x="40.0" y="302.0" width="880.0" height="84.0" rx="10" fill="#E8E9F3"/>
  <path d="M40.0 106.0a10 10 0 0 1 10-10h253.3a10 10 0 0 1 10 10v26.0h-273.3z" fill="#EC6813"/>
  <rect x="54.0" y="248.0" width="245.3" height="24.0" rx="6" fill="#E8E9F3"/>
  <path d="M317.3 190.0 L331.3 190.0" stroke="#5B6477" stroke-width="1.6" fill="none"/>
  <path d="M329.3333333333333 184.0 l10 6 l-10 6 z" fill="#5B6477"/>
  <path d="M343.3 106.0a10 10 0 0 1 10-10h253.3a10 10 0 0 1 10 10v26.0h-273.3z" fill="#2B2F77"/>
  <rect x="357.3" y="248.0" width="245.3" height="24.0" rx="6" fill="#E8E9F3"/>
  <path d="M620.7 190.0 L634.7 190.0" stroke="#5B6477" stroke-width="1.6" fill="none"/>
  <path d="M632.6666666666666 184.0 l10 6 l-10 6 z" fill="#5B6477"/>
  <path d="M646.7 106.0a10 10 0 0 1 10-10h253.3a10 10 0 0 1 10 10v26.0h-273.3z" fill="#0B7F75"/>
  <rect x="660.7" y="248.0" width="245.3" height="24.0" rx="6" fill="#E8E9F3"/>
  <text x="40.0" y="44.0" font-size="22" fill="#14162B" font-weight="700" textLength="540.4" lengthAdjust="spacingAndGlyphs">Every document names its schema, and is held to it</text>
  <text x="40.0" y="69.0" font-size="13.5" fill="#5B6477" font-family="Menlo, Consolas, monospace" textLength="203.2" lengthAdjust="spacingAndGlyphs">maithic prove FILE --json</text>
  <text x="54.0" y="119.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="80.4" lengthAdjust="spacingAndGlyphs">A document</text>
  <text x="54.0" y="155.0" font-size="13" fill="#14162B" textLength="194.3" lengthAdjust="spacingAndGlyphs">Every command prints JSON with</text>
  <text x="54.0" y="173.0" font-size="13" fill="#14162B" textLength="36.1" lengthAdjust="spacingAndGlyphs">--json.</text>
  <text x="54.0" y="197.0" font-size="13" fill="#14162B" textLength="198.0" lengthAdjust="spacingAndGlyphs">The document says what it is in its</text>
  <text x="54.0" y="215.0" font-size="13" fill="#14162B" textLength="75.1" lengthAdjust="spacingAndGlyphs">first member.</text>
  <text x="64.0" y="263.9" font-size="11.5" fill="#14162B" font-family="Menlo, Consolas, monospace" textLength="214.6" lengthAdjust="spacingAndGlyphs">"schema": "maithic.prove.run/1"</text>
  <text x="357.3" y="119.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="72.4" lengthAdjust="spacingAndGlyphs">Its schema</text>
  <text x="357.3" y="155.0" font-size="13" fill="#14162B" textLength="200.9" lengthAdjust="spacingAndGlyphs">A JSON Schema file, at a path that</text>
  <text x="357.3" y="173.0" font-size="13" fill="#14162B" textLength="195.1" lengthAdjust="spacingAndGlyphs">follows from the name: area, kind,</text>
  <text x="357.3" y="191.0" font-size="13" fill="#14162B" textLength="81.6" lengthAdjust="spacingAndGlyphs">major version.</text>
  <text x="367.3" y="263.9" font-size="11.5" fill="#14162B" font-family="Menlo, Consolas, monospace" textLength="200.8" lengthAdjust="spacingAndGlyphs">schemas/prove/run.schema.json</text>
  <text x="660.7" y="119.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="59.9" lengthAdjust="spacingAndGlyphs">Held to it</text>
  <text x="660.7" y="155.0" font-size="13" fill="#14162B" textLength="198.0" lengthAdjust="spacingAndGlyphs">The contracts gate validates every</text>
  <text x="660.7" y="173.0" font-size="13" fill="#14162B" textLength="198.7" lengthAdjust="spacingAndGlyphs">fixture and every result against the</text>
  <text x="660.7" y="191.0" font-size="13" fill="#14162B" textLength="101.9" lengthAdjust="spacingAndGlyphs">schema it names.</text>
  <text x="660.7" y="215.0" font-size="13" fill="#14162B" textLength="221.1" lengthAdjust="spacingAndGlyphs">The readers in R and Julia check a file</text>
  <text x="660.7" y="233.0" font-size="13" fill="#14162B" textLength="161.9" lengthAdjust="spacingAndGlyphs">before they compute from it.</text>
  <text x="670.7" y="263.9" font-size="11.5" fill="#14162B" font-family="Menlo, Consolas, monospace" textLength="83.1" lengthAdjust="spacingAndGlyphs">make hygiene</text>
  <text x="56.0" y="327.0" font-size="13" fill="#14162B" textLength="716.9" lengthAdjust="spacingAndGlyphs">The languages meet at documents and nowhere else: OCaml never links Lean, Julia or R code. A change to a document is a</text>
  <text x="56.0" y="345.0" font-size="13" fill="#14162B" textLength="338.9" lengthAdjust="spacingAndGlyphs">change to a schema, and a test fails until both sides agree.</text>
  <text x="56.0" y="369.0" font-size="13" fill="#14162B" textLength="527.3" lengthAdjust="spacingAndGlyphs">The validator is part of the repository, written on the standard library like the rest of the core.</text>
</svg>
