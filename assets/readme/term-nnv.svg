<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 976 432" width="976" height="432" role="img" aria-label="A terminal session: maithic nnv verify decides two properties of small neural networks. For the first the verifier claims that the outputs stay within the claimed box, and Lean's kernel accepts the theorem that says so. For the second the verifier claims a violation, the input 3 mapped to 3, outside the box, and Lean's kernel accepts the theorem that the property fails.">
  <title>A terminal session: maithic nnv verify decides two properties of small neural networks. For the first the verifier claims that the outputs stay within the claimed box, and Lean's kernel accepts the theorem that says so. For the second the verifier claims a violation, the input 3 mapped to 3, outside the box, and Lean's kernel accepts the theorem that the property fails.</title>
  <rect width="976" height="432" rx="10" fill="#14162B"/>
  <path d="M0 10a10 10 0 0 1 10-10h956a10 10 0 0 1 10 10v26h-976z" fill="#1E2142"/>
  <circle cx="22" cy="18" r="5.5" fill="#F26D72"/>
  <circle cx="40" cy="18" r="5.5" fill="#F0A92E"/>
  <circle cx="58" cy="18" r="5.5" fill="#57C98F"/>
  <text x="488" y="23" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8A90A6">maithic nnv verify</text>
  <g font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13">
    <text x="22.00" y="58" textLength="7.83" lengthAdjust="spacingAndGlyphs" fill="#2CC4B6" font-weight="bold">$</text>
    <text x="37.66" y="58" textLength="649.89" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3" font-weight="bold">maithic nnv verify examples/nnv/small-classifier.json examples/nnv/unit-square.json</text>
    <text x="22.00" y="77" textLength="54.81" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">network</text>
    <text x="100.30" y="77" textLength="321.03" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">small classifier: 3 layer(s), 6 neuron(s)</text>
    <text x="22.00" y="96" textLength="62.64" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">property</text>
    <text x="100.30" y="96" textLength="383.67" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">on the unit square the score stays within [-1, 1]</text>
    <text x="37.66" y="115" textLength="70.47" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">inputs in</text>
    <text x="131.62" y="115" textLength="117.45" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">[0, 1] x [0, 1]</text>
    <text x="37.66" y="134" textLength="78.30" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">outputs in</text>
    <text x="131.62" y="134" textLength="54.81" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">[-1, 1]</text>
    <text x="22.00" y="153" textLength="62.64" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">verifier</text>
    <text x="100.30" y="153" textLength="195.75" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">claims verified (2763 ms)</text>
    <text x="22.00" y="172" textLength="31.32" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">Lean</text>
    <text x="100.30" y="172" textLength="375.84" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">accepted Maithic.NNV.Job.property_holds (505 ms)</text>
    <text x="37.66" y="191" textLength="642.06" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">Maithic.NN.Holds Maithic.NNV.Job.net Maithic.NNV.Job.input Maithic.NNV.Job.claimed</text>
    <text x="22.00" y="210" textLength="869.13" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">verified: Lean's kernel accepted Maithic.NNV.Job.property_holds (axioms: propext, Classical.choice, Quot.sound)</text>
    <text x="22.00" y="248" textLength="7.83" lengthAdjust="spacingAndGlyphs" fill="#2CC4B6" font-weight="bold">$</text>
    <text x="37.66" y="248" textLength="618.57" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3" font-weight="bold">maithic nnv verify examples/nnv/absolute-value.json examples/nnv/too-tight.json</text>
    <text x="22.00" y="267" textLength="54.81" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">network</text>
    <text x="100.30" y="267" textLength="305.37" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">absolute value: 2 layer(s), 3 neuron(s)</text>
    <text x="22.00" y="286" textLength="62.64" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">property</text>
    <text x="100.30" y="286" textLength="321.03" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">on [-2, 3] the output stays within [0, 2]</text>
    <text x="37.66" y="305" textLength="70.47" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">inputs in</text>
    <text x="131.62" y="305" textLength="54.81" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">[-2, 3]</text>
    <text x="37.66" y="324" textLength="78.30" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">outputs in</text>
    <text x="131.62" y="324" textLength="46.98" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">[0, 2]</text>
    <text x="22.00" y="343" textLength="62.64" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">verifier</text>
    <text x="100.30" y="343" textLength="195.75" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">claims violated (2956 ms)</text>
    <text x="22.00" y="362" textLength="31.32" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">Lean</text>
    <text x="100.30" y="362" textLength="375.84" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">accepted Maithic.NNV.Job.property_fails (429 ms)</text>
    <text x="37.66" y="381" textLength="649.89" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">¬Maithic.NN.Holds Maithic.NNV.Job.net Maithic.NNV.Job.input Maithic.NNV.Job.claimed</text>
    <text x="22.00" y="400" textLength="931.77" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">refuted: the input (3) is mapped to (3), outside the claimed box; Lean's kernel accepted Maithic.NNV.Job.property_fails</text>
  </g>
</svg>
