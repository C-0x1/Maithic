<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 416" role="img" aria-labelledby="corpus-integrity-t corpus-integrity-d" font-family="'Helvetica Neue', Arial, sans-serif">
  <title id="corpus-integrity-t">A dataset that can be checked</title>
  <desc id="corpus-integrity-d">Three steps in a row. Records are written into shards, files of one record per line, and a shard is named by the SHA-256 of its content. The manifest lists every shard with its hash and its number of records, and names the sources and their revision. maithic corpus verify checks that every shard is there with that hash and count, that every record follows its schema, and that the folder holds nothing the manifest does not list.</desc>
  <rect width="960" height="416" fill="#FAF8F4"/>
  <rect x="40.0" y="96.0" width="273.3" height="212.0" rx="10" fill="#FFFFFF" stroke="#2B2F77" stroke-width="1.5"/>
  <rect x="343.3" y="96.0" width="273.3" height="212.0" rx="10" fill="#FFFFFF" stroke="#B37400" stroke-width="1.5"/>
  <rect x="646.7" y="96.0" width="273.3" height="212.0" rx="10" fill="#FFFFFF" stroke="#0B7F75" stroke-width="1.5"/>
  <rect x="40.0" y="326.0" width="880.0" height="60.0" rx="10" fill="#E8E9F3"/>
  <path d="M40.0 106.0a10 10 0 0 1 10-10h253.3a10 10 0 0 1 10 10v26.0h-273.3z" fill="#2B2F77"/>
  <rect x="54.0" y="272.0" width="245.3" height="24.0" rx="6" fill="#E8E9F3"/>
  <path d="M317.3 202.0 L331.3 202.0" stroke="#5B6477" stroke-width="1.6" fill="none"/>
  <path d="M329.3333333333333 196.0 l10 6 l-10 6 z" fill="#5B6477"/>
  <path d="M343.3 106.0a10 10 0 0 1 10-10h253.3a10 10 0 0 1 10 10v26.0h-273.3z" fill="#B37400"/>
  <rect x="357.3" y="272.0" width="245.3" height="24.0" rx="6" fill="#E8E9F3"/>
  <path d="M620.7 202.0 L634.7 202.0" stroke="#5B6477" stroke-width="1.6" fill="none"/>
  <path d="M632.6666666666666 196.0 l10 6 l-10 6 z" fill="#5B6477"/>
  <path d="M646.7 106.0a10 10 0 0 1 10-10h253.3a10 10 0 0 1 10 10v26.0h-273.3z" fill="#0B7F75"/>
  <circle cx="669.6666666666666" cy="152.0" r="8" fill="#0FA89B"/>
  <path d="M665.1666666666666 152.0 l3.2 3.6 l6 -7.2" stroke="#FFFFFF" stroke-width="2.1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="669.6666666666666" cy="194.0" r="8" fill="#0FA89B"/>
  <path d="M665.1666666666666 194.0 l3.2 3.6 l6 -7.2" stroke="#FFFFFF" stroke-width="2.1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="669.6666666666666" cy="236.0" r="8" fill="#0FA89B"/>
  <path d="M665.1666666666666 236.0 l3.2 3.6 l6 -7.2" stroke="#FFFFFF" stroke-width="2.1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="660.7" y="272.0" width="245.3" height="24.0" rx="6" fill="#E8E9F3"/>
  <text x="40.0" y="44.0" font-size="22" fill="#14162B" font-weight="700" textLength="458.9" lengthAdjust="spacingAndGlyphs">A dataset that can be checked, byte for byte</text>
  <text x="40.0" y="69.0" font-size="13.5" fill="#5B6477" font-family="Menlo, Consolas, monospace" textLength="235.7" lengthAdjust="spacingAndGlyphs">maithic corpus verify dataset</text>
  <text x="54.0" y="119.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="47.5" lengthAdjust="spacingAndGlyphs">Shards</text>
  <text x="54.0" y="155.0" font-size="13" fill="#14162B" textLength="185.7" lengthAdjust="spacingAndGlyphs">One record on each line, with its</text>
  <text x="54.0" y="173.0" font-size="13" fill="#14162B" textLength="207.4" lengthAdjust="spacingAndGlyphs">schema and an identifier made from</text>
  <text x="54.0" y="191.0" font-size="13" fill="#14162B" textLength="62.9" lengthAdjust="spacingAndGlyphs">its content.</text>
  <text x="54.0" y="215.0" font-size="13" fill="#14162B" textLength="210.3" lengthAdjust="spacingAndGlyphs">A shard is named by the SHA-256 of</text>
  <text x="54.0" y="233.0" font-size="13" fill="#14162B" textLength="75.9" lengthAdjust="spacingAndGlyphs">what it holds.</text>
  <text x="64.0" y="287.9" font-size="11.5" fill="#14162B" font-family="Menlo, Consolas, monospace" textLength="200.8" lengthAdjust="spacingAndGlyphs">shards/pair-2b4a050d....jsonl</text>
  <text x="357.3" y="119.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="86.4" lengthAdjust="spacingAndGlyphs">The manifest</text>
  <text x="357.3" y="155.0" font-size="13" fill="#14162B" textLength="186.4" lengthAdjust="spacingAndGlyphs">Every shard with its hash and its</text>
  <text x="357.3" y="173.0" font-size="13" fill="#14162B" textLength="109.1" lengthAdjust="spacingAndGlyphs">number of records.</text>
  <text x="357.3" y="197.0" font-size="13" fill="#14162B" textLength="198.7" lengthAdjust="spacingAndGlyphs">The sources, and the revision they</text>
  <text x="357.3" y="215.0" font-size="13" fill="#14162B" textLength="46.2" lengthAdjust="spacingAndGlyphs">were at.</text>
  <text x="367.3" y="287.9" font-size="11.5" fill="#14162B" font-family="Menlo, Consolas, monospace" textLength="90.0" lengthAdjust="spacingAndGlyphs">manifest.json</text>
  <text x="660.7" y="119.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="68.5" lengthAdjust="spacingAndGlyphs">The check</text>
  <text x="686.7" y="155.0" font-size="13" fill="#14162B" textLength="169.8" lengthAdjust="spacingAndGlyphs">every shard is there, with that</text>
  <text x="686.7" y="173.0" font-size="13" fill="#14162B" textLength="88.9" lengthAdjust="spacingAndGlyphs">hash and count</text>
  <text x="686.7" y="197.0" font-size="13" fill="#14162B" textLength="186.4" lengthAdjust="spacingAndGlyphs">every record follows the schema</text>
  <text x="686.7" y="215.0" font-size="13" fill="#14162B" textLength="54.9" lengthAdjust="spacingAndGlyphs">of its kind</text>
  <text x="686.7" y="239.0" font-size="13" fill="#14162B" textLength="156.8" lengthAdjust="spacingAndGlyphs">the folder holds nothing the</text>
  <text x="686.7" y="257.0" font-size="13" fill="#14162B" textLength="122.1" lengthAdjust="spacingAndGlyphs">manifest does not list</text>
  <text x="670.7" y="287.9" font-size="11.5" fill="#14162B" font-family="Menlo, Consolas, monospace" textLength="131.5" lengthAdjust="spacingAndGlyphs">exit status 0, or 7</text>
  <text x="56.0" y="351.0" font-size="13" fill="#14162B" textLength="738.6" lengthAdjust="spacingAndGlyphs">The same sources give the same bytes and the same names on any machine. One byte added to a shard, and the check names</text>
  <text x="56.0" y="369.0" font-size="13" fill="#14162B" textLength="57.8" lengthAdjust="spacingAndGlyphs">the shard.</text>
</svg>
