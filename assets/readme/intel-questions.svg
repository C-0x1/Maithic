<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" role="img" aria-labelledby="intel-questions-t intel-questions-d" font-family="'Helvetica Neue', Arial, sans-serif">
  <title id="intel-questions-t">Six commands on one graph</title>
  <desc id="intel-questions-d">Six cards. Scan asks Lean once about every file and keeps the answer as a graph. Show tells what a declaration is, what it uses and what uses it. Deps lists everything it depends on, with the distance. Dependents lists everything that depends on it, which is what a change would reach. Health lists every unfinished proof with its open goal, and the axioms in use. Stats gives the size and shape of the graph and the declarations most others use.</desc>
  <rect width="1040" height="520" fill="#FAF8F4"/>
  <rect x="40.0" y="96.0" width="308.0" height="170.0" rx="10" fill="#FFFFFF" stroke="#2B2F77" stroke-width="1.5"/>
  <rect x="366.0" y="96.0" width="308.0" height="170.0" rx="10" fill="#FFFFFF" stroke="#2B2F77" stroke-width="1.5"/>
  <rect x="692.0" y="96.0" width="308.0" height="170.0" rx="10" fill="#FFFFFF" stroke="#2B2F77" stroke-width="1.5"/>
  <rect x="40.0" y="284.0" width="308.0" height="128.0" rx="10" fill="#FFFFFF" stroke="#2B2F77" stroke-width="1.5"/>
  <rect x="366.0" y="284.0" width="308.0" height="128.0" rx="10" fill="#FFFFFF" stroke="#0B7F75" stroke-width="1.5"/>
  <rect x="692.0" y="284.0" width="308.0" height="128.0" rx="10" fill="#FFFFFF" stroke="#0B7F75" stroke-width="1.5"/>
  <rect x="40.0" y="430.0" width="960.0" height="60.0" rx="10" fill="#E8E9F3"/>
  <path d="M40.0 106.0a10 10 0 0 1 10-10h288.0a10 10 0 0 1 10 10v26.0h-308.0z" fill="#2B2F77"/>
  <rect x="54.0" y="230.0" width="280.0" height="24.0" rx="6" fill="#E8E9F3"/>
  <path d="M366.0 106.0a10 10 0 0 1 10-10h288.0a10 10 0 0 1 10 10v26.0h-308.0z" fill="#2B2F77"/>
  <rect x="380.0" y="230.0" width="280.0" height="24.0" rx="6" fill="#E8E9F3"/>
  <path d="M692.0 106.0a10 10 0 0 1 10-10h288.0a10 10 0 0 1 10 10v26.0h-308.0z" fill="#2B2F77"/>
  <rect x="706.0" y="230.0" width="280.0" height="24.0" rx="6" fill="#E8E9F3"/>
  <path d="M40.0 294.0a10 10 0 0 1 10-10h288.0a10 10 0 0 1 10 10v26.0h-308.0z" fill="#2B2F77"/>
