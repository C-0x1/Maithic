<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1007 394" width="1007" height="394" role="img" aria-label="A terminal session: maithic algo synth asks a model for a run-length encoding function. The first draft does not compile because Lean cannot see that it terminates. The correction compiles and gets three of five examples right, and the two wrong answers are shown. The next correction gets all five right and is accepted.">
  <title>A terminal session: maithic algo synth asks a model for a run-length encoding function. The first draft does not compile because Lean cannot see that it terminates. The correction compiles and gets three of five examples right, and the two wrong answers are shown. The next correction gets all five right and is accepted.</title>
  <rect width="1007" height="394" rx="10" fill="#14162B"/>
  <path d="M0 10a10 10 0 0 1 10-10h987a10 10 0 0 1 10 10v26h-1007z" fill="#1E2142"/>
  <circle cx="22" cy="18" r="5.5" fill="#F26D72"/>
  <circle cx="40" cy="18" r="5.5" fill="#F0A92E"/>
  <circle cx="58" cy="18" r="5.5" fill="#57C98F"/>
  <text x="504" y="23" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8A90A6">maithic algo synth</text>
  <g font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13">
    <text x="22.00" y="58" textLength="7.83" lengthAdjust="spacingAndGlyphs" fill="#2CC4B6" font-weight="bold">$</text>
    <text x="37.66" y="58" textLength="383.67" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3" font-weight="bold">maithic algo synth examples/algo/run-lengths.toml</text>
    <text x="22.00" y="77" textLength="70.47" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">attempt 1</text>
    <text x="108.13" y="77" textLength="54.81" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">(draft)</text>
    <text x="178.60" y="77" textLength="508.95" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">does not compile: line 2: fail to show termination for runLengths</text>
    <text x="22.00" y="96" textLength="70.47" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">attempt 2</text>
    <text x="108.13" y="96" textLength="62.64" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">(repair)</text>
    <text x="186.43" y="96" textLength="258.39" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">compiles; 3 of 5 example(s) right</text>
    <text x="53.32" y="115" textLength="227.07" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">runLengths [1, 1, 2, 3, 3, 3]</text>
    <text x="296.05" y="115" textLength="86.13" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">should give</text>
    <text x="397.84" y="115" textLength="187.92" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">[(1, 2), (2, 1), (3, 3)]</text>
    <text x="601.42" y="115" textLength="70.47" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">and gives</text>
    <text x="687.55" y="115" textLength="62.64" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">[(1, 2)]</text>
    <text x="53.32" y="134" textLength="250.56" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">(runLengths [5, 5, 6, 5]).length</text>
    <text x="319.54" y="134" textLength="86.13" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">should give</text>
    <text x="421.33" y="134" textLength="7.83" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">3</text>
    <text x="444.82" y="134" textLength="70.47" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">and gives</text>
    <text x="530.95" y="134" textLength="7.83" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">1</text>
    <text x="22.00" y="153" textLength="70.47" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">attempt 3</text>
    <text x="108.13" y="153" textLength="62.64" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">(repair)</text>
    <text x="186.43" y="153" textLength="258.39" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">compiles; 5 of 5 example(s) right</text>
    <text x="22.00" y="191" textLength="963.09" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">/-- The maximal runs of equal neighbours in `l`, in order, each as its value and its length; the empty list has no runs. -/</text>
    <text x="22.00" y="210" textLength="399.33" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">def runLengths (l : List Nat) : List (Nat × Nat) :=</text>
    <text x="37.66" y="229" textLength="93.96" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">match l with</text>
    <text x="37.66" y="248" textLength="78.30" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">| [] =&gt; []</text>
    <text x="37.66" y="267" textLength="109.62" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">| x :: rest =&gt;</text>
    <text x="53.32" y="286" textLength="203.58" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">match runLengths rest with</text>
    <text x="53.32" y="305" textLength="642.06" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">| (y, n) :: tail =&gt; if x = y then (y, n + 1) :: tail else (x, 1) :: (y, n) :: tail</text>
    <text x="53.32" y="324" textLength="125.28" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">| [] =&gt; [(x, 1)]</text>
    <text x="22.00" y="362" textLength="602.91" lengthAdjust="spacingAndGlyphs" fill="#57C98F">accepted: runLengths compiles and gets 5 example(s) right, after 3 attempt(s)</text>
  </g>
</svg>
