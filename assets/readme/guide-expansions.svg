<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 628" role="img" aria-labelledby="t d" font-family="'Helvetica Neue', Arial, sans-serif">
  <title id="t">The goals a search expanded, without and with a guide</title>
  <desc id="d">Two step-wise searches for the same theorem, found_iff_mem of examples/guided.lean, drawn as the goals each search expanded, in order. Without a guide the search expands 28 goals: the first goal, two goals left by constructor, two left by intros, the two goals left by induction on the list, then eighteen more goals left by induction, constructor, intros and simp on side branches, among them one that the proof needs, and at last the goal left by simp with the definition of firstIndex, which grind closes. Four of the 28 are on the proof it finds. With the guide the search expands 6 goals: the first goal, the two goals left by constructor, the two left by induction, and the goal left by simp with the definition, which grind closes. Four of the 6 are on the proof. Below, three notes: the guide reads a goal as text and answers with probabilities for tactic templates; what it changes is which open goal the search takes up next; what it cannot change is which tactics succeed, since Lean runs every one, and whether a proof counts. If the guide does not answer, the search goes on in its own order.</desc>
  <rect width="960" height="628" fill="#FAF8F4"/>
  <text x="40" y="44" font-size="22" fill="#14162B" font-weight="700" textLength="697.3" lengthAdjust="spacingAndGlyphs">A guide decides which goal comes next. Lean still runs every step.</text>
  <text x="40" y="68" font-size="14" fill="#5B6477" textLength="858.2" lengthAdjust="spacingAndGlyphs">The theorem found_iff_mem of examples/guided.lean: every goal the step-wise search expanded, in order, without and with a tactic model.</text>
