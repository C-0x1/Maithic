  <rect x="264" y="280" width="656" height="66" rx="8" fill="#FFFFFF" stroke="#0FA89B" stroke-width="1.5"/>
  <text x="280" y="303" font-size="12.5" fill="#14162B" textLength="413.5" lengthAdjust="spacingAndGlyphs">The same candidates are tried on every goal, and Lean runs each of them.</text>
  <text x="280" y="322" font-size="12" fill="#5B6477" textLength="506.3" lengthAdjust="spacingAndGlyphs">After the induction, the guide sends the search to the goal that simp [firstIndex] left, and not into</text>
  <text x="280" y="338" font-size="12" fill="#5B6477" textLength="346.2" lengthAdjust="spacingAndGlyphs">the side branches. It arrives at a proof after 6 goals instead of 28.</text>
  <rect x="40" y="394" width="280" height="124" rx="8" fill="#FFFFFF" stroke="#9558B2" stroke-width="1.5"/>
  <rect x="40" y="394" width="6" height="124" rx="3" fill="#9558B2"/>
  <text x="60" y="420" font-size="13.5" fill="#14162B" font-weight="700" textLength="136.5" lengthAdjust="spacingAndGlyphs">What the guide reads</text>
  <text x="60" y="442" font-size="12" fill="#5B6477" textLength="170.1" lengthAdjust="spacingAndGlyphs">A goal as text, and nothing else.</text>
  <text x="60" y="459" font-size="12" fill="#5B6477" textLength="164.7" lengthAdjust="spacingAndGlyphs">It answers with a probability for</text>
  <text x="60" y="476" font-size="12" fill="#5B6477" textLength="181.4" lengthAdjust="spacingAndGlyphs">each tactic template: simp [_] gets</text>
  <text x="60" y="493" font-size="12" fill="#5B6477" textLength="150.1" lengthAdjust="spacingAndGlyphs">46.4% on the first goal here.</text>
  <rect x="340" y="394" width="280" height="124" rx="8" fill="#FFFFFF" stroke="#2B2F77" stroke-width="1.5"/>
  <rect x="340" y="394" width="6" height="124" rx="3" fill="#2B2F77"/>
  <text x="360" y="420" font-size="13.5" fill="#14162B" font-weight="700" textLength="103.5" lengthAdjust="spacingAndGlyphs">What it changes</text>
  <text x="360" y="442" font-size="12" fill="#5B6477" textLength="181.4" lengthAdjust="spacingAndGlyphs">The order in which open goals are</text>
  <text x="360" y="459" font-size="12" fill="#5B6477" textLength="187.2" lengthAdjust="spacingAndGlyphs">taken up. The search combines the</text>
  <text x="360" y="476" font-size="12" fill="#5B6477" textLength="164.4" lengthAdjust="spacingAndGlyphs">model's probability with its own</text>
  <text x="360" y="493" font-size="12" fill="#5B6477" textLength="138.7" lengthAdjust="spacingAndGlyphs">preference for each tactic.</text>
  <rect x="640" y="394" width="280" height="124" rx="8" fill="#FFFFFF" stroke="#0FA89B" stroke-width="1.5"/>
  <rect x="640" y="394" width="6" height="124" rx="3" fill="#0FA89B"/>
  <text x="660" y="420" font-size="13.5" fill="#14162B" font-weight="700" textLength="144.0" lengthAdjust="spacingAndGlyphs">What it cannot change</text>
  <text x="660" y="442" font-size="12" fill="#5B6477" textLength="178.8" lengthAdjust="spacingAndGlyphs">Which tactics succeed: Lean runs</text>
  <text x="660" y="459" font-size="12" fill="#5B6477" textLength="187.4" lengthAdjust="spacingAndGlyphs">every one. Whether a proof counts:</text>
  <text x="660" y="476" font-size="12" fill="#5B6477" textLength="160.1" lengthAdjust="spacingAndGlyphs">the kernel, the trust policy and</text>
  <text x="660" y="493" font-size="12" fill="#5B6477" textLength="161.4" lengthAdjust="spacingAndGlyphs">the fresh re-check decide that.</text>
  <rect x="40" y="536" width="880" height="56" rx="10" fill="#14162B"/>
  <text x="58" y="560" font-size="13" fill="#F0A92E" font-weight="700" textLength="254.6" lengthAdjust="spacingAndGlyphs">A search never fails because of its guide.</text>
  <text x="58" y="580" font-size="11.5" fill="#E8E9F3" textLength="788.2" lengthAdjust="spacingAndGlyphs">The model runs as a service in Julia. If it does not start, stops answering or answers nonsense, the search goes on in its own order and the record says so.</text>
</svg>
