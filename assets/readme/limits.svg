<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="limits-t limits-d" font-family="'Helvetica Neue', Arial, sans-serif">
  <title id="limits-t">What verified does not mean</title>
  <desc id="limits-d">Four cards. The statement is yours: Maithic checks that the proof proves the statement in your file, not that the statement says what you meant. The trusted base: Lean's kernel, the Lean toolchain that elaborates the file, and the Maithic code that reads Lean's answers and applies the policy. The screen is a filter: it reduces what untrusted text can do and is not an operating-system sandbox. Native evaluation: a proof that passes with allow_native trusts the compiler in addition to the kernel.</desc>
  <rect width="960" height="420" fill="#FAF8F4"/>
  <rect x="40.0" y="96.0" width="431.0" height="156.0" rx="10" fill="#FFFFFF" stroke="#B37400" stroke-width="1.5"/>
  <rect x="489.0" y="96.0" width="431.0" height="156.0" rx="10" fill="#FFFFFF" stroke="#B37400" stroke-width="1.5"/>
  <rect x="40.0" y="270.0" width="431.0" height="120.0" rx="10" fill="#FFFFFF" stroke="#B37400" stroke-width="1.5"/>
  <rect x="489.0" y="270.0" width="431.0" height="120.0" rx="10" fill="#FFFFFF" stroke="#B37400" stroke-width="1.5"/>
  <path d="M40.0 106.0a10 10 0 0 1 10-10h411.0a10 10 0 0 1 10 10v26.0h-431.0z" fill="#B37400"/>
  <path d="M489.0 106.0a10 10 0 0 1 10-10h411.0a10 10 0 0 1 10 10v26.0h-431.0z" fill="#B37400"/>
  <path d="M40.0 280.0a10 10 0 0 1 10-10h411.0a10 10 0 0 1 10 10v26.0h-431.0z" fill="#B37400"/>
  <path d="M489.0 280.0a10 10 0 0 1 10-10h411.0a10 10 0 0 1 10 10v26.0h-431.0z" fill="#B37400"/>
  <text x="40.0" y="44.0" font-size="22" fill="#14162B" font-weight="700" textLength="299.5" lengthAdjust="spacingAndGlyphs">What verified does not mean</text>
  <text x="40.0" y="69.0" font-size="13.5" fill="#5B6477" font-family="Menlo, Consolas, monospace" textLength="178.8" lengthAdjust="spacingAndGlyphs">docs/concepts/trust.md</text>
  <text x="54.0" y="119.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="152.5" lengthAdjust="spacingAndGlyphs">The statement is yours</text>
  <text x="54.0" y="155.0" font-size="13" fill="#14162B" textLength="333.1" lengthAdjust="spacingAndGlyphs">Maithic checks that the proof proves the statement in your</text>
  <text x="54.0" y="173.0" font-size="13" fill="#14162B" textLength="20.2" lengthAdjust="spacingAndGlyphs">file.</text>
  <text x="54.0" y="197.0" font-size="13" fill="#14162B" textLength="335.3" lengthAdjust="spacingAndGlyphs">It does not check that the statement says what you meant.</text>
  <text x="54.0" y="215.0" font-size="13" fill="#14162B" textLength="327.4" lengthAdjust="spacingAndGlyphs">The statement tests and the refuter are there to help with</text>
  <text x="54.0" y="233.0" font-size="13" fill="#14162B" textLength="135.9" lengthAdjust="spacingAndGlyphs">that, and they are tests.</text>
  <text x="503.0" y="119.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="139.2" lengthAdjust="spacingAndGlyphs">Something is trusted</text>
  <text x="503.0" y="155.0" font-size="13" fill="#14162B" textLength="350.9" lengthAdjust="spacingAndGlyphs">Lean's kernel, the Lean toolchain that elaborates the file, and</text>
  <text x="503.0" y="173.0" font-size="13" fill="#14162B" textLength="341.4" lengthAdjust="spacingAndGlyphs">the Maithic code that reads Lean's answers and applies the</text>
  <text x="503.0" y="191.0" font-size="13" fill="#14162B" textLength="35.9" lengthAdjust="spacingAndGlyphs">policy.</text>
  <text x="54.0" y="293.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="135.4" lengthAdjust="spacingAndGlyphs">The screen is a filter</text>
  <text x="54.0" y="329.0" font-size="13" fill="#14162B" textLength="344.0" lengthAdjust="spacingAndGlyphs">It reduces what text from a model can do before Lean reads</text>
  <text x="54.0" y="347.0" font-size="13" fill="#14162B" textLength="10.1" lengthAdjust="spacingAndGlyphs">it.</text>
  <text x="54.0" y="371.0" font-size="13" fill="#14162B" textLength="326.6" lengthAdjust="spacingAndGlyphs">It is a lexical filter, and not an operating-system sandbox.</text>
  <text x="503.0" y="293.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="115.2" lengthAdjust="spacingAndGlyphs">Native evaluation</text>
  <text x="503.0" y="329.0" font-size="13" fill="#14162B" textLength="323.0" lengthAdjust="spacingAndGlyphs">The default policy rejects proofs by compiled evaluation.</text>
  <text x="503.0" y="353.0" font-size="13" fill="#14162B" textLength="342.9" lengthAdjust="spacingAndGlyphs">A project that sets allow_native = true trusts the compiler as</text>
  <text x="503.0" y="371.0" font-size="13" fill="#14162B" textLength="104.1" lengthAdjust="spacingAndGlyphs">well as the kernel.</text>
</svg>
