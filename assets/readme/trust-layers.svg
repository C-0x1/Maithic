<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="t d" font-family="'Helvetica Neue', Arial, sans-serif">
  <title id="t">What stands between a proposal and the word verified</title>
  <desc id="d">Five layers in order. The screen rejects text that could run a program. The kernel checks the proof. The axiom audit lists what the proof rests on. The trust policy accepts only allowed axioms. The fresh re-check repeats the check in a new process. Under each layer is an example of what it stops or reveals.</desc>
  <rect width="960" height="300" fill="#FAF8F4"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#14162B" textLength="591.7" lengthAdjust="spacingAndGlyphs">What stands between a proposal and the word “verified”</text>
  <g font-size="14">
    <g transform="translate(40 76)">
      <rect width="168" height="92" rx="10" fill="#FFFFFF" stroke="#5B6477" stroke-width="1.5"/>
      <text x="14" y="28" font-size="16" font-weight="700" fill="#14162B" textLength="76.5" lengthAdjust="spacingAndGlyphs">1 · Screen</text>
      <text x="14" y="52" fill="#5B6477" textLength="140.9" lengthAdjust="spacingAndGlyphs">no commands, no new</text>
      <text x="14" y="72" fill="#5B6477" textLength="130.7" lengthAdjust="spacingAndGlyphs">axioms, no programs</text>
    </g>
    <g transform="translate(218 76)">
      <rect width="168" height="92" rx="10" fill="#0FA89B"/>
      <text x="14" y="28" font-size="16" font-weight="700" fill="#FFFFFF" textLength="72.9" lengthAdjust="spacingAndGlyphs">2 · Kernel</text>
      <text x="14" y="52" fill="#FFFFFF" textLength="127.7" lengthAdjust="spacingAndGlyphs">Lean elaborates and</text>
      <text x="14" y="72" fill="#FFFFFF" textLength="133.9" lengthAdjust="spacingAndGlyphs">type-checks the proof</text>
    </g>
    <g transform="translate(396 76)">
      <rect width="168" height="92" rx="10" fill="#FFFFFF" stroke="#0FA89B" stroke-width="2"/>
      <text x="14" y="28" font-size="16" font-weight="700" fill="#14162B" textLength="114.1" lengthAdjust="spacingAndGlyphs">3 · Axiom audit</text>
      <text x="14" y="52" fill="#5B6477" textLength="134.6" lengthAdjust="spacingAndGlyphs">every axiom the proof</text>
      <text x="14" y="72" fill="#5B6477" textLength="123.7" lengthAdjust="spacingAndGlyphs">rests on, transitively</text>
    </g>
    <g transform="translate(574 76)">
      <rect width="168" height="92" rx="10" fill="#FFFFFF" stroke="#2B2F77" stroke-width="2"/>
      <text x="14" y="28" font-size="16" font-weight="700" fill="#14162B" textLength="112.9" lengthAdjust="spacingAndGlyphs">4 · Trust policy</text>
      <text x="14" y="52" fill="#5B6477" textLength="129.2" lengthAdjust="spacingAndGlyphs">only allowed axioms,</text>
      <text x="14" y="72" fill="#5B6477" textLength="126.8" lengthAdjust="spacingAndGlyphs">a theorem, no errors</text>
    </g>
    <g transform="translate(752 76)">
      <rect width="168" height="92" rx="10" fill="#14162B"/>
      <text x="14" y="28" font-size="16" font-weight="700" fill="#FAF8F4" textLength="137.0" lengthAdjust="spacingAndGlyphs">5 · Fresh re-check</text>
      <text x="14" y="52" fill="#E8E9F3" textLength="126.1" lengthAdjust="spacingAndGlyphs">a new process, from</text>
      <text x="14" y="72" fill="#E8E9F3" textLength="107.4" lengthAdjust="spacingAndGlyphs">the imports alone</text>
    </g>
  </g>
  <text x="40" y="206" font-size="13" font-weight="700" fill="#E5484D" textLength="202.3" lengthAdjust="spacingAndGlyphs">What each layer stops or reveals</text>
  <g font-size="13" fill="#14162B">
    <path d="M48 222v54" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round"/>
    <text x="60" y="236" textLength="131.3" lengthAdjust="spacingAndGlyphs">a proof that says sorry,</text>
    <text x="60" y="255" textLength="128.6" lengthAdjust="spacingAndGlyphs">calls #eval or declares</text>
    <text x="60" y="274" textLength="52.8" lengthAdjust="spacingAndGlyphs">an axiom</text>
    <path d="M226 222v54" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round"/>
    <text x="238" y="236" textLength="119.3" lengthAdjust="spacingAndGlyphs">a proof that does not</text>
    <text x="238" y="255" textLength="143.1" lengthAdjust="spacingAndGlyphs">type-check: Lean reports</text>
    <text x="238" y="274" textLength="83.8" lengthAdjust="spacingAndGlyphs">the exact error</text>
    <path d="M404 222v54" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round"/>
    <text x="416" y="236" textLength="127.2" lengthAdjust="spacingAndGlyphs">an axiom that came in</text>
    <text x="416" y="255" textLength="99.0" lengthAdjust="spacingAndGlyphs">through the file is</text>
    <text x="416" y="274" textLength="83.8" lengthAdjust="spacingAndGlyphs">listed by name</text>
    <path d="M582 222v54" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round"/>
    <text x="594" y="236" textLength="104.8" lengthAdjust="spacingAndGlyphs">a proof that needs</text>
    <text x="594" y="255" textLength="88.9" lengthAdjust="spacingAndGlyphs">choice, under a</text>
    <text x="594" y="274" textLength="106.2" lengthAdjust="spacingAndGlyphs">constructive policy</text>
    <path d="M760 222v54" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round"/>
    <text x="772" y="236" textLength="119.3" lengthAdjust="spacingAndGlyphs">a proof that relied on</text>
    <text x="772" y="255" textLength="133.7" lengthAdjust="spacingAndGlyphs">the state of the session</text>
    <text x="772" y="274" textLength="104.8" lengthAdjust="spacingAndGlyphs">rather than the file</text>
  </g>
</svg>
