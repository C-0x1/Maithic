<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 757 508" width="757" height="508" role="img" aria-label="A terminal session: maithic version prints the version of the command, of the Bridge protocol, of Lean and of OCaml. maithic doctor lists Lean, Lake, the Bridge with the result of its self-test, curl, Julia and R, each with its version and the status ok, and then the gateway mode, the provider and model, and that candidate screening is active and that Lean workers never see API keys.">
