  <rect x="796.5" y="284.0" width="189.5" height="24.0" rx="6" fill="#E8E9F3"/>
  <text x="40.0" y="44.0" font-size="22" fill="#14162B" font-weight="700" textLength="633.2" lengthAdjust="spacingAndGlyphs">From an argument in words to a formalization that is tracked</text>
  <text x="40.0" y="69.0" font-size="13.5" fill="#5B6477" font-family="Menlo, Consolas, monospace" textLength="243.8" lengthAdjust="spacingAndGlyphs">examples/blueprint/argument.md</text>
  <text x="54.0" y="119.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="41.2" lengthAdjust="spacingAndGlyphs">1  Plan</text>
  <text x="54.0" y="155.0" font-size="13" fill="#14162B" textLength="161.9" lengthAdjust="spacingAndGlyphs">A model takes the argument</text>
  <text x="54.0" y="173.0" font-size="13" fill="#14162B" textLength="120.0" lengthAdjust="spacingAndGlyphs">apart into definitions,</text>
  <text x="54.0" y="191.0" font-size="13" fill="#14162B" textLength="132.2" lengthAdjust="spacingAndGlyphs">lemmas and theorems.</text>
  <text x="54.0" y="215.0" font-size="13" fill="#14162B" textLength="153.9" lengthAdjust="spacingAndGlyphs">The answer is put in order:</text>
  <text x="54.0" y="233.0" font-size="13" fill="#14162B" textLength="108.4" lengthAdjust="spacingAndGlyphs">plain identifiers, no</text>
  <text x="54.0" y="251.0" font-size="13" fill="#14162B" textLength="151.0" lengthAdjust="spacingAndGlyphs">reference to a node that is</text>
  <text x="54.0" y="269.0" font-size="13" fill="#14162B" textLength="110.6" lengthAdjust="spacingAndGlyphs">not there, no circle.</text>
  <text x="64.0" y="299.9" font-size="11.5" fill="#14162B" font-family="Menlo, Consolas, monospace" textLength="96.9" lengthAdjust="spacingAndGlyphs">blueprint plan</text>
  <text x="301.5" y="119.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="70.0" lengthAdjust="spacingAndGlyphs">2  Skeleton</text>
  <text x="301.5" y="155.0" font-size="13" fill="#14162B" textLength="150.3" lengthAdjust="spacingAndGlyphs">Every statement becomes</text>
  <text x="301.5" y="173.0" font-size="13" fill="#14162B" textLength="164.0" lengthAdjust="spacingAndGlyphs">Lean, with sorry for its proof,</text>
  <text x="301.5" y="191.0" font-size="13" fill="#14162B" textLength="144.5" lengthAdjust="spacingAndGlyphs">in an order in which each</text>
  <text x="301.5" y="209.0" font-size="13" fill="#14162B" textLength="143.8" lengthAdjust="spacingAndGlyphs">comes after what it uses.</text>
  <text x="301.5" y="233.0" font-size="13" fill="#14162B" textLength="129.4" lengthAdjust="spacingAndGlyphs">Lean compiles the file.</text>
  <text x="311.5" y="299.9" font-size="11.5" fill="#14162B" font-family="Menlo, Consolas, monospace" textLength="124.6" lengthAdjust="spacingAndGlyphs">blueprint skeleton</text>
  <text x="549.0" y="119.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="54.5" lengthAdjust="spacingAndGlyphs">3  Status</text>
  <text x="549.0" y="155.0" font-size="13" fill="#14162B" textLength="151.8" lengthAdjust="spacingAndGlyphs">Lean is asked about every</text>
  <text x="549.0" y="173.0" font-size="13" fill="#14162B" textLength="67.2" lengthAdjust="spacingAndGlyphs">declaration.</text>
  <text x="549.0" y="197.0" font-size="13" fill="#14162B" textLength="128.7" lengthAdjust="spacingAndGlyphs">Each node is planned,</text>
  <text x="549.0" y="215.0" font-size="13" fill="#14162B" textLength="159.0" lengthAdjust="spacingAndGlyphs">stated, proved or done, and</text>
  <text x="549.0" y="233.0" font-size="13" fill="#14162B" textLength="146.7" lengthAdjust="spacingAndGlyphs">the picture of the graph is</text>
  <text x="549.0" y="251.0" font-size="13" fill="#14162B" textLength="39.0" lengthAdjust="spacingAndGlyphs">drawn.</text>
  <text x="559.0" y="299.9" font-size="11.5" fill="#14162B" font-family="Menlo, Consolas, monospace" textLength="110.8" lengthAdjust="spacingAndGlyphs">blueprint status</text>
  <text x="796.5" y="119.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="42.0" lengthAdjust="spacingAndGlyphs">4  Next</text>
  <text x="796.5" y="155.0" font-size="13" fill="#14162B" textLength="164.1" lengthAdjust="spacingAndGlyphs">The nodes whose needs are</text>
  <text x="796.5" y="173.0" font-size="13" fill="#14162B" textLength="161.9" lengthAdjust="spacingAndGlyphs">all done can be proved now.</text>
  <text x="796.5" y="197.0" font-size="13" fill="#14162B" textLength="144.5" lengthAdjust="spacingAndGlyphs">The one that most others</text>
  <text x="796.5" y="215.0" font-size="13" fill="#14162B" textLength="112.0" lengthAdjust="spacingAndGlyphs">wait for comes first.</text>
  <text x="806.5" y="299.9" font-size="11.5" fill="#14162B" font-family="Menlo, Consolas, monospace" textLength="96.9" lengthAdjust="spacingAndGlyphs">blueprint next</text>
  <text x="56.0" y="363.0" font-size="13" fill="#14162B" textLength="802.2" lengthAdjust="spacingAndGlyphs">A blueprint is a Markdown file that people read and correct. The model's part is a first draft of it; from the skeleton on, every statement about</text>
  <text x="56.0" y="381.0" font-size="13" fill="#14162B" textLength="158.2" lengthAdjust="spacingAndGlyphs">progress comes from Lean.</text>
</svg>
