<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 428" role="img" aria-labelledby="blueprint-pipeline-t blueprint-pipeline-d" font-family="'Helvetica Neue', Arial, sans-serif">
  <title id="blueprint-pipeline-t">From an argument in words to a tracked formalization</title>
  <desc id="blueprint-pipeline-d">Four steps in a row. Plan: a model takes an argument in words apart into nodes, and the answer is put in order before it is written. Skeleton: every statement is written as Lean with sorry for a proof, and Lean compiles the file. Status: Lean reports each node as planned, stated, proved or done. Next: the nodes that can be proved now are listed, the most useful first.</desc>
  <rect width="1040" height="428" fill="#FAF8F4"/>
  <rect x="40.0" y="96.0" width="217.5" height="224.0" rx="10" fill="#FFFFFF" stroke="#EC6813" stroke-width="1.5"/>
