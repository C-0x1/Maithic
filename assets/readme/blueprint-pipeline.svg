  <path d="M535.0 106.0a10 10 0 0 1 10-10h197.5a10 10 0 0 1 10 10v26.0h-217.5z" fill="#2B2F77"/>
  <rect x="549.0" y="284.0" width="189.5" height="24.0" rx="6" fill="#E8E9F3"/>
