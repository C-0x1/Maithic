<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 704" role="img" aria-labelledby="t d" font-family="'Helvetica Neue', Arial, sans-serif">
  <title id="t">What a candidate statement has to survive</title>
  <desc id="d">One sentence, the square of a negative integer is positive, is drafted as four Lean statements, and each row shows how far one of them got. Candidate 1, for an integer n below zero, 0 is less than n squared, elaborates as drafted, is no duplicate, passes the vacuity check and the search for a counterexample in 300 sampled cases, passes the six softer checks with an agreement of 10 of 10, and is chosen. Candidate 2 takes n from the natural numbers: it elaborates, and Lean proves that its hypothesis cannot hold, so it is rejected as vacuous. Candidate 3 reads negative as at most zero: it elaborates and is not vacuous, and it fails at n equal to 0, which Lean confirms, so it is rejected as refuted. Candidate 4 is written with a symbol for the integers that the core library does not know: Lean's error goes back to the model, the repair elaborates, and the statement turns out to be candidate 1 in other notation, so it is dropped as a duplicate. Below: rejections rest on proofs that Lean accepted, flags are evidence for a reader, and the statement that is chosen is not proved by any of this.</desc>
  <rect width="960" height="704" fill="#FAF8F4"/>
  <text x="40" y="44" font-size="22" fill="#14162B" font-weight="700" textLength="705.9" lengthAdjust="spacingAndGlyphs">A statement has to survive Lean before anyone asks what it means.</text>
  <text x="40" y="68" font-size="14" fill="#5B6477" textLength="739.3" lengthAdjust="spacingAndGlyphs">maithic formalize: four candidates for one sentence, and how far each one got (fixtures/formalize/negative-square.json).</text>
  <rect x="40" y="88" width="880" height="46" rx="8" fill="#14162B"/>
  <text x="58" y="117" font-size="12" fill="#F0A92E" font-weight="700" textLength="47.3" lengthAdjust="spacingAndGlyphs">problem</text>
  <text x="124" y="117" font-size="15" fill="#E8E9F3" textLength="366.1" lengthAdjust="spacingAndGlyphs">“Show that the square of a negative integer is positive.”</text>
  <text x="40" y="184" font-size="12" fill="#5B6477" textLength="177.5" lengthAdjust="spacingAndGlyphs">candidate, as the model drafted it</text>
  <text x="388" y="184" font-size="12" fill="#5B6477" text-anchor="middle" textLength="56.0" lengthAdjust="spacingAndGlyphs">elaborates</text>
  <text x="482" y="184" font-size="12" fill="#5B6477" text-anchor="middle" textLength="78.1" lengthAdjust="spacingAndGlyphs">not a duplicate</text>
  <text x="576" y="184" font-size="12" fill="#5B6477" text-anchor="middle" textLength="64.7" lengthAdjust="spacingAndGlyphs">not vacuous</text>
  <text x="680" y="184" font-size="12" fill="#5B6477" text-anchor="middle" textLength="102.1" lengthAdjust="spacingAndGlyphs">no counterexample</text>
  <text x="796" y="184" font-size="12" fill="#5B6477" text-anchor="middle" textLength="88.7" lengthAdjust="spacingAndGlyphs">six softer checks</text>
  <text x="534" y="162" font-size="10.5" fill="#2B2F77" font-weight="700" text-anchor="middle" textLength="78.2" lengthAdjust="spacingAndGlyphs">LEAN DECIDES</text>
  <path d="M350 158 H484 M584 158 H734" stroke="#2B2F77" stroke-width="1.2" fill="none"/>
  <path d="M350 158 V164 M734 158 V164" stroke="#2B2F77" stroke-width="1.2" fill="none"/>
  <text x="796" y="162" font-size="10.5" fill="#B37400" font-weight="700" text-anchor="middle" textLength="53.7" lengthAdjust="spacingAndGlyphs">EVIDENCE</text>
  <path d="M748 158 H764 M828 158 H844" stroke="#B37400" stroke-width="1.2" fill="none"/>
  <path d="M748 158 V164 M844 158 V164" stroke="#B37400" stroke-width="1.2" fill="none"/>
  <rect x="40" y="198" width="880" height="88" rx="10" fill="#FFFFFF" stroke="#0FA89B" stroke-width="1.5"/>
  <circle cx="62" cy="224" r="12" fill="#14162B"/>
  <text x="62" y="228.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle" textLength="7.2" lengthAdjust="spacingAndGlyphs">1</text>
  <text x="84" y="229" font-size="12.5" fill="#14162B" font-family="Menlo, Consolas, monospace" textLength="226.9" lengthAdjust="spacingAndGlyphs">(n : Int) (h : n &lt; 0) : 0 &lt; n ^ 2</text>
  <circle cx="388" cy="224" r="11" fill="#0FA89B"/>
  <path d="M383 224 l3.5 4 l6.5 -8" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="388" y="251" font-size="11" fill="#5B6477" text-anchor="middle" textLength="48.9" lengthAdjust="spacingAndGlyphs">as drafted</text>
  <circle cx="482" cy="224" r="11" fill="#0FA89B"/>
  <path d="M477 224 l3.5 4 l6.5 -8" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="576" cy="224" r="11" fill="#0FA89B"/>
  <path d="M571 224 l3.5 4 l6.5 -8" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="680" cy="224" r="11" fill="#0FA89B"/>
  <path d="M675 224 l3.5 4 l6.5 -8" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="680" y="251" font-size="11" fill="#5B6477" text-anchor="middle" textLength="50.1" lengthAdjust="spacingAndGlyphs">300 cases</text>
  <circle cx="796" cy="224" r="11" fill="#0FA89B"/>
  <path d="M791 224 l3.5 4 l6.5 -8" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="796" y="251" font-size="11" fill="#5B6477" text-anchor="middle" textLength="95.4" lengthAdjust="spacingAndGlyphs">agreement 10 of 10</text>
  <text x="906" y="229" font-size="14" fill="#0B7F75" font-weight="700" text-anchor="end" textLength="49.0" lengthAdjust="spacingAndGlyphs">chosen</text>
  <text x="84" y="272" font-size="11.5" fill="#5B6477" font-style="italic" textLength="297.9" lengthAdjust="spacingAndGlyphs">reading: an integer below zero; positive means above zero</text>
  <text x="906" y="272" font-size="11.5" fill="#14162B" text-anchor="end" textLength="114.4" lengthAdjust="spacingAndGlyphs">It passed every check.</text>
  <rect x="40" y="296" width="880" height="88" rx="10" fill="#FFFFFF" stroke="#E5484D" stroke-width="1.5"/>
  <circle cx="62" cy="322" r="12" fill="#14162B"/>
  <text x="62" y="326.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle" textLength="7.2" lengthAdjust="spacingAndGlyphs">2</text>
  <text x="84" y="327" font-size="12.5" fill="#14162B" font-family="Menlo, Consolas, monospace" textLength="226.9" lengthAdjust="spacingAndGlyphs">(n : Nat) (h : n &lt; 0) : 0 &lt; n ^ 2</text>
  <circle cx="388" cy="322" r="11" fill="#0FA89B"/>
  <path d="M383 322 l3.5 4 l6.5 -8" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="388" y="349" font-size="11" fill="#5B6477" text-anchor="middle" textLength="48.9" lengthAdjust="spacingAndGlyphs">as drafted</text>
  <circle cx="482" cy="322" r="11" fill="#0FA89B"/>
  <path d="M477 322 l3.5 4 l6.5 -8" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="576" cy="322" r="11" fill="#E5484D"/>
  <path d="M571.5 317.5 l9 9 M580.5 317.5 l-9 9" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <text x="576" y="349" font-size="11" fill="#E5484D" text-anchor="middle" textLength="66.1" lengthAdjust="spacingAndGlyphs">h cannot hold</text>
  <circle cx="680" cy="322" r="10" fill="none" stroke="#C9CCE8" stroke-width="1.6" stroke-dasharray="3 3"/>
  <circle cx="796" cy="322" r="10" fill="none" stroke="#C9CCE8" stroke-width="1.6" stroke-dasharray="3 3"/>
  <text x="906" y="327" font-size="14" fill="#E5484D" font-weight="700" text-anchor="end" textLength="53.7" lengthAdjust="spacingAndGlyphs">rejected</text>
  <text x="84" y="370" font-size="11.5" fill="#5B6477" font-style="italic" textLength="204.6" lengthAdjust="spacingAndGlyphs">reading: the number is a natural number</text>
  <text x="906" y="370" font-size="11.5" fill="#14162B" text-anchor="end" textLength="217.1" lengthAdjust="spacingAndGlyphs">Vacuous: no natural number is below zero.</text>
  <rect x="40" y="394" width="880" height="88" rx="10" fill="#FFFFFF" stroke="#E5484D" stroke-width="1.5"/>
  <circle cx="62" cy="420" r="12" fill="#14162B"/>
  <text x="62" y="424.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle" textLength="7.2" lengthAdjust="spacingAndGlyphs">3</text>
  <text x="84" y="425" font-size="12.5" fill="#14162B" font-family="Menlo, Consolas, monospace" textLength="226.9" lengthAdjust="spacingAndGlyphs">(n : Int) (h : n ≤ 0) : 0 &lt; n ^ 2</text>
  <circle cx="388" cy="420" r="11" fill="#0FA89B"/>
  <path d="M383 420 l3.5 4 l6.5 -8" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="388" y="447" font-size="11" fill="#5B6477" text-anchor="middle" textLength="48.9" lengthAdjust="spacingAndGlyphs">as drafted</text>
  <circle cx="482" cy="420" r="11" fill="#0FA89B"/>
  <path d="M477 420 l3.5 4 l6.5 -8" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="576" cy="420" r="11" fill="#0FA89B"/>
  <path d="M571 420 l3.5 4 l6.5 -8" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="680" cy="420" r="11" fill="#E5484D"/>
  <path d="M675.5 415.5 l9 9 M684.5 415.5 l-9 9" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <text x="680" y="447" font-size="11" fill="#E5484D" text-anchor="middle" textLength="59.6" lengthAdjust="spacingAndGlyphs">fails at n = 0</text>
  <circle cx="796" cy="420" r="10" fill="none" stroke="#C9CCE8" stroke-width="1.6" stroke-dasharray="3 3"/>
  <text x="906" y="425" font-size="14" fill="#E5484D" font-weight="700" text-anchor="end" textLength="53.7" lengthAdjust="spacingAndGlyphs">rejected</text>
  <text x="84" y="468" font-size="11.5" fill="#5B6477" font-style="italic" textLength="285.1" lengthAdjust="spacingAndGlyphs">reading: negative means not positive, so zero is allowed</text>
  <text x="906" y="468" font-size="11.5" fill="#14162B" text-anchor="end" textLength="149.6" lengthAdjust="spacingAndGlyphs">Refuted: zero is not negative.</text>
  <rect x="40" y="492" width="880" height="88" rx="10" fill="#FFFFFF" stroke="#5B6477" stroke-width="1.5"/>
  <circle cx="62" cy="518" r="12" fill="#14162B"/>
  <text x="62" y="522.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle" textLength="7.2" lengthAdjust="spacingAndGlyphs">4</text>
  <text x="84" y="523" font-size="12.5" fill="#14162B" font-family="Menlo, Consolas, monospace" textLength="213.1" lengthAdjust="spacingAndGlyphs">(n : ℤ) (h : n &lt; 0) : n ^ 2 &gt; 0</text>
  <circle cx="388" cy="518" r="11" fill="#F0A92E"/>
  <path d="M388 512 v7" stroke="#14162B" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <circle cx="388" cy="523.5" r="1.4" fill="#14162B"/>
  <text x="388" y="545" font-size="11" fill="#5B6477" text-anchor="middle" textLength="62.4" lengthAdjust="spacingAndGlyphs">after 1 repair</text>
  <circle cx="482" cy="518" r="11" fill="#E5484D"/>
  <path d="M477.5 513.5 l9 9 M486.5 513.5 l-9 9" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <text x="482" y="545" font-size="11" fill="#E5484D" text-anchor="middle" textLength="50.7" lengthAdjust="spacingAndGlyphs">same as 1</text>
  <circle cx="576" cy="518" r="10" fill="none" stroke="#C9CCE8" stroke-width="1.6" stroke-dasharray="3 3"/>
  <circle cx="680" cy="518" r="10" fill="none" stroke="#C9CCE8" stroke-width="1.6" stroke-dasharray="3 3"/>
  <circle cx="796" cy="518" r="10" fill="none" stroke="#C9CCE8" stroke-width="1.6" stroke-dasharray="3 3"/>
  <text x="906" y="523" font-size="14" fill="#5B6477" font-weight="700" text-anchor="end" textLength="61.5" lengthAdjust="spacingAndGlyphs">duplicate</text>
  <text x="84" y="566" font-size="11.5" fill="#5B6477" textLength="407.3" lengthAdjust="spacingAndGlyphs">Lean: Unknown identifier `ℤ`. The error went back to the model, which wrote Int.</text>
  <text x="906" y="566" font-size="11.5" fill="#14162B" text-anchor="end" textLength="150.9" lengthAdjust="spacingAndGlyphs">Candidate 1 in other notation.</text>
  <rect x="40" y="594" width="280" height="92" rx="8" fill="#FFFFFF" stroke="#2B2F77" stroke-width="1.5"/>
  <text x="54" y="618" font-size="13" fill="#14162B" font-weight="700" textLength="172.2" lengthAdjust="spacingAndGlyphs">A rejection rests on a proof.</text>
  <text x="54" y="638" font-size="12" fill="#5B6477" textLength="213.5" lengthAdjust="spacingAndGlyphs">Lean derived False from the hypothesis,</text>
  <text x="54" y="654" font-size="12" fill="#5B6477" textLength="202.8" lengthAdjust="spacingAndGlyphs">or accepted a proof that the statement</text>
  <text x="54" y="670" font-size="12" fill="#5B6477" textLength="145.4" lengthAdjust="spacingAndGlyphs">is false at the values found.</text>
  <rect x="340" y="594" width="280" height="92" rx="8" fill="#FFFFFF" stroke="#F0A92E" stroke-width="1.5"/>
  <text x="354" y="618" font-size="13" fill="#14162B" font-weight="700" textLength="187.4" lengthAdjust="spacingAndGlyphs">A flag is evidence for a reader.</text>
  <text x="354" y="638" font-size="12" fill="#5B6477" textLength="217.4" lengthAdjust="spacingAndGlyphs">Missing numbers, misleading operations,</text>
  <text x="354" y="654" font-size="12" fill="#5B6477" textLength="209.5" lengthAdjust="spacingAndGlyphs">a back-translation that disagrees: these</text>
  <text x="354" y="670" font-size="12" fill="#5B6477" textLength="224.1" lengthAdjust="spacingAndGlyphs">lower a score and are shown in the report.</text>
  <rect x="640" y="594" width="280" height="92" rx="8" fill="#FFFFFF" stroke="#0FA89B" stroke-width="1.5"/>
  <text x="654" y="618" font-size="13" fill="#14162B" font-weight="700" textLength="218.2" lengthAdjust="spacingAndGlyphs">Nothing here proves the statement.</text>
  <text x="654" y="638" font-size="12" fill="#5B6477" textLength="192.8" lengthAdjust="spacingAndGlyphs">The chosen statement is written to a</text>
  <text x="654" y="654" font-size="12" fill="#5B6477" textLength="184.8" lengthAdjust="spacingAndGlyphs">Lean file with sorry for a proof, and</text>
  <text x="654" y="670" font-size="12" fill="#5B6477" textLength="174.1" lengthAdjust="spacingAndGlyphs">maithic prove takes it from there.</text>
</svg>
