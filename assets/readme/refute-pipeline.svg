<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" role="img" aria-labelledby="t d" font-family="'Helvetica Neue', Arial, sans-serif">
  <title id="t">From a counterexample to a refutation</title>
  <desc id="d">The statement square_monotone, for integers x and y with x at most y, x times x is at most y times y, is examined by three methods. Tests on sampled values in Lean find the candidate x equal to minus 1, y equal to 0. A solver in Julia takes arithmetic statements and answers a false one with an exact point, as x equal to 3, y equal to 0 for the statement within_budget. The vacuity checks in Lean look for hypotheses that contradict each other, as the two hypotheses of small_and_large do, shown by omega. A candidate is believed by nobody: its values are put into the statement, and Lean's kernel is asked to accept a proof that the statement is false there. Four verdicts follow. Refuted, when Lean accepted the proof, with exit status 8. Vacuous, when Lean proved the hypotheses contradictory, with exit status 7. Unconfirmed, when a candidate was found that Lean did not confirm, with exit status 7. Standing, when nothing was found, which proves nothing, with exit status 0.</desc>
  <rect width="960" height="590" fill="#FAF8F4"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#14162B" textLength="632.5" lengthAdjust="spacingAndGlyphs">A counterexample is a claim. Lean decides whether it is one.</text>
  <text x="40" y="68" font-size="14" fill="#5B6477" textLength="667.7" lengthAdjust="spacingAndGlyphs">maithic refute tries three methods on a statement; what they find counts only after the kernel has checked it.</text>
  <text x="920" y="152" font-size="12" fill="#5B6477" text-anchor="end" textLength="224.8" lengthAdjust="spacingAndGlyphs">findings below: examples/conjectures.lean</text>

  <!-- the statement -->
  <rect x="40" y="88" width="880" height="46" rx="8" fill="#14162B"/>
  <text x="58" y="117" font-size="14" fill="#E8E9F3" font-family="Menlo, Consolas, monospace" textLength="577.5" lengthAdjust="spacingAndGlyphs">theorem square_monotone (x y : Int) (h : x ≤ y) : x * x ≤ y * y := by sorry</text>

  <!-- three methods -->
  <g font-size="13">
    <g transform="translate(40 160)">
      <rect width="280" height="150" rx="10" fill="#FFFFFF" stroke="#2B2F77" stroke-width="1.5"/>
      <path d="M0 10a10 10 0 0 1 10-10h260a10 10 0 0 1 10 10v28h-280z" fill="#2B2F77"/>
      <text x="16" y="25" font-size="14" font-weight="700" fill="#FFFFFF" textLength="24.9" lengthAdjust="spacingAndGlyphs">test</text>
      <text x="264" y="25" font-size="12" fill="#C9CCE8" text-anchor="end" textLength="26.7" lengthAdjust="spacingAndGlyphs">Lean</text>
      <text x="16" y="62" fill="#14162B" textLength="190.0" lengthAdjust="spacingAndGlyphs">Sampled values, small ones first,</text>
      <text x="16" y="80" fill="#14162B" textLength="200.2" lengthAdjust="spacingAndGlyphs">round after round with a new seed.</text>
      <text x="16" y="98" fill="#5B6477" textLength="174.1" lengthAdjust="spacingAndGlyphs">A failing case is made smaller.</text>
      <rect x="16" y="110" width="248" height="28" rx="6" fill="#E8E9F3"/>
      <text x="28" y="129" font-size="11.5" fill="#14162B" font-family="Menlo, Consolas, monospace" textLength="202.4" lengthAdjust="spacingAndGlyphs">square_monotone: x := -1, y := 0</text>
    </g>
    <g transform="translate(340 160)">
      <rect width="280" height="150" rx="10" fill="#FFFFFF" stroke="#9558B2" stroke-width="1.5"/>
      <path d="M0 10a10 10 0 0 1 10-10h260a10 10 0 0 1 10 10v28h-280z" fill="#9558B2"/>
      <text x="16" y="25" font-size="14" font-weight="700" fill="#FFFFFF" textLength="41.2" lengthAdjust="spacingAndGlyphs">oracle</text>
      <text x="264" y="25" font-size="12" fill="#EBDDF3" text-anchor="end" textLength="24.7" lengthAdjust="spacingAndGlyphs">Julia</text>
      <text x="16" y="62" fill="#14162B" textLength="182.8" lengthAdjust="spacingAndGlyphs">An arithmetic statement goes to</text>
      <text x="16" y="80" fill="#14162B" textLength="188.6" lengthAdjust="spacingAndGlyphs">a solver. A false one comes back</text>
      <text x="16" y="98" fill="#5B6477" textLength="187.2" lengthAdjust="spacingAndGlyphs">with an exact point where it fails.</text>
      <rect x="16" y="110" width="248" height="28" rx="6" fill="#E8E9F3"/>
      <text x="28" y="129" font-size="11.5" fill="#14162B" font-family="Menlo, Consolas, monospace" textLength="183.4" lengthAdjust="spacingAndGlyphs">within_budget: x := 3, y := 0</text>
    </g>
    <g transform="translate(640 160)">
      <rect width="280" height="150" rx="10" fill="#FFFFFF" stroke="#0FA89B" stroke-width="1.5"/>
      <path d="M0 10a10 10 0 0 1 10-10h260a10 10 0 0 1 10 10v28h-280z" fill="#0FA89B"/>
      <text x="16" y="25" font-size="14" font-weight="700" fill="#FFFFFF" textLength="48.2" lengthAdjust="spacingAndGlyphs">vacuity</text>
      <text x="264" y="25" font-size="12" fill="#D5F3F0" text-anchor="end" textLength="26.7" lengthAdjust="spacingAndGlyphs">Lean</text>
      <text x="16" y="62" fill="#14162B" textLength="168.4" lengthAdjust="spacingAndGlyphs">Do the hypotheses contradict</text>
      <text x="16" y="80" fill="#14162B" textLength="162.6" lengthAdjust="spacingAndGlyphs">each other? Does a variable</text>
      <text x="16" y="98" fill="#5B6477" textLength="115.6" lengthAdjust="spacingAndGlyphs">range over nothing?</text>
      <rect x="16" y="110" width="248" height="28" rx="6" fill="#E8E9F3"/>
      <text x="28" y="129" font-size="11.5" fill="#14162B" font-family="Menlo, Consolas, monospace" textLength="196.1" lengthAdjust="spacingAndGlyphs">small_and_large: h₁, h₂ (omega)</text>
    </g>
  </g>

  <!-- arrows from candidates to the kernel -->
  <g stroke="#5B6477" stroke-width="1.6" fill="none">
    <path d="M180 310 V338 H330"/>
    <path d="M480 310 V338 H330 V352"/>
  </g>
  <path d="M324 350 l6 10 l6 -10 z" fill="#5B6477"/>
  <text x="196" y="332" font-size="12" fill="#5B6477" textLength="52.0" lengthAdjust="spacingAndGlyphs">candidate</text>
  <text x="496" y="332" font-size="12" fill="#5B6477" textLength="52.0" lengthAdjust="spacingAndGlyphs">candidate</text>

  <!-- the kernel check -->
  <rect x="40" y="362" width="580" height="132" rx="10" fill="#14162B"/>
  <text x="58" y="387" font-size="13" font-weight="700" fill="#F0A92E" textLength="382.4" lengthAdjust="spacingAndGlyphs">Lean's kernel is asked: is the statement false at these values?</text>
  <g font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#E8E9F3">
    <text x="58" y="411" textLength="371.3" lengthAdjust="spacingAndGlyphs">theorem refutation : ¬ type_of% @square_monotone := by</text>
    <text x="58" y="429" xml:space="preserve" textLength="61.9" lengthAdjust="spacingAndGlyphs">  intro h</text>
    <text x="58" y="447" xml:space="preserve" textLength="247.5" lengthAdjust="spacingAndGlyphs">  have h' := h (x := -1) (y := 0)   </text>
    <text x="58" y="465" xml:space="preserve" textLength="75.6" lengthAdjust="spacingAndGlyphs">  revert h'</text>
    <text x="58" y="483" xml:space="preserve" textLength="55.0" lengthAdjust="spacingAndGlyphs">  decide</text>
  </g>
  <text x="338" y="447" font-size="12" fill="#8A90A6" textLength="161.4" lengthAdjust="spacingAndGlyphs">the values, hypotheses and all</text>
  <text x="140" y="483" font-size="12" fill="#8A90A6" textLength="251.5" lengthAdjust="spacingAndGlyphs">or omega, grind, simp: whichever Lean accepts</text>

  <!-- vacuity goes straight to its verdict -->
  <path d="M780 310 V362" stroke="#5B6477" stroke-width="1.6" fill="none"/>
  <path d="M774 360 l6 10 l6 -10 z" fill="#5B6477"/>
  <rect x="640" y="372" width="280" height="122" rx="10" fill="#FFFFFF" stroke="#0FA89B" stroke-width="1.5"/>
  <text x="656" y="398" font-size="13" font-weight="700" fill="#14162B" textLength="182.3" lengthAdjust="spacingAndGlyphs">A finding of vacuity is a proof</text>
  <text x="656" y="420" font-size="13" fill="#5B6477" textLength="161.9" lengthAdjust="spacingAndGlyphs">Lean derived False from the</text>
  <text x="656" y="438" font-size="13" fill="#5B6477" textLength="164.1" lengthAdjust="spacingAndGlyphs">hypotheses, by omega here.</text>
  <text x="656" y="462" font-size="13" fill="#5B6477" textLength="161.1" lengthAdjust="spacingAndGlyphs">The statement is true, and it</text>
  <text x="656" y="480" font-size="13" fill="#5B6477" textLength="165.5" lengthAdjust="spacingAndGlyphs">says nothing about anything.</text>

  <!-- verdicts -->
  <g font-size="13">
    <g transform="translate(40 514)">
      <rect width="212" height="56" rx="8" fill="#FFFFFF" stroke="#E5484D" stroke-width="1.5"/>
      <text x="14" y="23" font-weight="700" fill="#E5484D" textLength="44.1" lengthAdjust="spacingAndGlyphs">refuted</text>
      <text x="198" y="23" fill="#5B6477" text-anchor="end" textLength="31.1" lengthAdjust="spacingAndGlyphs">exit 8</text>
      <text x="14" y="43" fill="#14162B" textLength="143.8" lengthAdjust="spacingAndGlyphs">Lean accepted the proof.</text>
    </g>
    <g transform="translate(262 514)">
      <rect width="212" height="56" rx="8" fill="#FFFFFF" stroke="#F0A92E" stroke-width="1.5"/>
      <text x="14" y="23" font-weight="700" fill="#B37400" textLength="52.7" lengthAdjust="spacingAndGlyphs">vacuous</text>
      <text x="198" y="23" fill="#5B6477" text-anchor="end" textLength="31.1" lengthAdjust="spacingAndGlyphs">exit 7</text>
      <text x="14" y="43" fill="#14162B" textLength="96.8" lengthAdjust="spacingAndGlyphs">True, and empty.</text>
    </g>
    <g transform="translate(484 514)">
      <rect width="212" height="56" rx="8" fill="#FFFFFF" stroke="#F0A92E" stroke-width="1.5"/>
      <text x="14" y="23" font-weight="700" fill="#B37400" textLength="78.7" lengthAdjust="spacingAndGlyphs">unconfirmed</text>
      <text x="198" y="23" fill="#5B6477" text-anchor="end" textLength="31.1" lengthAdjust="spacingAndGlyphs">exit 7</text>
      <text x="14" y="43" fill="#14162B" textLength="193.0" lengthAdjust="spacingAndGlyphs">A candidate Lean did not confirm.</text>
    </g>
    <g transform="translate(706 514)">
      <rect width="214" height="56" rx="8" fill="#FFFFFF" stroke="#0FA89B" stroke-width="1.5"/>
      <text x="14" y="23" font-weight="700" fill="#0B7F75" textLength="54.2" lengthAdjust="spacingAndGlyphs">standing</text>
      <text x="200" y="23" fill="#5B6477" text-anchor="end" textLength="31.1" lengthAdjust="spacingAndGlyphs">exit 0</text>
      <text x="14" y="43" fill="#14162B" textLength="156.1" lengthAdjust="spacingAndGlyphs">Nothing found. Not a proof.</text>
    </g>
  </g>
</svg>
