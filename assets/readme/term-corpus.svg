<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 984 204" width="984" height="204" role="img" aria-label="A terminal session: maithic corpus harvest traces the Lean files of a library into theorem, step, premise and pair records, and corpus verify confirms the dataset against its manifest.">
  <title>A terminal session: maithic corpus harvest traces the Lean files of a library into theorem, step, premise and pair records, and corpus verify confirms the dataset against its manifest.</title>
  <rect width="984" height="204" rx="10" fill="#14162B"/>
  <path d="M0 10a10 10 0 0 1 10-10h964a10 10 0 0 1 10 10v26h-984z" fill="#1E2142"/>
  <circle cx="22" cy="18" r="5.5" fill="#F26D72"/>
  <circle cx="40" cy="18" r="5.5" fill="#F0A92E"/>
  <circle cx="58" cy="18" r="5.5" fill="#57C98F"/>
  <text x="492" y="23" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8A90A6">maithic corpus harvest, verify</text>
  <g font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13">
    <text x="22.00" y="58" textLength="7.83" lengthAdjust="spacingAndGlyphs" fill="#2CC4B6" font-weight="bold">$</text>
    <text x="37.66" y="58" textLength="751.68" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3" font-weight="bold">maithic corpus harvest lean/Maithic/Algo --project lean --out .maithic/dataset --revision v0.1.0</text>
    <text x="22.00" y="77" textLength="313.20" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">harvested 23 file(s) at revision v0.1.0:</text>
    <text x="37.66" y="96" textLength="673.38" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">180 theorem record(s), 1098 step record(s), 6731 premise record(s), 755 pair record(s)</text>
    <text x="22.00" y="115" textLength="407.16" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">wrote .maithic/dataset/manifest.json with 5 shard(s)</text>
    <text x="22.00" y="153" textLength="7.83" lengthAdjust="spacingAndGlyphs" fill="#2CC4B6" font-weight="bold">$</text>
    <text x="37.66" y="153" textLength="297.54" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3" font-weight="bold">maithic corpus verify .maithic/dataset</text>
    <text x="22.00" y="172" textLength="939.60" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">dataset 1 is sound: 180 theorem record(s), 1098 step record(s), 6731 premise record(s), 755 pair record(s) in 5 shard(s)</text>
  </g>
</svg>
