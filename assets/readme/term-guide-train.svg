  <text x="468" y="23" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8A90A6">maithic corpus harvest, guide train, guide rank</text>
  <g font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13">
    <text x="22.00" y="58" textLength="7.83" lengthAdjust="spacingAndGlyphs" fill="#2CC4B6" font-weight="bold">$</text>
    <text x="37.66" y="58" textLength="822.15" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3" font-weight="bold">maithic corpus harvest lean/Maithic/Algo --project lean --out .maithic/shots/guide-data --revision v0.1.0</text>
