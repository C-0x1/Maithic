    <text x="37.66" y="96" textLength="673.38" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">180 theorem record(s), 1098 step record(s), 6731 premise record(s), 755 pair record(s)</text>
    <text x="22.00" y="115" textLength="477.63" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">wrote .maithic/shots/guide-data/manifest.json with 5 shard(s)</text>
    <text x="22.00" y="153" textLength="7.83" lengthAdjust="spacingAndGlyphs" fill="#2CC4B6" font-weight="bold">$</text>
    <text x="37.66" y="153" textLength="634.23" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3" font-weight="bold">maithic guide train .maithic/shots/guide-data .maithic/shots/guide-model --seed 1</text>
    <text x="22.00" y="172" textLength="853.47" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">trained mean-32 on guide-data: 484 training, 82 validation and 187 test examples, 32 templates, 15552 weights</text>
    <text x="22.00" y="191" textLength="493.29" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">best epoch 13 of 30; on the test part: top-1 34.2%, top-5 65.8%</text>
    <text x="37.66" y="210" textLength="555.93" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">always answering with the most frequent templates gives 18.7% and 47.1%</text>
    <text x="22.00" y="229" textLength="649.89" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">wrote .maithic/shots/guide-model/model.json and .maithic/shots/guide-model/run.json</text>
    <text x="22.00" y="267" textLength="7.83" lengthAdjust="spacingAndGlyphs" fill="#2CC4B6" font-weight="bold">$</text>
    <text x="37.66" y="267" textLength="876.96" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3" font-weight="bold">maithic guide rank .maithic/shots/guide-model/model.json --file examples/double.lean --theorem double_eq --top 4</text>
