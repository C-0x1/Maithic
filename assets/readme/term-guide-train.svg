<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 937 546" width="937" height="546" role="img" aria-label="A terminal session: from proofs to a tactic model in three commands. maithic corpus harvest traces the algorithm library into pairs of a goal and the tactic used on it. maithic guide train trains a small model on them and reports its accuracy on proofs it has not seen, beside a baseline that always answers with the most frequent tactics. maithic guide rank asks the new model about the goal double n = 2 * n, and it puts simp [double] first.">
  <title>A terminal session: from proofs to a tactic model in three commands. maithic corpus harvest traces the algorithm library into pairs of a goal and the tactic used on it. maithic guide train trains a small model on them and reports its accuracy on proofs it has not seen, beside a baseline that always answers with the most frequent tactics. maithic guide rank asks the new model about the goal double n = 2 * n, and it puts simp [double] first.</title>
  <rect width="937" height="546" rx="10" fill="#14162B"/>
  <path d="M0 10a10 10 0 0 1 10-10h917a10 10 0 0 1 10 10v26h-937z" fill="#1E2142"/>
