<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 700" role="img" aria-labelledby="command-families-t command-families-d" font-family="'Helvetica Neue', Arial, sans-serif">
  <title id="command-families-t">Every command, by what it is for</title>
  <desc id="command-families-d">Seven bands of commands. Prove and check: prove, tree, check. State and test: formalize, refute, council. Plan, find and read: blueprint with six subcommands, search, and intel with seven. Repair and review: mend scan, repair and minimize, and review. Compute with certificates: oracle list and solve, nnv verify, algo synth and differential. Data and measurement: corpus harvest and verify, guide info, rank and train, bench run and gate. Setup: doctor, config, auth, models, bridge selftest, help and version.</desc>
