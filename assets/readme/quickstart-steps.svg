<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 416" role="img" aria-labelledby="quickstart-steps-t quickstart-steps-d" font-family="'Helvetica Neue', Arial, sans-serif">
  <title id="quickstart-steps-t">From a clone to a verified theorem in four steps</title>
  <desc id="quickstart-steps-d">Four steps in a row. Build: make build-ocaml build-lean builds the command and the Bridge. Check the installation: maithic doctor lists each component and runs the self-test of the Bridge. Prove: maithic prove examples/even.lean proves that the sum of two even numbers is even, by omega, with no key. Keep it: the option write puts the proof into the file, and maithic check re-checks the file from its imports in a new process.</desc>
  <rect width="1120" height="416" fill="#FAF8F4"/>
  <rect x="40.0" y="96.0" width="237.5" height="212.0" rx="10" fill="#FFFFFF" stroke="#5B6477" stroke-width="1.5"/>
  <rect x="307.5" y="96.0" width="237.5" height="212.0" rx="10" fill="#FFFFFF" stroke="#5B6477" stroke-width="1.5"/>
  <rect x="575.0" y="96.0" width="237.5" height="212.0" rx="10" fill="#FFFFFF" stroke="#2B2F77" stroke-width="1.5"/>
  <rect x="842.5" y="96.0" width="237.5" height="212.0" rx="10" fill="#FFFFFF" stroke="#0B7F75" stroke-width="1.5"/>
  <rect x="40.0" y="326.0" width="1040.0" height="60.0" rx="10" fill="#E8E9F3"/>
  <path d="M40.0 106.0a10 10 0 0 1 10-10h217.5a10 10 0 0 1 10 10v26.0h-237.5z" fill="#5B6477"/>
  <rect x="54.0" y="272.0" width="209.5" height="24.0" rx="6" fill="#E8E9F3"/>
  <path d="M281.5 202.0 L295.5 202.0" stroke="#5B6477" stroke-width="1.6" fill="none"/>
  <path d="M293.5 196.0 l10 6 l-10 6 z" fill="#5B6477"/>
  <path d="M307.5 106.0a10 10 0 0 1 10-10h217.5a10 10 0 0 1 10 10v26.0h-237.5z" fill="#5B6477"/>
  <rect x="321.5" y="272.0" width="209.5" height="24.0" rx="6" fill="#E8E9F3"/>
  <path d="M549.0 202.0 L563.0 202.0" stroke="#5B6477" stroke-width="1.6" fill="none"/>
  <path d="M561.0 196.0 l10 6 l-10 6 z" fill="#5B6477"/>
  <path d="M575.0 106.0a10 10 0 0 1 10-10h217.5a10 10 0 0 1 10 10v26.0h-237.5z" fill="#2B2F77"/>
  <rect x="589.0" y="272.0" width="209.5" height="24.0" rx="6" fill="#E8E9F3"/>
  <path d="M816.5 202.0 L830.5 202.0" stroke="#5B6477" stroke-width="1.6" fill="none"/>
  <path d="M828.5 196.0 l10 6 l-10 6 z" fill="#5B6477"/>
  <path d="M842.5 106.0a10 10 0 0 1 10-10h217.5a10 10 0 0 1 10 10v26.0h-237.5z" fill="#0B7F75"/>
  <rect x="856.5" y="272.0" width="209.5" height="24.0" rx="6" fill="#E8E9F3"/>
  <text x="40.0" y="44.0" font-size="22" fill="#14162B" font-weight="700" textLength="359.4" lengthAdjust="spacingAndGlyphs">From a clone to a verified theorem</text>
  <text x="40.0" y="69.0" font-size="14" fill="#5B6477" textLength="307.2" lengthAdjust="spacingAndGlyphs">No key, no network: OCaml and Lean are enough</text>
  <text x="54.0" y="119.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="46.7" lengthAdjust="spacingAndGlyphs">1  Build</text>
  <text x="54.0" y="155.0" font-size="13" fill="#14162B" textLength="130.1" lengthAdjust="spacingAndGlyphs">The command and the</text>
  <text x="54.0" y="173.0" font-size="13" fill="#14162B" textLength="146.7" lengthAdjust="spacingAndGlyphs">developer tool, in OCaml.</text>
  <text x="54.0" y="197.0" font-size="13" fill="#14162B" textLength="177.0" lengthAdjust="spacingAndGlyphs">The Bridge and the libraries, in</text>
  <text x="54.0" y="215.0" font-size="13" fill="#14162B" textLength="32.5" lengthAdjust="spacingAndGlyphs">Lean.</text>
  <text x="64.0" y="287.9" font-size="11.5" fill="#14162B" font-family="Menlo, Consolas, monospace" textLength="186.9" lengthAdjust="spacingAndGlyphs">make build-ocaml build-lean</text>
  <text x="321.5" y="119.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="45.1" lengthAdjust="spacingAndGlyphs">2  Look</text>
  <text x="321.5" y="155.0" font-size="13" fill="#14162B" textLength="144.5" lengthAdjust="spacingAndGlyphs">Every component with its</text>
  <text x="321.5" y="173.0" font-size="13" fill="#14162B" textLength="45.5" lengthAdjust="spacingAndGlyphs">version.</text>
  <text x="321.5" y="197.0" font-size="13" fill="#14162B" textLength="174.2" lengthAdjust="spacingAndGlyphs">The Bridge is started and runs</text>
  <text x="321.5" y="215.0" font-size="13" fill="#14162B" textLength="65.7" lengthAdjust="spacingAndGlyphs">its self-test.</text>
  <text x="321.5" y="239.0" font-size="13" fill="#14162B" textLength="177.7" lengthAdjust="spacingAndGlyphs">Anything missing comes with a</text>
  <text x="321.5" y="257.0" font-size="13" fill="#14162B" textLength="46.0" lengthAdjust="spacingAndGlyphs">remedy.</text>
  <text x="331.5" y="287.9" font-size="11.5" fill="#14162B" font-family="Menlo, Consolas, monospace" textLength="96.9" lengthAdjust="spacingAndGlyphs">maithic doctor</text>
  <text x="589.0" y="119.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="50.6" lengthAdjust="spacingAndGlyphs">3  Prove</text>
  <text x="589.0" y="155.0" font-size="13" fill="#14162B" textLength="174.9" lengthAdjust="spacingAndGlyphs">The sum of two even numbers</text>
  <text x="589.0" y="173.0" font-size="13" fill="#14162B" textLength="149.6" lengthAdjust="spacingAndGlyphs">is even: the file leaves the</text>
  <text x="589.0" y="191.0" font-size="13" fill="#14162B" textLength="82.1" lengthAdjust="spacingAndGlyphs">proof as sorry.</text>
  <text x="589.0" y="215.0" font-size="13" fill="#14162B" textLength="146.0" lengthAdjust="spacingAndGlyphs">Three candidates fail, the</text>
  <text x="589.0" y="233.0" font-size="13" fill="#14162B" textLength="157.5" lengthAdjust="spacingAndGlyphs">fourth is by omega, and the</text>
  <text x="589.0" y="251.0" font-size="13" fill="#14162B" textLength="97.5" lengthAdjust="spacingAndGlyphs">kernel accepts it.</text>
  <text x="599.0" y="287.9" font-size="11.5" fill="#14162B" font-family="Menlo, Consolas, monospace" textLength="166.2" lengthAdjust="spacingAndGlyphs">prove examples/even.lean</text>
  <text x="856.5" y="119.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="45.9" lengthAdjust="spacingAndGlyphs">4  Keep</text>
  <text x="856.5" y="155.0" font-size="13" fill="#14162B" textLength="164.7" lengthAdjust="spacingAndGlyphs">--write puts the verified proof</text>
  <text x="856.5" y="173.0" font-size="13" fill="#14162B" textLength="66.5" lengthAdjust="spacingAndGlyphs">into the file.</text>
  <text x="856.5" y="197.0" font-size="13" fill="#14162B" textLength="169.8" lengthAdjust="spacingAndGlyphs">check elaborates the file from</text>
  <text x="856.5" y="215.0" font-size="13" fill="#14162B" textLength="160.4" lengthAdjust="spacingAndGlyphs">its imports in a new process</text>
  <text x="856.5" y="233.0" font-size="13" fill="#14162B" textLength="152.5" lengthAdjust="spacingAndGlyphs">and reports each theorem.</text>
  <text x="866.5" y="287.9" font-size="11.5" fill="#14162B" font-family="Menlo, Consolas, monospace" textLength="166.2" lengthAdjust="spacingAndGlyphs">check examples/even.lean</text>
  <text x="56.0" y="351.0" font-size="13" fill="#14162B" textLength="875.5" lengthAdjust="spacingAndGlyphs">The model-assisted path runs with no key as well: maithic prove examples/triangle.lean --mode replay answers from the cassettes in the repository. With</text>
  <text x="56.0" y="369.0" font-size="13" fill="#14162B" textLength="223.0" lengthAdjust="spacingAndGlyphs">your own key, leave --mode replay out.</text>
</svg>
