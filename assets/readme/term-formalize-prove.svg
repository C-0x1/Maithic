<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 569 204" width="569" height="204" role="img" aria-label="A terminal session: maithic prove takes the Lean file that maithic formalize wrote and proves its theorem. After 21 attempts a proof from the model is verified, and the statement, the proof and the one axiom it rests on are printed.">
  <title>A terminal session: maithic prove takes the Lean file that maithic formalize wrote and proves its theorem. After 21 attempts a proof from the model is verified, and the statement, the proof and the one axiom it rests on are printed.</title>
  <rect width="569" height="204" rx="10" fill="#14162B"/>
  <path d="M0 10a10 10 0 0 1 10-10h549a10 10 0 0 1 10 10v26h-569z" fill="#1E2142"/>
  <circle cx="22" cy="18" r="5.5" fill="#F26D72"/>
  <circle cx="40" cy="18" r="5.5" fill="#F0A92E"/>
  <circle cx="58" cy="18" r="5.5" fill="#57C98F"/>
  <text x="284" y="23" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8A90A6">maithic prove, on the statement that was formalized</text>
  <g font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13">
    <text x="22.00" y="58" textLength="7.83" lengthAdjust="spacingAndGlyphs" fill="#2CC4B6" font-weight="bold">$</text>
    <text x="37.66" y="58" textLength="446.31" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3" font-weight="bold">maithic prove fixtures/formalize/lean/NegativeSquare.lean</text>
    <text x="22.00" y="77" textLength="54.81" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3" font-weight="bold">problem</text>
    <text x="92.47" y="77" textLength="62.64" lengthAdjust="spacingAndGlyphs" fill="#57C98F">verified</text>
    <text x="170.77" y="77" textLength="242.73" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">(model, 21 attempt(s), 1654 ms)</text>
    <text x="37.66" y="96" textLength="321.03" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">statement: ∀ (n : Int), n &lt; 0 → 0 &lt; n ^ 2</text>
    <text x="37.66" y="115" textLength="46.98" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">proof:</text>
    <text x="123.79" y="115" textLength="15.66" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">by</text>
    <text x="139.45" y="134" textLength="407.16" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">have h2 : 0 &lt; n * n := Int.mul_pos_of_neg_of_neg h h</text>
    <text x="139.45" y="153" textLength="227.07" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">simpa [Int.pow_succ] using h2</text>
    <text x="37.66" y="172" textLength="54.81" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">axioms:</text>
    <text x="123.79" y="172" textLength="54.81" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">propext</text>
  </g>
</svg>
