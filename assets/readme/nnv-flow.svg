<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 504" role="img" aria-labelledby="nnv-flow-t nnv-flow-d" font-family="'Helvetica Neue', Arial, sans-serif">
  <title id="nnv-flow-t">How a property of a network is verified</title>
  <desc id="nnv-flow-d">Four steps in a row. A network and a property are given as JSON with exact numbers. The verifier, written in Julia, propagates intervals through the network with outward rounding and makes a claim with evidence: a box for every layer, or a counterexample. The claim is written as a Lean theorem with the exact rational weights of the network. Lean's kernel runs a checker that is proved sound, or evaluates the exact network at the counterexample, and only then is the status verified or refuted.</desc>
  <rect width="1040" height="504" fill="#FAF8F4"/>
  <rect x="40.0" y="96.0" width="217.5" height="224.0" rx="10" fill="#FFFFFF" stroke="#5B6477" stroke-width="1.5"/>
