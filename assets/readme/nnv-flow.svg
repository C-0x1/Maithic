  <circle cx="65" cy="382.0" r="8" fill="#0FA89B"/>
  <path d="M60.5 382.0 l3.2 3.6 l6 -7.2" stroke="#FFFFFF" stroke-width="2.1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="65" cy="406.0" r="8" fill="#E5484D"/>
  <path d="M61 402.0 l8 8 M69 402.0 l-8 8" stroke="#FFFFFF" stroke-width="2.1" fill="none" stroke-linecap="round"/>
  <circle cx="65" cy="430.0" r="8" fill="#F0A92E"/>
  <path d="M65 424.5 v6.5" stroke="#14162B" stroke-width="2.1" fill="none" stroke-linecap="round"/>
  <circle cx="65" cy="435.0" r="1.3" fill="#14162B"/>
  <circle cx="65" cy="454.0" r="7" fill="none" stroke="#C9CCE8" stroke-width="1.6" stroke-dasharray="3 3"/>
  <text x="40.0" y="44.0" font-size="22" fill="#14162B" font-weight="700" textLength="385.6" lengthAdjust="spacingAndGlyphs">A numerical verdict, made checkable</text>
  <text x="40.0" y="69.0" font-size="13.5" fill="#5B6477" font-family="Menlo, Consolas, monospace" textLength="268.2" lengthAdjust="spacingAndGlyphs">maithic nnv verify MODEL PROPERTY</text>
  <text x="54.0" y="119.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="98.8" lengthAdjust="spacingAndGlyphs">1  The question</text>
  <text x="54.0" y="155.0" font-size="13" fill="#14162B" textLength="158.3" lengthAdjust="spacingAndGlyphs">A ReLU network, and a box</text>
  <text x="54.0" y="173.0" font-size="13" fill="#14162B" textLength="138.7" lengthAdjust="spacingAndGlyphs">of inputs with the box its</text>
  <text x="54.0" y="191.0" font-size="13" fill="#14162B" textLength="161.9" lengthAdjust="spacingAndGlyphs">outputs are claimed to lie in.</text>
  <text x="54.0" y="215.0" font-size="13" fill="#14162B" textLength="149.6" lengthAdjust="spacingAndGlyphs">Exact numbers, written as</text>
  <text x="54.0" y="233.0" font-size="13" fill="#14162B" textLength="101.2" lengthAdjust="spacingAndGlyphs">text: 3, -7/2, 0.25.</text>
  <text x="64.0" y="299.9" font-size="11.5" fill="#14162B" font-family="Menlo, Consolas, monospace" textLength="96.9" lengthAdjust="spacingAndGlyphs">two JSON files</text>
  <text x="301.5" y="119.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="87.2" lengthAdjust="spacingAndGlyphs">2  The verifier</text>
  <text x="301.5" y="155.0" font-size="13" fill="#14162B" textLength="166.2" lengthAdjust="spacingAndGlyphs">Propagates intervals through</text>
  <text x="301.5" y="173.0" font-size="13" fill="#14162B" textLength="114.2" lengthAdjust="spacingAndGlyphs">the layers, rounding</text>
  <text x="301.5" y="191.0" font-size="13" fill="#14162B" textLength="49.9" lengthAdjust="spacingAndGlyphs">outward.</text>
  <text x="301.5" y="215.0" font-size="13" fill="#14162B" textLength="146.7" lengthAdjust="spacingAndGlyphs">Answers with evidence: a</text>
  <text x="301.5" y="233.0" font-size="13" fill="#14162B" textLength="143.1" lengthAdjust="spacingAndGlyphs">box for every layer, or an</text>
  <text x="301.5" y="251.0" font-size="13" fill="#14162B" textLength="155.4" lengthAdjust="spacingAndGlyphs">input that breaks the claim.</text>
  <text x="311.5" y="299.9" font-size="11.5" fill="#14162B" font-family="Menlo, Consolas, monospace" textLength="138.5" lengthAdjust="spacingAndGlyphs">MaithicNNV, in Julia</text>
  <text x="549.0" y="119.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="95.7" lengthAdjust="spacingAndGlyphs">3  The theorem</text>
  <text x="549.0" y="155.0" font-size="13" fill="#14162B" textLength="164.7" lengthAdjust="spacingAndGlyphs">The claim is written as Lean,</text>
  <text x="549.0" y="173.0" font-size="13" fill="#14162B" textLength="125.7" lengthAdjust="spacingAndGlyphs">with the exact rational</text>
  <text x="549.0" y="191.0" font-size="13" fill="#14162B" textLength="133.0" lengthAdjust="spacingAndGlyphs">weights of the network.</text>
  <text x="549.0" y="215.0" font-size="13" fill="#14162B" textLength="153.9" lengthAdjust="spacingAndGlyphs">Holds net input claimed, or</text>
  <text x="549.0" y="233.0" font-size="13" fill="#14162B" textLength="70.1" lengthAdjust="spacingAndGlyphs">its negation.</text>
  <text x="559.0" y="299.9" font-size="11.5" fill="#14162B" font-family="Menlo, Consolas, monospace" textLength="103.8" lengthAdjust="spacingAndGlyphs">written for you</text>
  <text x="796.5" y="119.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="81.7" lengthAdjust="spacingAndGlyphs">4  The kernel</text>
  <text x="796.5" y="155.0" font-size="13" fill="#14162B" textLength="168.4" lengthAdjust="spacingAndGlyphs">Runs a checker on the boxes</text>
  <text x="796.5" y="173.0" font-size="13" fill="#14162B" textLength="135.9" lengthAdjust="spacingAndGlyphs">that is proved sound, or</text>
  <text x="796.5" y="191.0" font-size="13" fill="#14162B" textLength="161.2" lengthAdjust="spacingAndGlyphs">evaluates the exact network</text>
  <text x="796.5" y="209.0" font-size="13" fill="#14162B" textLength="67.9" lengthAdjust="spacingAndGlyphs">at the input.</text>
  <text x="796.5" y="233.0" font-size="13" fill="#14162B" textLength="123.9" lengthAdjust="spacingAndGlyphs">by decide +kernel: no</text>
  <text x="796.5" y="251.0" font-size="13" fill="#14162B" textLength="127.9" lengthAdjust="spacingAndGlyphs">compiled evaluation is</text>
  <text x="796.5" y="269.0" font-size="13" fill="#14162B" textLength="43.4" lengthAdjust="spacingAndGlyphs">trusted.</text>
  <text x="806.5" y="299.9" font-size="11.5" fill="#14162B" font-family="Menlo, Consolas, monospace" textLength="131.5" lengthAdjust="spacingAndGlyphs">checkProperty_sound</text>
  <text x="56.0" y="363.0" font-size="12.5" fill="#2B2F77" font-weight="700" textLength="136.1" lengthAdjust="spacingAndGlyphs">What the status can be</text>
  <text x="82.0" y="385.0" font-size="13" fill="#14162B" textLength="372.2" lengthAdjust="spacingAndGlyphs">verified: the kernel accepted the theorem that the property holds.</text>
  <text x="82.0" y="409.0" font-size="13" fill="#14162B" textLength="402.5" lengthAdjust="spacingAndGlyphs">refuted: the kernel accepted the theorem that it fails, at an exact input.</text>
  <text x="82.0" y="433.0" font-size="13" fill="#14162B" textLength="505.1" lengthAdjust="spacingAndGlyphs">failed: the verifier made a claim and Lean did not accept it. Such a claim settles nothing.</text>
  <text x="82.0" y="457.0" font-size="13" fill="#14162B" textLength="622.2" lengthAdjust="spacingAndGlyphs">unknown: the verifier could not tell. Interval bounds are coarse, and a true property can be out of their reach.</text>
</svg>
