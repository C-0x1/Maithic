<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 968 337" width="968" height="337" role="img" aria-label="A terminal session: maithic oracle list prints the three oracles with the goals and number types each takes, and maithic oracle solve proves a goal of linear integer arithmetic and prints the claim, the name of its certificate and the Lean script that replays it.">
  <title>A terminal session: maithic oracle list prints the three oracles with the goals and number types each takes, and maithic oracle solve proves a goal of linear integer arithmetic and prints the claim, the name of its certificate and the Lean script that replays it.</title>
  <rect width="968" height="337" rx="10" fill="#14162B"/>
  <path d="M0 10a10 10 0 0 1 10-10h948a10 10 0 0 1 10 10v26h-968z" fill="#1E2142"/>
  <circle cx="22" cy="18" r="5.5" fill="#F26D72"/>
  <circle cx="40" cy="18" r="5.5" fill="#F0A92E"/>
  <circle cx="58" cy="18" r="5.5" fill="#57C98F"/>
  <text x="484" y="23" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8A90A6">maithic oracle solve</text>
  <g font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13">
    <text x="22.00" y="58" textLength="7.83" lengthAdjust="spacingAndGlyphs" fill="#2CC4B6" font-weight="bold">$</text>
    <text x="37.66" y="58" textLength="148.77" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3" font-weight="bold">maithic oracle list</text>
    <text x="22.00" y="77" textLength="46.98" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">oracle</text>
    <text x="115.96" y="77" textLength="39.15" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">goals</text>
    <text x="209.92" y="77" textLength="54.81" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">numbers</text>
    <text x="288.22" y="77" textLength="93.96" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">what it does</text>
    <text x="22.00" y="96" textLength="78.30" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">----------</text>
    <text x="115.96" y="96" textLength="78.30" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">----------</text>
    <text x="209.92" y="96" textLength="62.64" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">--------</text>
    <text x="288.22" y="96" textLength="657.72" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">------------------------------------------------------------------------------------</text>
    <text x="22.00" y="115" textLength="46.98" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">linear</text>
    <text x="115.96" y="115" textLength="46.98" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">linear</text>
    <text x="209.92" y="115" textLength="62.64" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">int, rat</text>
    <text x="288.22" y="115" textLength="649.89" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">Linear arithmetic by exact simplex: Farkas multipliers, or an exact counterexample.</text>
    <text x="22.00" y="134" textLength="78.30" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">polynomial</text>
    <text x="115.96" y="134" textLength="78.30" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">polynomial</text>
    <text x="209.92" y="134" textLength="62.64" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">int, rat</text>
    <text x="288.22" y="134" textLength="657.72" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">Polynomial equations by Buchberger's algorithm: cofactors, or a point where the goal</text>
    <text x="288.22" y="153" textLength="46.98" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">fails.</text>
    <text x="22.00" y="172" textLength="31.32" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">real</text>
    <text x="115.96" y="172" textLength="31.32" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">real</text>
    <text x="209.92" y="172" textLength="31.32" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">real</text>
    <text x="288.22" y="172" textLength="657.72" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">Real inequalities on a box by interval arithmetic: boxes with enclosures, or a point</text>
    <text x="288.22" y="191" textLength="164.43" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">where the goal fails.</text>
    <text x="22.00" y="229" textLength="7.83" lengthAdjust="spacingAndGlyphs" fill="#2CC4B6" font-weight="bold">$</text>
    <text x="37.66" y="229" textLength="516.78" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3" font-weight="bold">maithic oracle solve fixtures/oracle/goals/linear-integer-gap.json</text>
    <text x="22.00" y="248" textLength="46.98" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">linear</text>
    <text x="84.64" y="248" textLength="46.98" lengthAdjust="spacingAndGlyphs" fill="#57C98F">proved</text>
    <text x="147.28" y="248" textLength="195.75" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">(linear over int, 444 ms)</text>
    <text x="37.66" y="267" textLength="46.98" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">claim:</text>
    <text x="147.28" y="267" textLength="407.16" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">∀ x y : ℤ, 2 * x + 4 * y &lt; 7 → x + 2 * y ≥ 4 → False</text>
    <text x="37.66" y="286" textLength="93.96" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">certificate:</text>
    <text x="147.28" y="286" textLength="242.73" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">linear.farkas, 1fb16cc1064dc677</text>
    <text x="37.66" y="305" textLength="62.64" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">in Lean:</text>
    <text x="147.28" y="305" textLength="704.70" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">maithic_linear_int [x, y] [(1, ⟨[1, 2], .le, 3⟩), (1, ⟨[-1, -2], .le, -4⟩)] using [h1, h2]</text>
  </g>
</svg>
