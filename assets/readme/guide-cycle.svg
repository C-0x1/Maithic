  <path d="M287.5 106.0a10 10 0 0 1 10-10h197.5a10 10 0 0 1 10 10v26.0h-217.5z" fill="#EC6813"/>
  <rect x="301.5" y="248.0" width="189.5" height="24.0" rx="6" fill="#E8E9F3"/>
  <path d="M509.0 190.0 L523.0 190.0" stroke="#5B6477" stroke-width="1.6" fill="none"/>
  <path d="M521.0 184.0 l10 6 l-10 6 z" fill="#5B6477"/>
  <path d="M535.0 106.0a10 10 0 0 1 10-10h197.5a10 10 0 0 1 10 10v26.0h-217.5z" fill="#9558B2"/>
  <rect x="549.0" y="248.0" width="189.5" height="24.0" rx="6" fill="#E8E9F3"/>
  <path d="M756.5 190.0 L770.5 190.0" stroke="#5B6477" stroke-width="1.6" fill="none"/>
  <path d="M768.5 184.0 l10 6 l-10 6 z" fill="#5B6477"/>
  <path d="M782.5 106.0a10 10 0 0 1 10-10h197.5a10 10 0 0 1 10 10v26.0h-217.5z" fill="#2B2F77"/>
  <rect x="796.5" y="248.0" width="189.5" height="24.0" rx="6" fill="#E8E9F3"/>
  <text x="40.0" y="44.0" font-size="22" fill="#14162B" font-weight="700" textLength="595.3" lengthAdjust="spacingAndGlyphs">From proofs to a model that guides the search for proofs</text>
  <text x="40.0" y="69.0" font-size="13.5" fill="#5B6477" font-family="Menlo, Consolas, monospace" textLength="373.8" lengthAdjust="spacingAndGlyphs">corpus harvest  -&gt;  guide train  -&gt;  prove --guide</text>
  <text x="54.0" y="119.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="56.0" lengthAdjust="spacingAndGlyphs">1  Proofs</text>
  <text x="54.0" y="155.0" font-size="13" fill="#14162B" textLength="144.5" lengthAdjust="spacingAndGlyphs">Theorems that the kernel</text>
  <text x="54.0" y="173.0" font-size="13" fill="#14162B" textLength="143.8" lengthAdjust="spacingAndGlyphs">accepted, in Lean files of</text>
  <text x="54.0" y="191.0" font-size="13" fill="#14162B" textLength="106.2" lengthAdjust="spacingAndGlyphs">your own or of this</text>
  <text x="54.0" y="209.0" font-size="13" fill="#14162B" textLength="59.7" lengthAdjust="spacingAndGlyphs">repository.</text>
  <text x="64.0" y="263.9" font-size="11.5" fill="#14162B" font-family="Menlo, Consolas, monospace" textLength="83.1" lengthAdjust="spacingAndGlyphs">lean/Maithic</text>
  <text x="301.5" y="119.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="62.3" lengthAdjust="spacingAndGlyphs">2  Dataset</text>
  <text x="301.5" y="155.0" font-size="13" fill="#14162B" textLength="134.4" lengthAdjust="spacingAndGlyphs">Each smallest step of a</text>
  <text x="301.5" y="173.0" font-size="13" fill="#14162B" textLength="153.2" lengthAdjust="spacingAndGlyphs">complete proof becomes a</text>
  <text x="301.5" y="191.0" font-size="13" fill="#14162B" textLength="162.6" lengthAdjust="spacingAndGlyphs">pair: the proof state, and the</text>
  <text x="301.5" y="209.0" font-size="13" fill="#14162B" textLength="136.6" lengthAdjust="spacingAndGlyphs">tactic that was run on it.</text>
  <text x="311.5" y="263.9" font-size="11.5" fill="#14162B" font-family="Menlo, Consolas, monospace" textLength="152.3" lengthAdjust="spacingAndGlyphs">maithic corpus harvest</text>
  <text x="549.0" y="119.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="52.1" lengthAdjust="spacingAndGlyphs">3  Model</text>
  <text x="549.0" y="155.0" font-size="13" fill="#14162B" textLength="156.8" lengthAdjust="spacingAndGlyphs">A small model learns which</text>
  <text x="549.0" y="173.0" font-size="13" fill="#14162B" textLength="150.3" lengthAdjust="spacingAndGlyphs">tactic template fits a state.</text>
  <text x="549.0" y="197.0" font-size="13" fill="#14162B" textLength="137.3" lengthAdjust="spacingAndGlyphs">Its accuracy on proofs it</text>
  <text x="549.0" y="215.0" font-size="13" fill="#14162B" textLength="127.2" lengthAdjust="spacingAndGlyphs">never saw is recorded</text>
  <text x="549.0" y="233.0" font-size="13" fill="#14162B" textLength="104.8" lengthAdjust="spacingAndGlyphs">beside a baseline.</text>
  <text x="559.0" y="263.9" font-size="11.5" fill="#14162B" font-family="Menlo, Consolas, monospace" textLength="131.5" lengthAdjust="spacingAndGlyphs">maithic guide train</text>
  <text x="796.5" y="119.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="58.4" lengthAdjust="spacingAndGlyphs">4  Search</text>
  <text x="796.5" y="155.0" font-size="13" fill="#14162B" textLength="166.9" lengthAdjust="spacingAndGlyphs">The model orders which goal</text>
  <text x="796.5" y="173.0" font-size="13" fill="#14162B" textLength="139.5" lengthAdjust="spacingAndGlyphs">the search turns to next.</text>
  <text x="796.5" y="197.0" font-size="13" fill="#14162B" textLength="150.3" lengthAdjust="spacingAndGlyphs">Lean runs every step, and</text>
  <text x="796.5" y="215.0" font-size="13" fill="#14162B" textLength="120.7" lengthAdjust="spacingAndGlyphs">the kernel judges the</text>
  <text x="796.5" y="233.0" font-size="13" fill="#14162B" textLength="81.7" lengthAdjust="spacingAndGlyphs">finished proof.</text>
  <text x="806.5" y="263.9" font-size="11.5" fill="#14162B" font-family="Menlo, Consolas, monospace" textLength="145.4" lengthAdjust="spacingAndGlyphs">maithic prove --guide</text>
  <text x="56.0" y="327.0" font-size="13" fill="#14162B" textLength="779.7" lengthAdjust="spacingAndGlyphs">The guide reorders and does nothing else. A wrong guess costs time, never correctness: a proof counts only when the kernel accepts it.</text>
  <text x="56.0" y="351.0" font-size="13" fill="#14162B" textLength="322.3" lengthAdjust="spacingAndGlyphs">The same seed gives the same model file, byte for byte.</text>
</svg>
