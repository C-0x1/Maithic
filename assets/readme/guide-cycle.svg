<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 398" role="img" aria-labelledby="guide-cycle-t guide-cycle-d" font-family="'Helvetica Neue', Arial, sans-serif">
  <title id="guide-cycle-t">From proofs to a model that guides the search for proofs</title>
  <desc id="guide-cycle-d">Four steps in a row. Proofs in Lean files are traced into a dataset of pairs: a proof state and the tactic that was run on it. A small model is trained on the pairs, with the split by theorem, and its accuracy on proofs it never saw is recorded beside a baseline. In the step-wise search the model orders which goal to turn to next. Lean runs every step, and the kernel accepts the finished proof or does not.</desc>
  <rect width="1040" height="398" fill="#FAF8F4"/>
  <rect x="40.0" y="96.0" width="217.5" height="188.0" rx="10" fill="#FFFFFF" stroke="#2B2F77" stroke-width="1.5"/>
  <rect x="287.5" y="96.0" width="217.5" height="188.0" rx="10" fill="#FFFFFF" stroke="#EC6813" stroke-width="1.5"/>
  <rect x="535.0" y="96.0" width="217.5" height="188.0" rx="10" fill="#FFFFFF" stroke="#9558B2" stroke-width="1.5"/>
  <rect x="782.5" y="96.0" width="217.5" height="188.0" rx="10" fill="#FFFFFF" stroke="#2B2F77" stroke-width="1.5"/>
  <rect x="40.0" y="302.0" width="960.0" height="66.0" rx="10" fill="#E8E9F3"/>
