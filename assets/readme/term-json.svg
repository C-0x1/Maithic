<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 639 679" width="639" height="679" role="img" aria-label="A terminal session: maithic check with the option json prints its report as a JSON document that names its schema, maithic.check.report/1, with the file, the counts of errors, warnings and declarations, the theorem even_add_even with its statement, the status failed, the axiom sorryAx and the reason, and the diagnostic of Lean with its line and column.">
