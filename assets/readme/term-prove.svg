    <text x="37.66" y="96" textLength="508.95" lengthAdjust="spacingAndGlyphs" fill="#E8E9F3">statement: ∀ (a b : Nat), a % 2 = 0 → b % 2 = 0 → (a + b) % 2 = 0</text>
