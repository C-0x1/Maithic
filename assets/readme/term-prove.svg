<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 569 166" width="569" height="166" role="img" aria-label="A terminal session: maithic prove closes a theorem about even numbers; the proof that the automation found is checked by Lean's kernel and the result is verified, with the axioms it rests on.">
