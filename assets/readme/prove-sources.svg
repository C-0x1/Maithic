<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 704" role="img" aria-labelledby="prove-sources-t prove-sources-d" font-family="'Helvetica Neue', Arial, sans-serif">
  <title id="prove-sources-t">Where candidate proofs come from</title>
  <desc id="prove-sources-d">Four stages from top to bottom, each with a note at its right. First the automation portfolio, a fixed list of scripts built from rfl, trivial, simp, omega, decide, simp_all and grind, which needs no model and always runs first. Second, with the option oracle, a solver that returns a certificate for an arithmetic goal. Third, with the option search, a search that runs one tactic at a time on proof states. Fourth, unless AI is switched off, a model that proposes whole proofs in rounds and sees Lean's errors from the round before. The first candidate that the kernel accepts ends the work.</desc>
  <rect width="960" height="704" fill="#FAF8F4"/>
