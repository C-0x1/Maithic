<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 757 622" width="757" height="622" role="img" aria-label="A terminal session: maithic prove with the option verbose lists every candidate proof of a theorem about triangular numbers. The eighteen candidates of the automation fail. In round 1 a model proposes two proofs and Lean rejects both, the first as a failed tactic and the second with unsolved goals. In round 2 the model's proof by induction is accepted, and the result is verified after 21 attempts.">
  <title>A terminal session: maithic prove with the option verbose lists every candidate proof of a theorem about triangular numbers. The eighteen candidates of the automation fail. In round 1 a model proposes two proofs and Lean rejects both, the first as a failed tactic and the second with unsolved goals. In round 2 the model's proof by induction is accepted, and the result is verified after 21 attempts.</title>
