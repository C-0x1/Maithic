<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 952 356" width="952" height="356" role="img" aria-label="A terminal session: maithic blueprint plan takes an argument in words apart into two definitions, four lemmas, a theorem and a corollary, with what each rests on, and notes the two things it put in order in the answer. maithic blueprint skeleton then writes the eight declarations as Lean, each with sorry for a proof, and Lean compiles them.">
