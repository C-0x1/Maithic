  <rect x="366.0" y="308.0" width="308.0" height="188.0" rx="10" fill="#FFFFFF" stroke="#2B2F77" stroke-width="1.5"/>
  <rect x="692.0" y="308.0" width="308.0" height="188.0" rx="10" fill="#FFFFFF" stroke="#0B7F75" stroke-width="1.5"/>
  <rect x="40.0" y="514.0" width="960.0" height="60.0" rx="10" fill="#E8E9F3"/>
