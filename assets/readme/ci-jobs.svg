<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 604" role="img" aria-labelledby="ci-jobs-t ci-jobs-d" font-family="'Helvetica Neue', Arial, sans-serif">
  <title id="ci-jobs-t">The five jobs of the workflow and its gate</title>
  <desc id="ci-jobs-d">Six cards. The OCaml job builds the command and the developer tool, runs the unit tests and the repository gates. The Lean job builds the libraries, the Bridge and the tools, failing on warnings, and runs the Lean tests. The Julia job tests the eight packages. The R job installs the two packages and runs their tests. The integration job brings OCaml, Lean and Julia together: the real Bridge, the built command, the oracle engines, and the sessions a user would run. The last card is the gate, which succeeds only when all five did. No job needs a key.</desc>
  <rect width="1040" height="604" fill="#FAF8F4"/>
  <rect x="40.0" y="96.0" width="308.0" height="194.0" rx="10" fill="#FFFFFF" stroke="#EC6813" stroke-width="1.5"/>
  <rect x="366.0" y="96.0" width="308.0" height="194.0" rx="10" fill="#FFFFFF" stroke="#2B2F77" stroke-width="1.5"/>
  <rect x="692.0" y="96.0" width="308.0" height="194.0" rx="10" fill="#FFFFFF" stroke="#9558B2" stroke-width="1.5"/>
