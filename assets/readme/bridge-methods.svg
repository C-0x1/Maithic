  <rect x="325.2" y="214.0" width="82.3" height="24.0" rx="6" fill="#E8E9F3"/>
  <rect x="415.6" y="214.0" width="89.2" height="24.0" rx="6" fill="#E8E9F3"/>
  <rect x="512.8" y="214.0" width="75.4" height="24.0" rx="6" fill="#E8E9F3"/>
