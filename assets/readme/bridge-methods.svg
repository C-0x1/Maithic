<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 672" role="img" aria-labelledby="bridge-methods-t bridge-methods-d" font-family="'Helvetica Neue', Arial, sans-serif">
  <title id="bridge-methods-t">The sixteen methods of the Bridge</title>
  <desc id="bridge-methods-d">Five bands. Environments: loadHeader, runCommand, checkFile, tryCandidates and releaseEnv run text on an environment and return a report. Proof states: startProof, runTactic, tryTactics, getState and releaseState run one tactic at a time on a goal. Description: extract describes a whole file. Safety: guard says whether untrusted text would be admitted. Housekeeping: handshake, stats, selfTest and shutdown.</desc>
  <rect width="960" height="672" fill="#FAF8F4"/>
  <rect x="40.0" y="96.0" width="880.0" height="94.0" rx="10" fill="#FFFFFF" stroke="#2B2F77" stroke-width="1.5"/>
