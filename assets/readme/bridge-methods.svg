  <path d="M40.0 496.0a10 10 0 0 1 10-10h160.0v54.0h-160.0a10 10 0 0 1 -10-10z" fill="#5B6477"/>
  <rect x="228.0" y="498.0" width="82.3" height="24.0" rx="6" fill="#E8E9F3"/>
  <rect x="318.3" y="498.0" width="54.6" height="24.0" rx="6" fill="#E8E9F3"/>
  <rect x="380.9" y="498.0" width="75.4" height="24.0" rx="6" fill="#E8E9F3"/>
