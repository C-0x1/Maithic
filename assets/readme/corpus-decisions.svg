<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 282" role="img" aria-labelledby="corpus-decisions-t corpus-decisions-d" font-family="'Helvetica Neue', Arial, sans-serif">
  <title id="corpus-decisions-t">Three decisions that shape the data</title>
  <desc id="corpus-decisions-d">Three cards. Steps are tactics, and only tactics: only syntax that is a tactic becomes a step, so intro a b is one step. Pairs come from complete proofs only: a pair says that on this state this tactic is a step of a proof, and that is known only of a proof the kernel accepted whole. Premises are read from the proof term: the proof of double_eq names one lemma, and its proof term refers to 82 constants.</desc>
  <rect width="1040" height="282" fill="#FAF8F4"/>
  <rect x="40.0" y="96.0" width="308.0" height="156.0" rx="10" fill="#FFFFFF" stroke="#2B2F77" stroke-width="1.5"/>
  <rect x="366.0" y="96.0" width="308.0" height="156.0" rx="10" fill="#FFFFFF" stroke="#0B7F75" stroke-width="1.5"/>
  <rect x="692.0" y="96.0" width="308.0" height="156.0" rx="10" fill="#FFFFFF" stroke="#B37400" stroke-width="1.5"/>
  <path d="M40.0 106.0a10 10 0 0 1 10-10h288.0a10 10 0 0 1 10 10v26.0h-308.0z" fill="#2B2F77"/>
  <path d="M366.0 106.0a10 10 0 0 1 10-10h288.0a10 10 0 0 1 10 10v26.0h-308.0z" fill="#0B7F75"/>
  <path d="M692.0 106.0a10 10 0 0 1 10-10h288.0a10 10 0 0 1 10 10v26.0h-308.0z" fill="#B37400"/>
  <text x="40.0" y="44.0" font-size="22" fill="#14162B" font-weight="700" textLength="374.1" lengthAdjust="spacingAndGlyphs">Three decisions that shape the data</text>
  <text x="40.0" y="69.0" font-size="13.5" fill="#5B6477" font-family="Menlo, Consolas, monospace" textLength="447.0" lengthAdjust="spacingAndGlyphs">maithic corpus harvest PATH --project DIR --out dataset</text>
  <text x="54.0" y="119.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="224.9" lengthAdjust="spacingAndGlyphs">Steps are tactics, and only tactics</text>
  <text x="54.0" y="155.0" font-size="13" fill="#14162B" textLength="227.7" lengthAdjust="spacingAndGlyphs">Lean notes goals at more places than a</text>
  <text x="54.0" y="173.0" font-size="13" fill="#14162B" textLength="140.9" lengthAdjust="spacingAndGlyphs">reader would call a step.</text>
  <text x="54.0" y="197.0" font-size="13" fill="#14162B" textLength="218.2" lengthAdjust="spacingAndGlyphs">Only syntax that is a tactic becomes a</text>
  <text x="54.0" y="215.0" font-size="13" fill="#14162B" textLength="232.7" lengthAdjust="spacingAndGlyphs">step: intro a b is one step, and a bullet is</text>
  <text x="54.0" y="233.0" font-size="13" fill="#14162B" textLength="194.4" lengthAdjust="spacingAndGlyphs">the step that holds what follows it.</text>
  <text x="380.0" y="119.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="222.5" lengthAdjust="spacingAndGlyphs">Pairs come from complete proofs</text>
  <text x="380.0" y="155.0" font-size="13" fill="#14162B" textLength="226.2" lengthAdjust="spacingAndGlyphs">A pair says: on this state, this tactic is a</text>
  <text x="380.0" y="173.0" font-size="13" fill="#14162B" textLength="86.7" lengthAdjust="spacingAndGlyphs">step of a proof.</text>
  <text x="380.0" y="197.0" font-size="13" fill="#14162B" textLength="226.9" lengthAdjust="spacingAndGlyphs">That is known only of a proof the kernel</text>
  <text x="380.0" y="215.0" font-size="13" fill="#14162B" textLength="213.2" lengthAdjust="spacingAndGlyphs">accepted whole. A proof that rests on</text>
  <text x="380.0" y="233.0" font-size="13" fill="#14162B" textLength="116.3" lengthAdjust="spacingAndGlyphs">sorry gives no pairs.</text>
  <text x="706.0" y="119.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="236.5" lengthAdjust="spacingAndGlyphs">Premises come from the proof term</text>
  <text x="706.0" y="155.0" font-size="13" fill="#14162B" textLength="248.6" lengthAdjust="spacingAndGlyphs">The proof of double_eq names one lemma.</text>
  <text x="706.0" y="173.0" font-size="13" fill="#14162B" textLength="240.6" lengthAdjust="spacingAndGlyphs">Its proof term refers to 82 constants, most</text>
  <text x="706.0" y="191.0" font-size="13" fill="#14162B" textLength="233.4" lengthAdjust="spacingAndGlyphs">of them reached for by omega and simp.</text>
  <text x="706.0" y="215.0" font-size="13" fill="#14162B" textLength="214.6" lengthAdjust="spacingAndGlyphs">A model that selects premises should</text>
  <text x="706.0" y="233.0" font-size="13" fill="#14162B" textLength="151.7" lengthAdjust="spacingAndGlyphs">learn from what was used.</text>
</svg>
