<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 733 641" width="733" height="641" role="img" aria-label="A terminal session: maithic search answers the words sorting keeps the elements with theorems about insertion sort, the first of them the theorem that insertion sort keeps the elements, each with its statement, its documentation and the words that matched. A second search, for add comm, is also put to Lean and returns the commutativity of addition for integers, natural numbers and rationals from Lean's own library.">
