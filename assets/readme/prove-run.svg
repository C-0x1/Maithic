<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 874" role="img" aria-labelledby="prove-run-t prove-run-d" font-family="'Helvetica Neue', Arial, sans-serif">
  <title id="prove-run-t">One run of the prover, message by message</title>
  <desc id="prove-run-d">A sequence diagram with four lifelines: the maithic command, a model, Lean in the session, and Lean in a new process. The command sends the file up to the theorem to Lean and receives an environment. It sends the 18 candidates of the portfolio, and all fail. It asks the model, which answers with two proofs; Lean rejects both, one because simp made no progress and one with unsolved goals. The command asks again, with the two proofs and Lean's error for each, and the model answers with a proof by induction, which Lean accepts with the axioms it rests on. The whole file with the proof is then elaborated in a new process, which reaches the same statement, and the theorem is verified.</desc>
