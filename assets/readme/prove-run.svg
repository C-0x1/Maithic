  <text x="40.0" y="44.0" font-size="22" fill="#14162B" font-weight="700" textLength="462.2" lengthAdjust="spacingAndGlyphs">One run of the prover, message by message</text>
  <text x="40.0" y="69.0" font-size="13.5" fill="#5B6477" font-family="Menlo, Consolas, monospace" textLength="577.0" lengthAdjust="spacingAndGlyphs">maithic prove examples/triangle.lean --mode replay --provider anthropic</text>
  <text x="160.0" y="119.0" font-size="13.5" fill="#FFFFFF" font-weight="700" text-anchor="middle" textLength="87.8" lengthAdjust="spacingAndGlyphs">maithic prove</text>
  <text x="400.0" y="119.0" font-size="13.5" fill="#FFFFFF" font-weight="700" text-anchor="middle" textLength="51.0" lengthAdjust="spacingAndGlyphs">a model</text>
  <text x="640.0" y="119.0" font-size="13.5" fill="#FFFFFF" font-weight="700" text-anchor="middle" textLength="129.0" lengthAdjust="spacingAndGlyphs">Lean, in the session</text>
  <text x="880.0" y="119.0" font-size="13.5" fill="#FFFFFF" font-weight="700" text-anchor="middle" textLength="147.8" lengthAdjust="spacingAndGlyphs">Lean, in a new process</text>
  <text x="400.0" y="163.0" font-size="12.5" fill="#14162B" text-anchor="middle" textLength="138.3" lengthAdjust="spacingAndGlyphs">the file up to the theorem</text>
  <text x="400.0" y="205.0" font-size="12.5" fill="#5B6477" text-anchor="middle" textLength="86.2" lengthAdjust="spacingAndGlyphs">an environment</text>
  <text x="400.0" y="247.0" font-size="12.5" fill="#14162B" text-anchor="middle" textLength="175.1" lengthAdjust="spacingAndGlyphs">18 candidates from the portfolio</text>
  <text x="400.0" y="289.0" font-size="12.5" fill="#5B6477" text-anchor="middle" textLength="50.0" lengthAdjust="spacingAndGlyphs">18 errors</text>
  <text x="280.0" y="331.0" font-size="12.5" fill="#14162B" text-anchor="middle" textLength="75.7" lengthAdjust="spacingAndGlyphs">the statement</text>
  <text x="280.0" y="373.0" font-size="12.5" fill="#5B6477" text-anchor="middle" textLength="45.2" lengthAdjust="spacingAndGlyphs">2 proofs</text>
  <text x="400.0" y="415.0" font-size="12.5" fill="#14162B" text-anchor="middle" textLength="66.0" lengthAdjust="spacingAndGlyphs">the 2 proofs</text>
  <text x="400.0" y="457.0" font-size="12.5" fill="#5B6477" text-anchor="middle" textLength="368.3" lengthAdjust="spacingAndGlyphs">simp made no progress; unsolved goals, with the goal that was left</text>
  <text x="280.0" y="499.0" font-size="12.5" fill="#14162B" text-anchor="middle" textLength="176.5" lengthAdjust="spacingAndGlyphs">the statement, the 2 proofs, and</text>
  <text x="280.0" y="515.0" font-size="12.5" fill="#14162B" text-anchor="middle" textLength="115.0" lengthAdjust="spacingAndGlyphs">Lean's error for each</text>
  <text x="280.0" y="557.0" font-size="12.5" fill="#5B6477" text-anchor="middle" textLength="112.6" lengthAdjust="spacingAndGlyphs">1 proof, by induction</text>
  <text x="400.0" y="599.0" font-size="12.5" fill="#14162B" text-anchor="middle" textLength="49.3" lengthAdjust="spacingAndGlyphs">the proof</text>
  <text x="400.0" y="641.0" font-size="12.5" fill="#5B6477" text-anchor="middle" textLength="346.0" lengthAdjust="spacingAndGlyphs">accepted; it rests on propext, Classical.choice and Quot.sound</text>
  <text x="68.0" y="692.0" font-size="12.5" fill="#14162B" textLength="539.2" lengthAdjust="spacingAndGlyphs">The trust policy allows these three axioms. One thing is left before the word verified: the re-check.</text>
  <text x="520.0" y="730.0" font-size="12.5" fill="#14162B" text-anchor="middle" textLength="201.5" lengthAdjust="spacingAndGlyphs">the whole file, with the proof in place</text>
  <text x="520.0" y="772.0" font-size="12.5" fill="#5B6477" text-anchor="middle" textLength="198.0" lengthAdjust="spacingAndGlyphs">the same statement, the same facts</text>
  <text x="68.0" y="823.0" font-size="12.5" fill="#14162B" textLength="541.3" lengthAdjust="spacingAndGlyphs">tri_formula  verified  (model, 21 attempts): 18 from the portfolio, 2 in the first round, 1 in the second.</text>
</svg>
