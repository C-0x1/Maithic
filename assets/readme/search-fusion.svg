<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 538" role="img" aria-labelledby="search-fusion-t search-fusion-d" font-family="'Helvetica Neue', Arial, sans-serif">
  <title id="search-fusion-t">Three retrievers and one ranking</title>
  <desc id="search-fusion-d">Three cards at the top, one for each retriever. Lexical: BM25 over the words of names, statements and documentation, with a word in a name weighing most. Name: the query read as a name or a part of one. Lean: with the option lean, Lean's own environment is searched for names that hold every word. Arrows lead from each to one card below: the rankings are merged by reciprocal rank fusion, where a declaration scores one over sixty plus its rank in every ranking that holds it, and an exact name weighs double.</desc>
  <rect width="960" height="538" fill="#FAF8F4"/>
  <rect x="40.0" y="96.0" width="281.3" height="170.0" rx="10" fill="#FFFFFF" stroke="#2B2F77" stroke-width="1.5"/>
  <rect x="339.3" y="96.0" width="281.3" height="170.0" rx="10" fill="#FFFFFF" stroke="#2B2F77" stroke-width="1.5"/>
  <rect x="638.7" y="96.0" width="281.3" height="170.0" rx="10" fill="#FFFFFF" stroke="#2B2F77" stroke-width="1.5"/>
  <rect x="40.0" y="310.0" width="880.0" height="138.0" rx="10" fill="#FFFFFF" stroke="#0B7F75" stroke-width="1.5"/>
  <rect x="40.0" y="466.0" width="880.0" height="42.0" rx="10" fill="#E8E9F3"/>
  <path d="M40.0 106.0a10 10 0 0 1 10-10h261.3a10 10 0 0 1 10 10v26.0h-281.3z" fill="#2B2F77"/>
  <rect x="54.0" y="230.0" width="253.3" height="24.0" rx="6" fill="#E8E9F3"/>
  <path d="M339.3 106.0a10 10 0 0 1 10-10h261.3a10 10 0 0 1 10 10v26.0h-281.3z" fill="#2B2F77"/>
  <rect x="353.3" y="230.0" width="253.3" height="24.0" rx="6" fill="#E8E9F3"/>
  <path d="M638.7 106.0a10 10 0 0 1 10-10h261.3a10 10 0 0 1 10 10v26.0h-281.3z" fill="#2B2F77"/>
  <rect x="652.7" y="230.0" width="253.3" height="24.0" rx="6" fill="#E8E9F3"/>
  <path d="M180.7 270.0 L180.7 298.0" stroke="#5B6477" stroke-width="1.6" fill="none"/>
  <path d="M174.66666666666666 296 l6 10 l6 -10 z" fill="#5B6477"/>
  <path d="M480.0 270.0 L480.0 298.0" stroke="#5B6477" stroke-width="1.6" fill="none"/>
  <path d="M474.0 296 l6 10 l6 -10 z" fill="#5B6477"/>
  <path d="M779.3 270.0 L779.3 298.0" stroke="#5B6477" stroke-width="1.6" fill="none"/>
  <path d="M773.3333333333333 296 l6 10 l6 -10 z" fill="#5B6477"/>
  <path d="M40.0 320.0a10 10 0 0 1 10-10h860.0a10 10 0 0 1 10 10v26.0h-880.0z" fill="#0B7F75"/>
  <text x="40.0" y="44.0" font-size="22" fill="#14162B" font-weight="700" textLength="303.2" lengthAdjust="spacingAndGlyphs">Three retrievers, one ranking</text>
  <text x="40.0" y="69.0" font-size="13.5" fill="#5B6477" font-family="Menlo, Consolas, monospace" textLength="300.7" lengthAdjust="spacingAndGlyphs">maithic search QUERY --in PATH --lean</text>
  <text x="54.0" y="119.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="47.5" lengthAdjust="spacingAndGlyphs">Lexical</text>
  <text x="54.0" y="155.0" font-size="13" fill="#14162B" textLength="104.8" lengthAdjust="spacingAndGlyphs">BM25 over words.</text>
  <text x="54.0" y="179.0" font-size="13" fill="#14162B" textLength="183.6" lengthAdjust="spacingAndGlyphs">A word in a name weighs 3, in a</text>
  <text x="54.0" y="197.0" font-size="13" fill="#14162B" textLength="206.7" lengthAdjust="spacingAndGlyphs">statement 1.5, in the documentation</text>
  <text x="54.0" y="215.0" font-size="13" fill="#14162B" textLength="117.8" lengthAdjust="spacingAndGlyphs">1, in the module 0.5.</text>
  <text x="64.0" y="245.9" font-size="11.5" fill="#14162B" font-family="Menlo, Consolas, monospace" textLength="69.2" lengthAdjust="spacingAndGlyphs">your files</text>
  <text x="353.3" y="119.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="38.1" lengthAdjust="spacingAndGlyphs">Name</text>
  <text x="353.3" y="155.0" font-size="13" fill="#14162B" textLength="198.5" lengthAdjust="spacingAndGlyphs">The query, read as a name or as a</text>
  <text x="353.3" y="173.0" font-size="13" fill="#14162B" textLength="65.8" lengthAdjust="spacingAndGlyphs">part of one.</text>
  <text x="353.3" y="197.0" font-size="13" fill="#14162B" textLength="206.0" lengthAdjust="spacingAndGlyphs">An exact name counts double when</text>
  <text x="353.3" y="215.0" font-size="13" fill="#14162B" textLength="144.5" lengthAdjust="spacingAndGlyphs">the rankings are merged.</text>
  <text x="363.3" y="245.9" font-size="11.5" fill="#14162B" font-family="Menlo, Consolas, monospace" textLength="69.2" lengthAdjust="spacingAndGlyphs">your files</text>
  <text x="652.7" y="119.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="32.7" lengthAdjust="spacingAndGlyphs">Lean</text>
  <text x="652.7" y="155.0" font-size="13" fill="#14162B" textLength="219.7" lengthAdjust="spacingAndGlyphs">Lean searches everything in scope for</text>
  <text x="652.7" y="173.0" font-size="13" fill="#14162B" textLength="195.8" lengthAdjust="spacingAndGlyphs">names that hold every word of the</text>
  <text x="652.7" y="191.0" font-size="13" fill="#14162B" textLength="35.2" lengthAdjust="spacingAndGlyphs">query.</text>
  <text x="662.7" y="245.9" font-size="11.5" fill="#14162B" font-family="Menlo, Consolas, monospace" textLength="186.9" lengthAdjust="spacingAndGlyphs">--lean: everything in scope</text>
  <text x="54.0" y="333.0" font-size="14" fill="#FFFFFF" font-weight="700" textLength="220.2" lengthAdjust="spacingAndGlyphs">Merged by reciprocal rank fusion</text>
  <text x="54.0" y="369.0" font-size="13" fill="#14162B" textLength="733.1" lengthAdjust="spacingAndGlyphs">Each retriever returns a ranking. A declaration scores 1 / (60 + rank) in every ranking that holds it, and the scores are added. An</text>
  <text x="54.0" y="387.0" font-size="13" fill="#14162B" textLength="157.5" lengthAdjust="spacingAndGlyphs">exact name weighs double.</text>
  <text x="54.0" y="411.0" font-size="13" fill="#14162B" textLength="713.9" lengthAdjust="spacingAndGlyphs">No score of one retriever is ever compared with a score of another: only ranks are. A declaration that two retrievers agree on</text>
  <text x="54.0" y="429.0" font-size="13" fill="#14162B" textLength="31.1" lengthAdjust="spacingAndGlyphs">rises.</text>
  <text x="56.0" y="491.0" font-size="13" fill="#14162B" textLength="608.4" lengthAdjust="spacingAndGlyphs">Every hit says which retrievers found it and which words matched, so a surprising result can be explained.</text>
</svg>
