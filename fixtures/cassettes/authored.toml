# Answers for the demonstration proofs.
#
# `make cassettes` runs each demonstration with these answers in place of a
# model and stores every exchange as an authored cassette, once per provider.
# The cassettes let the demonstrations and the end-to-end tests run in replay
# mode, with no key and no network. They are test fixtures written by hand:
# they are not recordings of any model.

[[demo]]
file = "examples/triangle.lean"
theorem = "tri_formula"
answers = [
  '{"candidates": ["by omega", "by simp [tri]", "by induction n <;> simp [tri]"]}',
  '{"candidates": ["by\n  induction n with\n  | zero => rfl\n  | succ k ih => simp only [tri]; grind"]}',
]

# The statement that `maithic formalize` chose for the first of its
# demonstrations below, proved. The first two proofs call tactics that the core
# library does not have, and Lean says so; the third is checked and kept.
[[demo]]
file = "fixtures/formalize/lean/NegativeSquare.lean"
theorem = "problem"
answers = [
  '{"candidates": ["by positivity", "by nlinarith [sq_nonneg n]", "by\n  have h2 : 0 < n * n := Int.mul_pos_of_neg_of_neg h h\n  simpa [Int.pow_succ] using h2"]}',
]

# Answers for the demonstration repair: `maithic mend repair` on a file whose
# proofs stopped compiling. The model is asked about the two proofs no rule
# can repair, once each. The first answer offers a proof written anew and the
# proof with one step changed; Lean accepts both, and the smaller change is
# kept.

[[mend]]
file = "fixtures/mend/lean/Upgrade.lean"
renames = "fixtures/mend/renames.toml"
answers = [
  '{"candidates": ["by\n  simp [twice]\n  omega", "by\n  induction n with\n  | zero => simp [twice]\n  | succ k ih =>\n    simp [twice] at *\n    omega"]}',
  '{"candidates": ["by\n  exact Nat.add_zero n"]}',
]

# Answers for the demonstrations of `maithic formalize`. The model is asked in
# this order: once for the statements; once for each repair of a statement
# that does not elaborate; and then, for each statement that Lean neither
# rejects nor shows to be a duplicate, once for what it says in English and
# once for how well that agrees with the problem.

# Four statements for one sentence. Lean rejects two of them, one as vacuous
# and one with a counterexample, and shows that the repaired fourth says what
# the first says. Only the first is read back.
[[formalize]]
problem = "fixtures/formalize/problems/negative-square.txt"
candidates = 4
status = "formalized"
answers = [
  '{"candidates": [{"statement": "(n : Int) (h : n < 0) : 0 < n ^ 2", "reading": "The number is an integer below zero, and positive means above zero."}, {"statement": "(n : Nat) (h : n < 0) : 0 < n ^ 2", "reading": "The number is taken from the natural numbers."}, {"statement": "(n : Int) (h : n ≤ 0) : 0 < n ^ 2", "reading": "Negative is read as not positive, so zero is allowed."}, {"statement": "(n : ℤ) (h : n < 0) : n ^ 2 > 0", "reading": "The same claim with the conclusion written as greater than."}]}',
  '{"statement": "(n : Int) (h : n < 0) : n ^ 2 > 0"}',
  '{"english": "For every integer n that is less than zero, the square of n is greater than zero."}',
  '{"score": 10, "differences": []}',
]

# A problem that is false as it is posed, because subtraction of natural
# numbers stops at zero. Lean refutes the literal statement; the two that are
# left each differ from the problem, and the report says how.
[[formalize]]
problem = "fixtures/formalize/problems/subtraction.md"
candidates = 3
status = "flagged"
answers = [
  '{"candidates": [{"statement": "(a b : Nat) : a - b + b = a", "reading": "Both numbers are natural numbers, and the minus sign is subtraction of natural numbers."}, {"statement": "(a b : Nat) (h : b ≤ a) : a - b + b = a", "reading": "Adds the assumption that b is at most a, without which the subtraction is cut off at zero."}, {"statement": "(a b : Int) : a - b + b = a", "reading": "Moves to the integers, where subtraction is exact."}]}',
  '{"english": "For all natural numbers a and b such that b is at most a, subtracting b from a and then adding b gives a. The subtraction is that of natural numbers, which would stop at zero if b were larger than a."}',
  '{"score": 7, "differences": ["The statement assumes that b is at most a; the problem makes no such assumption."]}',
  '{"english": "For all integers a and b, subtracting b from a and then adding b gives a."}',
  '{"score": 6, "differences": ["The statement is about integers; the problem is about natural numbers."]}',
]

# A sentence that does not say which numbers it is about. The statements make
# different choices. One of them needs two repairs, each for what Lean
# reported, and then turns out to say what the first says; one cannot be
# stated at all, because the core library has no real numbers, and is given
# up after two rounds.
[[formalize]]
problem = "fixtures/formalize/problems/square-bound.txt"
candidates = 4
status = "formalized"
answers = [
  '{"candidates": [{"statement": "(n : Nat) : n ^ 2 ≥ n", "reading": "The numbers are the natural numbers."}, {"statement": "(n : ℕ) : n ≤ n²", "reading": "The same over the natural numbers, with the smaller side written first."}, {"statement": "(n : Int) : n ^ 2 ≥ n", "reading": "The numbers are the integers, negative ones included."}, {"statement": "(x : Real) : x ^ 2 ≥ x", "reading": "The numbers are the real numbers."}]}',
  '{"statement": "(n : ℕ) : n ≤ n ^ 2"}',
  '{"statement": "(n : Nat) : n ≤ n ^ 2"}',
  '{"statement": "(x : ℝ) : x ^ 2 ≥ x"}',
  '{"statement": "(x : Real) : x ≤ x ^ 2"}',
  '{"english": "For every natural number n, the square of n is greater than or equal to n."}',
  '{"score": 8, "differences": ["The problem speaks of every number; the statement covers the natural numbers only."]}',
  '{"english": "For every integer n, the square of n is greater than or equal to n."}',
  '{"score": 8, "differences": ["The problem speaks of every number; the statement covers the integers only."]}',
]

# Answers for the demonstration of `maithic council`. The models of the
# session are asked four times: the researcher once, the prover in the first
# round, the critic about the two proofs Lean rejected, and the prover again.
# One of the names the researcher gives does not exist, and Lean says so.
[[council]]
file = "examples/council.lean"
theorem = "sumOdd_eq_square"
status = "verified"
answers = [
  '{"names": ["sumOdd", "Nat.succ_mul", "Nat.mul_succ", "Nat.add_mul_self_eq", "Nat.mul_comm"], "ideas": ["Induction on n: in the step, unfold sumOdd, use the induction hypothesis, and compare both sides as polynomials in n."]}',
  '{"candidates": ["by\n  induction n <;> simp [sumOdd]", "by\n  induction n with\n  | zero => rfl\n  | succ k ih => simp [sumOdd, ih]; omega"]}',
  '{"diagnosis": "Both proofs get through the base case and stop in the step. After the induction hypothesis is used, the goal still holds the product (k + 1) * (k + 1). simp leaves it as it is, and omega cannot read it: omega decides linear arithmetic, and a product of two variables is not linear.", "suggestions": ["Rewrite the product with Nat.succ_mul and Nat.mul_succ first, so that k * k is the only product left on both sides, and call omega after that."]}',
  '{"candidates": ["by\n  induction n with\n  | zero => rfl\n  | succ k ih =>\n    simp only [sumOdd, ih, Nat.succ_mul, Nat.mul_succ]\n    omega"]}',
]

# The answer for the demonstration plan: `maithic blueprint plan` on an
# argument in words. One identifier is not plain and one reference names
# nothing, so that the run shows how an answer is put in order.
[[blueprint]]
file = "examples/blueprint/argument.md"
namespace = "Triangles"
answers = [
  '{"title": "Odd numbers, squares and triangles", "nodes": [{"id": "tri", "kind": "definition", "title": "Triangular numbers", "statement": "The n-th triangular number is the sum 1 + 2 + ... + n, defined by recursion on n.", "lean": "tri", "formal": "def tri : Nat → Nat\n  | 0 => 0\n  | n + 1 => tri n + (n + 1)", "uses": []}, {"id": "sum-odd", "kind": "definition", "title": "The sum of the first odd numbers", "statement": "The sum of the first n odd numbers, 1 + 3 + ... + (2n - 1), defined by recursion on n.", "lean": "sumOdd", "formal": "def sumOdd : Nat → Nat\n  | 0 => 0\n  | n + 1 => sumOdd n + (2 * n + 1)", "uses": []}, {"id": "tri-step", "kind": "lemma", "title": "The next triangular number", "statement": "The triangular number after the n-th is the n-th plus n + 1.", "proof": "This is the definition.", "lean": "tri_succ", "formal": "(n : Nat) : tri (n + 1) = tri n + (n + 1)", "uses": ["tri"], "proof_uses": []}, {"id": "tri-formula", "kind": "lemma", "title": "Twice a triangular number", "statement": "Twice the n-th triangular number is n (n + 1).", "proof": "By induction on n. In the step, 2 (tri n + (n + 1)) is n (n + 1) + 2 (n + 1) by the induction hypothesis, which is (n + 1) (n + 2).", "lean": "two_mul_tri", "formal": "(n : Nat) : 2 * tri n = n * (n + 1)", "uses": ["tri"], "proof_uses": ["tri-step", "gauss"]}, {"id": "odd-step", "kind": "lemma", "title": "The next odd number", "statement": "The sum of the first n + 1 odd numbers is the sum of the first n plus 2n + 1.", "proof": "This is the definition.", "lean": "sumOdd_succ", "formal": "(n : Nat) : sumOdd (n + 1) = sumOdd n + (2 * n + 1)", "uses": ["sum-odd"], "proof_uses": []}, {"id": "Odd Square", "kind": "theorem", "title": "Odd numbers add up to a square", "statement": "The first n odd numbers add up to n squared.", "proof": "By induction on n. In the step, n squared plus 2n + 1 is the square of n + 1.", "lean": "sumOdd_eq_square", "formal": "(n : Nat) : sumOdd n = n * n", "uses": ["sum-odd"], "proof_uses": ["odd-step"]}, {"id": "two-triangles", "kind": "lemma", "title": "Two triangles make a square", "statement": "The n-th triangular number and the next add up to the square of n + 1.", "proof": "The sum is twice the n-th triangular number plus n + 1, which is n (n + 1) + (n + 1).", "lean": "tri_add_tri_succ", "formal": "(n : Nat) : tri n + tri (n + 1) = (n + 1) * (n + 1)", "uses": ["tri"], "proof_uses": ["tri-step", "tri-formula"]}, {"id": "odd-triangles", "kind": "corollary", "title": "Odd numbers add up to two triangles", "statement": "The first n + 1 odd numbers add up to the n-th triangular number plus the next.", "proof": "Both sides are the square of n + 1.", "lean": "sumOdd_eq_two_triangles", "formal": "(n : Nat) : sumOdd (n + 1) = tri n + tri (n + 1)", "uses": ["sum-odd", "tri"], "proof_uses": ["Odd Square", "two-triangles"]}]}',
]

# The answers for the demonstration task of `maithic algo synth`. The first
# draft recurses on a list that Lean cannot see is shorter, the second
# compiles and loses a run, and the third is accepted: one answer for each
# kind of thing that Lean can report back.
[[algolab]]
file = "examples/algo/run-lengths.toml"
answers = [
  '{"implementation": "/-- The maximal runs of equal neighbours in `l`, in order, each as its value and its length; the empty list has no runs. -/\ndef runLengths (l : List Nat) : List (Nat × Nat) :=\n  match l with\n  | [] => []\n  | x :: rest =>\n    let run := rest.takeWhile (· == x)\n    (x, run.length + 1) :: runLengths (rest.dropWhile (· == x))", "notes": "Takes the whole run at the head, then goes on with what is left."}',
  '{"implementation": "/-- The maximal runs of equal neighbours in `l`, in order, each as its value and its length; the empty list has no runs. -/\ndef runLengths (l : List Nat) : List (Nat × Nat) :=\n  match l with\n  | [] => []\n  | x :: rest =>\n    match runLengths rest with\n    | (y, n) :: tail => if x = y then (y, n + 1) :: tail else (x, 1) :: tail\n    | [] => [(x, 1)]", "notes": "Recursion on the tail only, so that it is structural: the head joins the first run of the tail or starts a run."}',
  '{"implementation": "/-- The maximal runs of equal neighbours in `l`, in order, each as its value and its length; the empty list has no runs. -/\ndef runLengths (l : List Nat) : List (Nat × Nat) :=\n  match l with\n  | [] => []\n  | x :: rest =>\n    match runLengths rest with\n    | (y, n) :: tail => if x = y then (y, n + 1) :: tail else (x, 1) :: (y, n) :: tail\n    | [] => [(x, 1)]", "notes": "A head that starts a run of its own now keeps the run after it."}',
]
