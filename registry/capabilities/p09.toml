  tests = ["lean/MaithicTest/Bridge.lean"]

  [[group.capability]]
  id = "P09-02-04"
  title = "Protocol JSON instances"
  spec = "`ToJson` and `FromJson` for all protocol types."
  status = "done"
  tests = ["lean/MaithicTest/Bridge.lean"]

  [[group.capability]]
  id = "P09-02-05"
  title = "Serialization schema tests"
