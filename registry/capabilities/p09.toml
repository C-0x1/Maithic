# Capability register for P09 Bridge.
# Status and tests are kept in step with the test suites by `make cap-sync`.

[pillar]
id = "P09"
name = "Bridge"
title = "Lean interaction engine and verification sandbox"
mission = "Give every other component one fast, safe, typed way to talk to Lean: load environments, elaborate commands, step through proofs tactic by tactic, snapshot and restore states, and do all of it inside a sandbox."

[[group]]
id = "P09-01"
title = "Bridge server"
language = "Lean"
path = "lean/MaithicBridge/Server/"
purpose = "The Lean-side process that executes requests."

  [[group.capability]]
  id = "P09-01-01"
  title = "Server executable"
  spec = "`lake exe maithic-bridge` reads JSON requests on standard input and writes responses on standard output."
  status = "done"
  tests = ["lean/MaithicTest/Bridge.lean"]

  [[group.capability]]
  id = "P09-01-02"
  title = "Request loop"
  spec = "Line-delimited JSON-RPC 2.0 handling with correlated responses."
  status = "done"
  tests = ["lean/MaithicTest/Bridge.lean"]

  [[group.capability]]
  id = "P09-01-03"
  title = "Load-header request"
  spec = "Import a list of modules and create a base environment."
  status = "done"
  tests = ["lean/MaithicTest/Bridge.lean"]

  [[group.capability]]
  id = "P09-01-04"
  title = "Run-command request"
  spec = "Elaborate one or more commands in an environment and return messages."
  status = "done"
  tests = ["lean/MaithicTest/Bridge.lean"]

  [[group.capability]]
  id = "P09-01-05"
  title = "Start-proof request"
  spec = "Open a goal from a theorem statement or from a `sorry` position."
  status = "done"
  tests = ["lean/MaithicTest/Bridge.lean"]

  [[group.capability]]
  id = "P09-01-06"
  title = "Run-tactic request"
  spec = "Apply a tactic to a proof state and return the new state or a typed error."
  status = "done"
  tests = ["lean/MaithicTest/Bridge.lean", "ocaml/test/integration/test_integration.ml"]

  [[group.capability]]
  id = "P09-01-07"
  title = "Get-state request"
  spec = "Return the goals of a stored proof state."
  status = "done"
  tests = ["lean/MaithicTest/Bridge.lean"]

  [[group.capability]]
  id = "P09-01-08"
  title = "Version handshake"
  spec = "Report server version, Lean version and capabilities."
  status = "done"
  tests = ["lean/MaithicTest/Bridge.lean"]

  [[group.capability]]
  id = "P09-01-09"
  title = "State store"
  spec = "In-memory table of environments and proof states with identifiers."
  status = "done"
  tests = ["lean/MaithicTest/Bridge.lean"]

  [[group.capability]]
  id = "P09-01-10"
  title = "Whole-file check request"
  spec = "Elaborate a file's text and return diagnostics and unfinished proofs."
  status = "done"
  tests = ["lean/MaithicTest/Bridge.lean"]

  [[group.capability]]
  id = "P09-01-11"
  title = "Goal selection"
  spec = "Run a tactic on a chosen goal of a state."
  status = "done"
  tests = ["lean/MaithicTest/Bridge.lean"]

  [[group.capability]]
  id = "P09-01-12"
  title = "Tactic batch request"
  spec = "Try many tactics on one state and return all outcomes."
  status = "done"
  tests = ["lean/MaithicTest/Bridge.lean"]

  [[group.capability]]
  id = "P09-01-13"
  title = "Release-state request"
  spec = "Free stored states."
  status = "done"
  tests = ["lean/MaithicTest/Bridge.lean"]

  [[group.capability]]
  id = "P09-01-14"
  title = "Typed error returns"
  spec = "Error codes and structured fields instead of free text."
  status = "done"
  tests = ["lean/MaithicTest/Bridge.lean"]

  [[group.capability]]
  id = "P09-01-15"
  title = "Server shutdown"
  spec = "Clean shutdown on request or end of input."
  status = "done"
  tests = ["lean/MaithicTest/Bridge.lean"]

  [[group.capability]]
  id = "P09-01-16"
  title = "Server self-test"
  spec = "Request that exercises core functions and reports health."
  status = "done"
  tests = ["lean/MaithicTest/Bridge.lean"]

  [[group.capability]]
  id = "P09-01-17"
  title = "Server test suite"
  spec = "Scripted request files with expected responses."
  status = "done"
  tests = ["lean/MaithicTest/Bridge.lean"]

