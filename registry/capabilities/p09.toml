  [[group.capability]]
  id = "P09-02-06"
  title = "Goal tags"
  spec = "Case names and tags of goals."
  status = "done"
  tests = ["lean/MaithicTest/Bridge.lean"]

  [[group.capability]]
  id = "P09-02-07"
  title = "Safe string escaping"
  spec = "Correct escaping of every string."
  status = "done"
  tests = ["lean/MaithicTest/Bridge.lean"]

  [[group.capability]]
  id = "P09-02-08"
  title = "Serialization round-trip tests"
  spec = "Encode and decode identity tests."
  status = "done"
  tests = ["lean/MaithicTest/Bridge.lean"]

