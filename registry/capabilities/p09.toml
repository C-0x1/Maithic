  id = "P09-05-01"
  title = "Wall-clock limit"
  spec = "Kill processes that exceed time limits."
  status = "done"
  tests = ["ocaml/test/test_bridge.ml"]

  [[group.capability]]
  id = "P09-05-02"
  title = "Environment scrubbing"
  spec = "Pass only allowlisted environment variables and never any API key."
  status = "done"
  tests = ["ocaml/test/test_bridge.ml"]

  [[group.capability]]
  id = "P09-05-03"
  title = "Isolation capability report"
  spec = "`maithic doctor` reports which isolation features are active."
  status = "done"
  tests = ["ocaml/test/integration/test_integration.ml"]

  [[group.capability]]
  id = "P09-05-04"
