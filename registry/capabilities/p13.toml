# Capability register for P13 Oracle.
# Status and tests are kept in step with the test suites by `make cap-sync`.

[pillar]
id = "P13"
name = "Oracle"
title = "Certified computation bridge"
mission = "Let fast numerical and symbolic computation contribute to proofs without being trusted: Julia finds a certificate (multipliers, a decomposition, a witness, an enclosure) and a small Lean checker turns it into a kernel-checked proof."

[[group]]
id = "P13-01"
title = "Certificate protocol and registry"
language = "OCaml"
path = "ocaml/lib/oracle/core/"
purpose = "The contract between untrusted solvers and trusted checkers."

  [[group.capability]]
  id = "P13-01-01"
  title = "Oracle interface"
  spec = "Module type for an oracle: name, accepted goal kinds, solve function."
  status = "done"
  tests = ["ocaml/test/test_oracle.ml"]

  [[group.capability]]
  id = "P13-01-02"
  title = "Certificate schema"
  spec = "JSON Schemas for every certificate kind."
  status = "done"
  tests = ["ocaml/test/test_oracle.ml"]

  [[group.capability]]
  id = "P13-01-03"
  title = "Oracle registry"
  spec = "Register and look up oracles by name and goal kind."
  status = "done"
  tests = ["ocaml/test/integration/test_integration.ml", "ocaml/test/test_oracle.ml"]

  [[group.capability]]
  id = "P13-01-04"
  title = "Goal export"
  spec = "Export a Lean goal in the oracle exchange format."
  status = "done"
  tests = ["ocaml/test/integration/test_integration.ml", "ocaml/test/test_oracle.ml"]

  [[group.capability]]
  id = "P13-01-05"
  title = "Solve dispatch"
  spec = "Send a goal to an oracle with a time limit."
  status = "done"
  tests = ["julia/MaithicOracle/test/linear.jl", "ocaml/test/integration/test_integration.ml", "ocaml/test/test_oracle.ml"]

  [[group.capability]]
  id = "P13-01-06"
  title = "Certificate hand-off"
  spec = "Pass the certificate to the matching Lean checker tactic."
  status = "done"
  tests = ["ocaml/test/integration/test_integration.ml", "ocaml/test/test_oracle.ml"]

  [[group.capability]]
  id = "P13-01-07"
  title = "Oracle result record"
  spec = "Outcome, certificate reference and timings."
  status = "done"
  tests = ["ocaml/test/test_oracle.ml"]

  [[group.capability]]
  id = "P13-01-08"
  title = "Protocol fixtures"
  spec = "Fixture goals and certificates for each kind."
  status = "done"
  tests = ["ocaml/test/test_oracle.ml"]

